*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:ReportSans,'Noto Sans KR',Pretendard,'Malgun Gothic',
    'Apple SD Gothic Neo',system-ui,sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
  word-break:keep-all}
.serif{font-family:ReportSerif,'Noto Serif KR','Nanum Myeongjo',Batang,serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,ReportSans,'Noto Sans KR',monospace;
  font-variant-numeric:tabular-nums; font-size:.84em; letter-spacing:.01em}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.pad{padding:0 clamp(16px,2.2vw,34px)}

/* ---------- masthead ---------- */
.rule-accent{height:2px; background:var(--accent)}
.mast{background:var(--surface); border-bottom:1px solid var(--rule)}
.mast-in{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 22px; padding-top:22px; padding-bottom:17px}
.mast h1{font-size:28px; margin:0; font-weight:600; letter-spacing:-.01em}
.mast .sub{color:var(--ink-3); font-size:12.5px; line-height:1.55; margin:0}
.mast .sub b{color:var(--ink-2); font-weight:600}

/* ---------- controls ---------- */
.controls{position:sticky; top:0; z-index:30; background:var(--paper); border-bottom:1px solid var(--rule)}
.controls-in{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding-top:10px; padding-bottom:10px}
.search{flex:0 1 320px; display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--rule); padding:6px 11px}
.search input{flex:1; border:0; background:none; color:var(--ink); font:inherit; font-size:14px; min-width:0}
.search input::placeholder{color:var(--ink-3)}
.search svg{flex:none; stroke:var(--ink-3)}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{font-size:12px; padding:3px 10px; border:1px solid var(--rule); background:var(--surface);
  color:var(--ink-2); cursor:pointer; line-height:1.5; font-family:inherit;
  transition:background .12s,border-color .12s,color .12s}
.chip:hover{border-color:var(--accent); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.spacer{flex:1 1 auto}
.count{color:var(--ink-3); font-size:12px; white-space:nowrap}
.linkbtn{background:none; border:0; font:inherit; font-size:12px; color:var(--accent);
  cursor:pointer; padding:3px 2px; text-decoration:underline; text-underline-offset:3px}

/* ---------- table ---------- */
main{padding-top:26px; padding-bottom:70px}
table{width:100%; border-collapse:collapse; table-layout:fixed}
caption{text-align:left; padding:22px 0 7px; border-bottom:2px solid var(--ink)}
caption .ct{font-size:18px; font-weight:600; letter-spacing:-.01em}

 0.84명 중 0.29명 채용), 경영 애로 1위는 자금 조달·운용 51.9%","생성형 AI 활용 45.6%, 그중 전사 도입 37.9% — 게임 74.2%, 애니메이션 9.6%로 격차"],"why":"도 업무보고·사업계획서에 쓰는 '최신 콘텐츠산업 규모'를 2분기 기준으로 바꿀 수 있는 공식 자료다. 다만 상반기 합계만 인용하면 '수출 증가'로 보이므로, 2분기 수출 감소와 방송·영상 급감을 함께 적어야 정확하다. '매출은 늘고 고용은 준다', '상장사만 크게 성장한다'는 구조는 중소기업 자금·인력 지원 사업의 필요성 논리로 바로 쓸 수 있고, 애로사항 1위(자금 51.9%)와 충원율 34.5%는 예산 건의 근거로 활용 가능하다. 생성형 AI 활용률의 장르 격차는 진흥원 AI 콘텐츠 지원 대상을 정할 때 참고하기 좋다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158949/2012687.do?menuNo=204157","file":"2026-10-21/2026년 2분기 콘텐츠산업 동향분석 보고서.pdf","_recent":true},{"id":"2026-09-16-kocca-la-music-cinema","week":"2026-10-21","title":"영화관으로 확장되는 미국 음악 비즈니스: 콘서트 영화·라이브뷰잉·컴백 이벤트로 넓어지는 음악 IP 수익화 (미국 26-05호)","issuer":"한국콘텐츠진흥원 미국(LA)비즈니스센터","type":"해외 산업동향","published":"2026-09-16","pages":24,"size":"1.0MB","genres":["음악·공연","글로벌·수출","IP·공간"],"tags":["이벤트 시네마","콘서트 영화","라이브뷰잉","컴백 이벤트","프리미엄 포맷","트라팔가","AMC","K-팝"],"lede":"콘서트 영화에서 앨범 공개 이벤트까지 — 영화관이 음악 IP의 두 번째 매출 창구가 되는 구조","speakers":[{"name":"김봉채","role":"스트라베이스 선임연구원","topic":"집필"},{"name":"박병호","role":"한국콘텐츠진흥원 LA비즈니스센터장","topic":"감수"}],"summary":"미국 음악산업이 영화관을 공연 실황 상영관을 넘어 라이브뷰잉·신보 공개·아카이브 재상품화까지 쓰는 '이벤트 시네마' 흐름을 사례와 계약구조 중심으로 정리했다. 배경은 공연시장의 포화다. 2025년 북미 상위 100개 투어 매출은 약 58억 달러로 2019년보다 55% 많지만 전년 대비 6.6% 줄었고, 2026년 상반기 증가율은 0.1%로 멈췄다. 같은 공연 IP를 다른 창구로 파는 수요가 생긴 것이다. 보고서는 영화관 활용을 다섯 유형으로 나눈다. ①콘서트 영화(테일러 스위프트 〈디 에라스 투어〉 글로벌 2억 6,166만 달러, 스트레이 키즈 〈도미네이트 익스피리언스〉 2,347만 달러) ②라이브뷰잉(콜드플레이 81개국 3,593개관, BTS '아리랑' 고양·도쿄 공연) ③앨범·컴백 연계(메가데스가 발매 전날 전곡 선공개를 유료 극장 이벤트로, 하이브·게펀의 캣츠아이는 극장판 공개 이틀 뒤 EP 발매) ④아카이브 복원(후안 가브리엘 1990년 공연) ⑤AMC·아레나 원의 '분산형 라이브 공연장'. 수익모델은 프리미엄 포맷이 핵심인데, BTS 〈옛 투 컴 인 시네마〉는 ScreenX·4DX가 스크린의 약 10%로 박스오피스의 약 25%를, 슈가 콘서트 영화는 IMAX가 약 20%를 벌었다. 〈에라스 투어〉 개봉 전후 3주간 미국 내 스트리밍이 52.6% 늘었다는 루미네이트 분석도 소개하지만, 같은 기간 신보가 나와 효과가 섞였다는 점을 보고서 스스로 짚는다. 실무적으로 가장 쓸모 있는 부분은 트라팔가 표준계약 분석이다. 극장은 사전판매 단계부터 회차별 판매량·가격을, 상영 후 7일 안에 실입장객·환불·프리미엄 추가요금까지 배급사에 보고하므로 투어 미방문 지역의 '돈을 낸 수요'를 확인할 수 있다. 다만 권리자가 원자료를 얼마나 받는지는 계약마다 다르고, AMC가 여름 흥행작 때문에 라이브뷰잉 시리즈를 연기·환불한 사례처럼 극장 편성 리스크도 있다. 결론은 K-팝이 투어 연계형·컴백 연계형·아카이브형 중 목적부터 정하고, 미국을 테스트 시장으로 단계적으로 확장하라는 것이다.","keypoints":["북미 상위 100개 투어 매출: 2025년 58억 달러(-6.6%), 2026 상반기 +0.1% — 공연 단일 창구의 성장 둔화","BTS 〈옛 투 컴 인 시네마〉: 프리미엄관이 스크린 10%로 매출 25%, 슈가 영화는 IMAX가 매출 20%","컴백 연계형 등장: 메가데스는 발매 전날 전곡 선공개를, 캣츠아이는 극장판 공개 이틀 뒤 EP 발매","트라팔가 표준계약: 극장이 회차별 판매·입장·환불 데이터를 주간·7일 내 보고 → 지역별 유료 수요 지표","리스크: 필름 렌탈·포맷 정산으로 권리자 몫 축소, 여름 성수기엔 AMC가 라이브뷰잉 연기·환불","제언: 투어 기획 단계부터 촬영·라이브뷰잉 설계, 미국 일부 도시 한정 상영으로 수요 검증 후 확대"],"why":"경기도 내 공연·음악 기업이나 지역 축제 공연을 극장·라이브뷰잉으로 재유통하는 사업을 기획할 때 바로 참고할 수 있는 유형 분류와 수익배분 구조가 정리돼 있다. 특히 '극장 판매 데이터로 투어 후보 지역을 검증한다'는 논리는 해외 진출 지원사업의 시장검증 단계(테스트 상영) 설계에 응용할 수 있다. 상영관·배급·포맷사업자 역할 분담 표는 진흥원이 중소 기획사와 극장·배급사를 연결하는 매칭 사업을 설명하는 근거로 쓸 만하다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158950/2012684.do?menuNo=204160","file":"2026-10-21/[미국(LA) 동향보고서 5호]음악-영화관.pdf","_recent":true},{"id":"2026-10-16-gca-aiaward-forum-cho-youngshin","week":"2026-10-21","title":"한국 영상산업의 변화와 AI 창작의 미래 (대한민국 AI 콘텐츠 어워즈 포럼)","issuer":"경기콘텐츠진흥원 「대한민국 AI 콘텐츠 어워즈」 포럼","type":"포럼 발표자료","published":"2026-10-16","pages":25,"size":"4.1MB","genres":["AI·기술","영상·방송"],"tags":["생성형 AI 영상","하이브리드 제작","Seedance","Kling","Veo","제작비","하이엔드","레거시 미디어"],"lede":"AI는 와이드·군중·폭발을 맡고 사람은 표정·연기를 맡는다 — 다만 레거시 시장은 못 바꾼다","speakers":[{"name":"조영신","role":"미디어엔터연구소 C&X","topic":"한국 영상산업의 변화와 AI 창작의 미래"}],"summary":"생성형 AI 영상의 기술 진화와 그 한계를 한 장에 한 문장씩 정리한 발제다. 앞부분은 도구 지형 변화다. Sora는 2024년 12월 공개 뒤 2026년 4월 앱, 9월 API가 종료됐고, Runway는 초기 주력에서 뒤로 밀렸으며, Kling은 국내 현업 주력 툴 중 하나, Seedance는 2.0(2026.2) 이후 반년 만에 현업 표준이 됐다. Wan은 2.2까지 오픈소스였다가 3.0(2026.8)에서 가중치를 비공개로 돌렸다. 소리 동시 생성(Veo 3), 한 번에 15초(Kling 3.0), 4K 출력, 참조 이미지 30장(Seedance 2.5)으로 어제의 한계는 풀렸지만, 장면이 길어질 때의 일관성·클로즈업 표정 연기·같은 장면 재현은 오늘의 한계로 남았다. 핵심 논지는 '확률 게임'이다. 같은 프롬프트도 매번 결과가 다르고, 수십 개 후보 중 하나를 고르는 '눈'이 수준을 정한다. 생성 횟수를 10→1,000번으로 늘려도 노하우는 쌓이지 않으며, 독창적인 것은 확률 분포 밖, 사람의 시각에서 나온다. 그래서 한 사람이 모든 영역을 고르면 결과물은 가장 낮은 눈에 맞춰져 유튜브 수준에 머물고, 연출·작가·촬영·미술·편집이 각자 고르면 하이엔드가 된다. AI가 잘하는 것은 와이드·배경·군중·폭발·붕괴이고, 사람은 클로즈업·표정·대사·동작을 맡는 하이브리드 제작이 기본이 된다(예시: 제작비 100억→5억, 기간 2년→3개월). 하지만 결론은 신중하다. 64번 생성해 1컷을 건지는 구조라 작품 하나에 유료 크레딧만 약 7억 원이 들고, 오픈소스를 돌리려면 GPU 팜이 필요하다. 모두가 쓰면 무기가 되지 못하며, AI발 공급 폭증은 무료 유튜브 시장에서 일어나고 유료 콘텐츠에 대한 기대는 오히려 높아진다. 레거시의 숙제는 '유료로 보는 1%', 슈퍼 하이엔드를 만들 수 있느냐다.","keypoints":["Sora 앱(2026.4)·API(2026.9) 종료, Seedance 2.0 이후 반년 만에 현업 표준, Wan 3.0은 가중치 비공개 전환","남은 한계: 긴 장면의 일관성, 클로즈업 표정 연기, 같은 장면 재현","확률 게임: 생성 횟수를 늘려도 노하우는 쌓이지 않고, 고르는 '눈'이 품질을 결정","하이브리드 제작: 와이드·배경·군중은 AI, 클로즈업·표정·동작은 실사(예시 제작비 100억→5억, 2년→3개월)","AI는 충분히 싸지 않다: 64번 생성에 1컷, 작품당 유료 크레딧 약 7억 원","공급 폭증은 무료 유튜브에서, 유료 시장은 기대치가 올라감 — 레거시의 과제는 상위 1% 하이엔드"],"why":"진흥원이 직접 연 포럼의 발제라, AI 영상 지원사업의 방향을 잡을 때 내부 근거로 바로 인용할 수 있다. '한 사람이 다 하면 가장 낮은 눈에 맞춰진다'는 논지는 1인 창작자 지원보다 연출·촬영·편집이 함께하는 팀 단위 지원, 실사+AI 하이브리드 제작 지원이 필요하다는 기획 논리가 된다. 작품당 크레딧 약 7억 원, GPU 팜 필요라는 지적은 제작비·컴퓨팅 바우처 같은 인프라 지원의 필요성을 설명하는 데 쓸 수 있다. 다만 100억→5억 사례는 슬라이드상 예시 수치이므로 대외문서 인용 시 출처를 확인할 것.","url":"","file":"2026-10-21/AI가 바꾸는 미디어 생태계 변화_ver(261016a).pdf","_recent":true},{"id":"2026-10-gca-aiaward-forum-lee-sunpil","week":"2026-10-21","title":"AI 영상 콘텐츠의 봄은 오는가 — 취재로 발견한 사실들 (대한민국 AI 콘텐츠 어워즈 포럼 6-2)","issuer":"경기콘텐츠진흥원 「대한민국 AI 콘텐츠 어워즈」 포럼","type":"포럼 발표자료","published":"2026-10-16","pages":20,"size":"6.4MB","genres":["AI·기술","영상·방송"],"tags":["AI 영화","ACFM","프리프리프로덕션","제작비 절감","배우 동의","아덴만","웜 트레인","요괴전"],"lede":"'90% 절감'은 특정 시퀀스 얘기 — 작품 전체로는 5~10%라는 현장 취재","speakers":[{"name":"이선필","role":"오마이뉴스 기자","topic":"AI 영상 콘텐츠의 봄은 오는가: 취재로 발견한 사실들"}],"summary":"부산 ACFM과 국내외 제작 현장을 취재한 기자가 'AI 영화'의 실제 모습을 사례 중심으로 정리했다. 첫째, 현장의 질문이 'AI로 무엇을 만들 수 있나'에서 '무엇을 AI로 만드는 게 효과적인가'로 바뀌었다. 한 제작팀은 작품당 AI 적용 컷이 2025년 20~30컷에서 2026년 백 단위로 늘었다(발제자는 업계 평균이 아니라고 명시). 둘째, 제작비 절감은 '분모'를 확인해야 한다. 특정 시퀀스에서 90% 절감이라는 주장과 작품 전체 예산 기준 5~10%라는 국내 현장 경험은 다른 얘기이며, 비용에는 생성 크레디트뿐 아니라 사람의 시간·재작업·합성·색보정이 들어간다. 셋째, 그린라이트 직후 주요 스태프를 꾸리기 전에 룩·공간·어려운 시퀀스를 AI로 먼저 시험하는 '프프리(프리-프리프로덕션)'가 자리 잡고 있다. 강윤성 감독의 〈아덴만〉은 AI로 화면을 먼저 만든 뒤 배우 드라마는 실사, 조타실은 세트·CG, 대규모 접근·승선 장면은 AI로 나눴다. 해외 사례로는 1,300여 숏의 VFX 중 약 70숏에 생성형 AI 군중을 쓴 〈브라질 70〉, 실사와 Veo를 결합한 〈ANCESTRA〉, 생성 배경 위에서 배우를 촬영한 〈MythOS〉 등을 들었다. 국내에서는 가상 아이돌 춤선(MBC C&I 〈렌더링 러브〉), OTT 납품 품질 검수(〈나타샤〉), 수만 개 생성 자료 관리와 모델이 바뀌어도 일관성을 지키는 제작 플랫폼 구축(클라이맥스 스튜디오 〈요괴전〉)이 과제로 꼽혔다. 감독들의 고민은 통제(인물·시선·컷의 일관성), 동의(얼굴 사용 범위·기간, 입력 자료의 학습 조건), 협업(AI·VFX 슈퍼바이저와 기존 스태프의 결합)으로 모인다. 결론은 '좋은 작품이 관객을 만나 다음 작품을 가능하게 하는가'다. 이를 위해 먼저 시험할 시간, 실제 비용·재작업 기록, 작은 팀과 전문 후반의 연결, 유통·배급 경로가 필요하다고 제언했다.","keypoints":["현장 질문의 전환: 'AI로 무엇을 만들 수 있나' → '무엇을 AI로 만드는 게 효과적인가'","제작비 절감은 분모 확인 필수: 특정 시퀀스 90% vs 작품 전체 5~10%(국내 현장 경험, 평균치 아님)","'프프리': 스태프 구성 전 AI로 룩·어려운 시퀀스를 먼저 검증해 촬영·CG·AI 역할 분담 결정(〈아덴만〉)","〈브라질 70〉: VFX 1,300+숏 중 약 70숏에 AI 군중 — CG와 합성 사이를 메우는 용도","장편 과제는 제작 체계: 수만 개 생성 자료 관리, 모델 교체에도 일관성 유지(〈요괴전〉)","감독들의 3대 고민: 통제·동의(배우 외형 사용 범위·기간)·협업"],"why":"진흥원 포럼 발제라 내부 근거로 바로 쓸 수 있다. '절감률의 분모' 지적은 AI 제작지원 사업의 성과지표를 잡을 때 특히 유용하다 — 시퀀스 단위 절감률이 아니라 작품 전체 비용과 재작업 기록을 제출받도록 설계해야 한다는 근거가 된다. '프프리' 단계 지원(본제작 전 AI 테스트 비용)과 작은 AI 팀과 전문 후반 업체 매칭은 기존 제작지원과 차별화된 신규 사업 아이디어로 검토할 만하다. 배우 외형 사용 동의·학습 조건 문제는 지원작 계약서 표준 조항에 반영할 거리다.","url":"","file":"2026-10-21/포럼6-2.AI_영상_콘텐츠의_봄은_오는가_발표자료_최종.pdf","_recent":true},{"id":"2026-10-07-kocca-focus-217-cbi-2026q3q4","week":"2026-10-14","title":"[KOCCA포커스 통권 217호] 2026년 3분기·4분기 콘텐츠산업 동향 및 경영체감도(CBI) 분석","issuer":"한국콘텐츠진흥원 정책연구본부 데이터정책팀","type":"이슈리포트","published":"2026-10-07","pages":20,"size":"2.6MB","genres":["정책·산업","음악·공연","게임"],"tags":["CBI","경영체감도","실적 양극화","하이브","크래프톤","하츄핑","팝업스토어","웹툰 불법유통"],"lede":"3분기 기대(101.5)가 체감(98.5)으로 꺾였다 — 장르마다 '대형사만 웃는' 양극화","speakers":[{"name":"데이터정책팀","role":"한국콘텐츠진흥원 정책연구본부","topic":"공동 집필"}],"summary":"분기별 콘텐츠산업 실태조사와 같은 표본 2,500개 사에 매출·수출·투자·고용·자금사정 다섯 부문의 전분기 대비 체감과 전망을 7점 척도로 묻고(조사 2026.8.4~9.4), 100점을 기준으로 지수화했다. 핵심은 '기대와 체감의 낙차'다. 5~6월 조사에서 3분기를 101.5점으로 낙관했던 업계가 실제로는 98.5점으로 체감했고, 매출 부문은 104.9점 전망이 96.2점 체감으로 8.7점이나 꺾였다. 낙폭이 가장 큰 업종은 지식정보(105.1→97.3)였다. 그런데도 4분기 전망은 100.4점으로 다시 100을 넘겨, '체감은 나빴지만 기대는 접지 않는' 패턴이 3분기째 반복된다. 보고서는 장르별로 이 낙차를 실적 기사로 해부하는데, 결론은 한결같이 양극화다. 음악은 하이브가 BTS 월드투어로 분기 매출 1조 4,500억 원(공연 매출 +243%)을 찍었지만 상위 10개 공연이 공연시장 매출의 26.9%, 1만 석 이상 공연장이 55.2%를 가져가 중소 기획사의 수출·고용 체감은 100 아래다. 게임도 크래프톤(영업이익률 31.8%)·엔씨(해외 비중 52%)가 최대 실적을 내는 사이 카카오게임즈는 7분기 연속 적자다. 애니메이션은 '사랑의 하츄핑' 극장판이 80만 관객을 넘겼는데도 SAMG의 2분기 영업이익은 61% 줄었다 — 흥행과 수익 인식 사이의 시차가 고용·자금 체감을 끌어내린다는 해석이다. 캐릭터는 상반기 팝업스토어가 2,130건(+44.9%)으로 늘었지만 운영비가 함께 커져 매출 체감이 93.1점에 그쳤고, 그 반동으로 4분기 매출 전망은 121.1점으로 전 업종 최고다. 방송은 371개 방송사업자 매출이 3년 연속 감소(18.6조 원, -0.8%)한 가운데 티빙·스튜디오드래곤 등 OTT·제작사의 흑자 전환이 4분기 긍정 전망(101.1)을 받친다. 한편 요약면(p.2)은 3분기 체감을 '전망 100.4점 대비'라고 적었는데 100.4는 4분기 전망치이고, 3분기 전망은 본문 표의 101.5점이 맞다.","keypoints":["전체 CBI: 3분기 전망 101.5 → 체감 98.5, 매출은 104.9 → 96.2로 낙폭 최대. 4분기 전망은 100.4로 다시 낙관","지식정보산업 전망-체감 격차 -7.8점(105.1→97.3)으로 전 업종 최대","음악: 상위 10개 공연이 매출 26.9%, 1만 석 이상 공연장이 55.2% 점유 — 성장의 과실이 대형사에 집중","게임: 크래프톤 영업익 4,109억(31.8%) vs 카카오게임즈 7분기 연속 적자 — 중견사 신작 공백","애니: 하츄핑 극장판 80만 흥행에도 SAMG 2분기 영업익 -61.3%, 해외 매출 비중은 40%로 급등","캐릭터: 팝업 2,130건(+44.9%)에도 매출 체감 93.1, 4분기 매출 전망은 121.1로 전 업종 최고"],"why":"분기마다 나오는 공식 체감지표라, 도내 콘텐츠기업 지원사업의 필요성을 쓸 때 '업계 체감은 3분기 연속 기대 이하'라는 근거로 바로 인용할 수 있다. 장르별로 '대형사 호실적 vs 중소기업 체감 악화'가 일관되게 확인되므로, 진흥원 지원이 왜 중소·신생 기업에 집중돼야 하는지 설명하는 논리로 쓰기 좋다. 캐릭터 팝업·공연 쏠림 데이터는 경기도 IP 페어·지역 공연 사업의 기획 배경 자료로도 활용 가능하다. 인용 시 요약면의 3분기 전망치 오기(100.4→101.5)는 바로잡아 쓸 것.","url":"https://www.kocca.kr/kocca/bbs/view/B0000141/2012642.do?menuNo=204145","file":"2026-10-14/[KOCCA포커스 통권 217호] [2026년 3분기·4분기] 콘텐츠산업 동향 및 경영체감도(CBI) 분석.pdf","_recent":true},{"id":"2026-10-13-kcti-content-firms-2025q4","week":"2026-10-14","title":"콘텐츠 산업 기업 동향 (2025년 4분기 기준)","issuer":"한국문화관광연구원 데이터정책본부 데이터전략실","type":"산업통계","published":"2026-10-13","pages":29,"size":"582KB","genres":["정책·산업"],"tags":["기업통계등록부","업력","창업기업","수도권 집중","경기도","종사자","콘텐츠산업 특수분류"],"lede":"기업은 10만 개를 넘었지만 3년 미만 신생기업은 거의 전 업종에서 줄고 있다","speakers":[{"name":"채예린","role":"한국문화관광연구원 데이터전략실 연구원","topic":"작성"},{"name":"오시진","role":"한국문화관광연구원 데이터전략실 차석전문원","topic":"작성"}],"summary":"국가데이터처 기업통계등록부 분기 자료를 「콘텐츠산업 특수분류」로 재가공한 기업(본사) 단위 가공통계다. 국가승인통계가 아니어서 총량보다 증감률을 보라고 일러두기에 적혀 있다. 2025년 4분기 콘텐츠 기업은 101,525개로 처음 10만 개를 넘었고(전년동기 +3.4%, +3,340개), 종사자는 1,492,115명(+2.1%, +30,621명)이다. 3분기판(기업 +2.7%, 종사자 +1.1%)보다 증가 속도가 빨라졌다. 상용직(+2.1%)과 임시일용직(+2.0%)이 비슷하게 늘어 3분기에 보였던 '비정규 대체' 신호는 전체 수준에선 옅어졌다. 지역 구조는 그대로다. 기업의 78.5%, 종사자의 79.4%가 수도권이고, 경기는 기업 비중 25.6%에 종사자 비중 18.1%로 7.5%p 차이가 나 서울(49.3% / 59.0%)에 비해 기업당 규모가 작다. 이번 호에서 가장 눈여겨볼 것은 새로 붙은 '업력별 현황'이다. 13개 업종을 업력 3년 미만 / 3~7년 / 7년 이상으로 나눠 보면 거의 모든 업종에서 같은 그림이 나온다. 7년 이상 기업은 기업 수와 종사자 수가 함께 늘고, 3~7년 기업은 숫자는 늘어도 종사자는 줄며, 3년 미만 신생기업은 기업 수와 종사자 수가 모두 감소한다. 3년 미만 기업 수는 영화(-7.5%)·방송(-6.9%)·만화(-6.3%)·음악·출판(각 -6.0%)에서 줄었고, 종사자는 방송(-15.9%)·영화(-12.6%)·애니메이션(-10.5%)·음악(-10.3%) 순으로 크게 줄었다. 반대로 7년 이상 기업은 음악(+10.3%)·영화(+11.1%)·만화(+10.2%)에서 두 자릿수로 늘었다. 결국 전체 기업 수 증가는 신규 진입이 아니라 기존 기업의 생존·고령화가 이끈다는 뜻이다. 예외는 공연(3년 미만 종사자 +16.5%)과 게임(3년 미만 종사자 2분기 연속 증가), 그리고 4분기에 3년 미만 기업 수가 증가로 돌아선 애니메이션·지식정보·콘텐츠솔루션 정도다.","keypoints":["기업 101,525개(+3.4%)·종사자 1,492,115명(+2.1%) — 3분기판(+2.7%/+1.1%)보다 증가세 확대","업력 3년 미만 기업이 출판·만화·음악·영화·방송 등에서 일제히 감소(-6~-7.5%), 종사자는 방송 -15.9%·영화 -12.6%","7년 이상 기업은 음악 +10.3%·영화 +11.1%·만화 +10.2% — 성장은 신규 진입이 아니라 기존 기업 몫","3~7년 기업은 수는 늘어도 종사자는 감소 — 데스밸리 구간 기업의 고용 축소","수도권 집중: 기업 78.5%·종사자 79.4%, 경기 기업 25.6% 대 종사자 18.1%","예외: 공연 3년 미만 종사자 +16.5%, 애니·지식정보·콘텐츠솔루션은 4분기 3년 미만 기업 수 증가 전환"],"why":"업력별 분해가 처음 공개돼, 진흥원 창업·초기기업 지원사업의 필요성을 수치로 뒷받침할 수 있다('3년 미만 콘텐츠기업이 거의 전 업종에서 감소'). 경기도 기업 비중(25.6%)과 종사자 비중(18.1%)의 격차는 '도내 기업 영세성 → 스케일업 지원' 논리의 근거로 계속 쓸 수 있는 지표다. 분기 시계열이라 3분기판과 나란히 놓으면 고용 증가세 회복 여부를 업무보고에 간단히 정리할 수 있다. 다만 가공통계이므로 대외문서엔 '국가승인통계 아님'을 병기할 것.","url":"https://www.kcti.re.kr/web/board/boardContentsView.do?board_id=34&contents_id=dd0f8f1178464265ba3b05e32e4e9f60","file":"2026-10-14/콘텐츠 산업 기업 동향(2025년 4분기 기준)_게시용.pdf","_recent":true},{"id":"2026-08-27-nars-audit-issues-4-culture-media","week":"2026-10-14","title":"2026 국정감사 이슈 분석 Ⅳ (사회·문화 분야) — 콘텐츠·미디어 꼭지","issuer":"국회입법조사처 사회문화조사실","type":"이슈리포트","published":"2026-08-27","pages":418,"size":"5.7MB","genres":["정책·산업","영상·방송","AI·기술"],"tags":["국정감사","AI 생성물 표시","통합미디어법","JTBC 회생","지역 미디어","실감형 광화문","대중문화예술기획업","저작권 신탁관리"],"lede":"10월 국감에서 문체부·방미통위가 받을 질문 — 광화문 622억, AI 표시의무, OTT 거버넌스","speakers":[{"name":"국회입법조사처 교육문화과","role":"사회문화조사실","topic":"문화체육관광위원회 꼭지(AI 표시의무·광화문 프로젝트·기획업 등록·신탁관리업)"},{"name":"국회입법조사처 과학방송통신과","role":"사회문화조사실","topic":"방송미디어통신위원회 꼭지(JTBC·지역 미디어·K-미디어 거버넌스·인앱결제)"}],"summary":"국회입법조사처가 제22대 후반기 첫 국정감사를 앞두고 낸 281개 주제의 '질문집' 가운데 사회·문화 분야 4권이다. 주제마다 현황·문제점과 질문 예시, 정부에 요구할 자료 목록이 붙어 있다. 이 가운데 콘텐츠·미디어 관련 꼭지 8개를 골라 읽었다. 가장 날카로운 것은 '실감형 광화문 프로젝트'다. 문체부가 2020~2025년 622억 원을 투입했는데, 중기재정소요를 예타 기준(500억 원) 바로 아래인 490억 원으로 잡았다가 실제 집행은 622억 원까지 늘었다. 콘텐츠 8종 가운데 계획대로 운영 중인 것은 '광화벽화' 하나뿐이고, '광화경'은 29일 운영에 체험자 104명, '광화전차'는 26억 원을 들여 52일 운영하고 철거한 뒤 5억 원을 더 들여 다시 만들었다. 거점·콘텐츠 제작비는 388억 원에서 286억 원으로 줄고 기획·홍보·운영비는 12억 원에서 114억 원으로 약 10배 늘었으며, 원본 파일·소스코드도 확보하지 못했다(감사원 지적 12건). 둘째, AI기본법 제31조의 생성물 표시 의무는 'AI사업자'에게 부과되지만 실제 부담은 그 생성물을 편집·합성하는 콘텐츠 제작 현장이 진다는 지적이다. 게임 '붉은사막'의 AI 활용 미고지 논란, 'AI 딸깍 출판' 납본 문제를 사례로 들며, 문체부가 2025년 간담회 두 번 이후 후속 조치가 없다고 따진다. 셋째, 방송·OTT 정책이 방미통위·과기정통부·문체부로 쪼개진 사이 방송사업 매출은 19.9조 원(2022)에서 18.6조 원(2025)으로 줄었고, 넷플릭스 국내 매출은 1조 542억 원으로 티빙(4,060억)·웨이브(1,810억)를 합친 것의 약 1.8배다. 통합미디어법도 부처 간 이견으로 진척이 없다. 이 밖에 JTBC 회생 신청(206억 원 채무불이행)과 외주제작사 대금, 지역방송 지원예산 54.6억 원 중 90%가 단발성 제작비라는 점, 유명인 1인 기획사 미등록 기소유예, 저작권 신탁관리단체 재허가제의 실효성(음저협 징수 4,453억 원 대 함께하는음저협 204억 원)을 다룬다.","keypoints":["실감형 광화문 622억: 중기재정소요 490억으로 예타(500억) 회피 의혹, 8종 중 계획대로 운영은 1종뿐, 운영비 10배 증가","AI기본법 표시 의무는 AI사업자 대상이지만 혼란은 콘텐츠 제작·유통 현장이 떠안음 — 문체부 후속조치 부재 지적","방송사업 매출 19.9조(2022)→18.6조(2025) 3년 연속 감소, 넷플릭스 국내 매출 1조 542억 vs 티빙 4,060억·웨이브 1,810억","방송·OTT 거버넌스가 방미통위·과기정통부·문체부로 분절, 통합미디어법은 부처 간 이견으로 표류","지역·중소방송 지원 54.6억 중 49억(90%)이 단발성 프로그램 제작지원 — 유통·인력양성은 뒷전","대중문화예술기획업 미등록 유명 1인 기획사 기소유예 vs 일반 사업자 벌금형 — 계도기간이 면책 근거로 쓰였다는 비판"],"why":"지금 진행 중인 국정감사에서 문체부·콘진원이 받을 질문의 원본이라, 경기도의회 행정사무감사 대비 예상 질의를 뽑을 때 그대로 참고할 수 있다. 특히 광화문 프로젝트 꼭지는 '장소 미확정 상태 제작계약', '사업비의 부대비용 전환', '성과물 원본·IP 미확보'를 짚고 있어, 진흥원이 실감·공간형 콘텐츠 사업을 기획하거나 보조사업을 관리할 때 점검표로 쓰기 좋다. AI 표시 의무 꼭지는 도내 게임·웹툰 기업 대상 AI 활용 가이드나 설명회 기획의 근거가 된다. 418쪽 전체가 아니라 PDF 101~122쪽(방미통위)과 149~170쪽(문체부)만 보면 된다.","url":"https://www.nars.go.kr/report/list.do?cmsCode=CM0043","file":"2026-10-14/NARS_2026국정감사이슈분석4_사회문화.pdf","_recent":true},{"id":"2026-10-06-kocca-osaka-ip-plan-2026","week":"2026-10-14","title":"일본 지적재산추진계획 2026 (오사카 26-02호)","issuer":"한국콘텐츠진흥원 오사카비즈니스센터","type":"해외 산업동향","published":"2026-10-06","pages":24,"size":"1.5MB","genres":["글로벌·수출","정책·산업","AI·기술"],"tags":["일본","쿨재팬","지적재산추진계획","생성형 AI","해적판","민관투자 로드맵","미디어예술 내셔널센터"],"lede":"일본 정부가 콘텐츠를 17대 전략산업에 넣고 2033년 해외매출 20조 엔을 못박은 IP 계획","speakers":[{"name":"내각부 지적재산전략추진사무국","role":"일본 정부","topic":"원문 작성(번역 게재)"},{"name":"백승혁","role":"한국콘텐츠진흥원 오사카비즈니스센터장","topic":"감수"},{"name":"다케우치 히요나","role":"한국콘텐츠진흥원 오사카비즈니스센터 주임","topic":"감수"}],"summary":"일본 내각부 지적재산전략본부가 매년 내는 국가 IP 계획의 2026년판 개요를 오사카센터가 번역했다. 창조·보호·활용의 세 축과 쿨재팬 이행 점검으로 구성되는데, 콘텐츠 관점에서 핵심은 세 가지다. 첫째, 위상이 바뀌었다. 일본 콘텐츠 해외 시장은 2024년 6.1조 엔으로 철강·반도체 수출보다 크고, 2025년 11월 일본 성장전략본부가 '위기관리·성장 투자' 17개 전략 분야 중 하나로 콘텐츠를 선정했다. 목표는 2033년 콘텐츠 해외 시장 20조 엔, 쿨재팬 관련 산업 해외 전개 50조 엔 이상(현재 30.7조 엔, 전년 대비 +13.4%)이다. 둘째, 지원 방식을 바꾼다. 「콘텐츠 분야 민관 투자 로드맵」에 따라 예산 배분을 전체 최적화하고 집행을 일원화하는 새 지원체계를 만들며, 대규모 작품 제작, 유통 플랫폼 확대, 현지화·번역 인재, 해적판 대응을 한 패키지로 묶는다. 「크리에이터 지원기금」으로 차세대 크리에이터를 여러 해에 걸쳐 탄력적으로 지원하고, 중간 제작물의 수집·디지털화와 연구·전시 기능을 갖춘 '미디어 예술 내셔널센터(가칭)'를 민관 협력으로 추진한다. 셋째, 생성형 AI와 권리 보호다. 「생성형 AI의 적절한 활용을 위한 지적재산 보호·투명성 원칙·코드(가칭)」를 제정해 크리에이터에게 대가가 돌아가는 구조를 만들고, 배우·성우 목소리를 무단으로 흉내 낸 음성 생성은 퍼블리시티권 침해가 될 수 있다며 부정경쟁방지법 개정 논의까지 열어 두었다. AI 요약 서비스의 robots.txt 준수와 User-Agent 공개도 과제로 정리했다. 해적판은 일본 대상 상위 10개 사이트 월간 접속이 1억 건 아래로 내려왔지만, 민간만으로는 한계가 있다며 정부 주도 국제 공조를 강화한다. 지역 콘텐츠 창제작 거점을 전국으로 넓히고 방일 관광과 수출을 연계해 '일본 팬 비율 10%p 상향'을 목표로 삼은 점도 눈에 띈다.","keypoints":["일본 콘텐츠 해외 시장 6.1조 엔(2024) — 철강·반도체 수출 초과, 성장전략 17개 분야에 콘텐츠 선정","2033년 목표: 콘텐츠 해외 시장 20조 엔, 쿨재팬 해외 전개 50조 엔 이상(현재 30.7조 엔, +13.4%)","민관 투자 로드맵 기반으로 예산 배분 최적화·집행 일원화하는 새 지원체계 구축","크리에이터 지원기금(제작~유통 다년 지원)과 미디어 예술 내셔널센터(가칭) 추진","생성형 AI 지재 보호·투명성 원칙·코드 제정, 성우·배우 음성 무단 생성은 퍼블리시티권 침해 소지로 정리","지역 창제작 거점 전국 확산 + 방일 관광·수출 연계로 일본 팬 비율 10%p 상향 목표"],"why":"일본이 콘텐츠를 반도체급 전략산업으로 올리고 예산 집행을 일원화하는 흐름은, 국내 콘텐츠 예산 분산 문제와 지역 진흥원의 역할을 논할 때 비교 사례로 쓸 수 있다. '지역 창제작 거점의 전국 확산'은 경기도 권역별 거점 사업의 정책 정당성을 설명하는 해외 근거가 된다. 생성형 AI 원칙·코드와 음성 퍼블리시티권 정리는 진흥원 AI 콘텐츠 지원사업의 권리 가이드를 만들 때 참고할 만하다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158950/2012637.do?menuNo=204160","file":"2026-10-14/[오사카26-2호]지적재산추진계획 2026.pdf","_recent":true},{"id":"2026-09-30-kcti-kculture-export-stats-design","week":"2026-10-07","title":"케이-컬처 수출 통계 개발을 위한 기초 설계 연구 (현안연구 2026-04)","issuer":"한국문화관광연구원 한류경제연구센터","type":"연구보고서","published":"2026-09-30","pages":161,"size":"2.5MB","genres":["글로벌·수출","정책·산업"],"tags":["수출통계","행정데이터","HS코드","지식서비스무역통계","CSTF","게임","K팝","공연예술"],"lede":"설문 기반 수출액의 한계를 관세·외환 행정데이터로 메우는 K-컬처 수출 통계 설계안","speakers":[{"name":"이용관","role":"한국문화관광연구원 연구위원","topic":"연구책임"},{"name":"박찬욱","role":"한국문화관광연구원 연구위원","topic":"공동연구"},{"name":"이승희","role":"한국문화관광연구원 부연구위원","topic":"공동연구"}],"summary":"지금 우리가 인용하는 콘텐츠 수출액(2024년 140.8억 달러)은 콘텐츠산업조사, 즉 표본 사업체가 직접 써낸 응답을 합친 값이다. 이 연구는 그 구조적 한계부터 짚는다. 수출 실적이 있는 기업이 적어 표본 대표성이 약하고, 유통사와 제작사가 같은 해외 매출을 각자 '수출'로 적어 중복될 수 있으며, 공표가 기준연도보다 1~2년 늦다. 대안으로 관세청 수출입통관자료(HS 10단위)와 한국은행 지식서비스 무역통계(외환 거래 기준)를 묶어 장르×지역×분기 단위의 통합 수출 DB를 설계했다. 서비스 쪽은 '서비스 유형×산업분류'를 교차하는 CSTF(Creative Service Trident Framework)로 장르를 식별한다. 협의(직접 거래)와 광의(광고·PR, 운영지원 등 연관 서비스 포함) 두 기준을 함께 낸다. 장르는 직접 식별형(게임·음악·광고·콘텐츠솔루션), 통합 식별형(출판·만화, 영화·애니·방송, 공연예술·전시), 연관 식별형(캐릭터·지식정보, 참고지표)으로 나눴다. 시범 산출한 2025년 수출은 게임 51.9억 달러(광의 56.6억), 음악 16.4억 달러(광의 18.5억), 예술 5.5억 달러(광의 26.8억)다. 음악 서비스 수출은 2016~2025년 연평균 22.2%로 가장 빨리 컸다. 게임 서비스 수출(협의)은 2025년 아시아 33.9억, 북미 9.6억, 유럽 7.1억 달러이고, 유럽은 전년 9.3억에서 줄었다. 눈여겨볼 점은 같은 '게임 수출'이라도 조사통계(2024년 85.0억 달러)와 행정통계(2024년 협의 48.5억 달러)가 크게 다르다는 것이다. 연구진은 행정통계를 기준 통계로 삼고, 세부 장르는 조사로 보정하며, 외국환 거래정보를 쓸 법적 근거를 마련하자고 제안한다.","keypoints":["현행 수출액(콘텐츠산업조사)은 표본·자기기입 방식이라 중복 계상·누락·1~2년 공표 시차가 구조적으로 발생","관세청 HS 10단위 + 한은 지식서비스 무역통계를 '장르×지역(19개)×분기' 단위로 결합하는 통합 수출 DB 설계","2025년 시범치: 게임 51.9억$(광의 56.6억), 음악 16.4억$(광의 18.5억), 예술 5.5억$(광의 26.8억)","음악 서비스 수출 '16→'25 연평균 22.2%(2.1억→12.6억$), 게임은 10.4%(20.8억→50.8억$)","게임 서비스 수출 2025 권역: 아시아 33.9억$ > 북미 9.6억$ > 유럽 7.1억$(전년 9.3억에서 감소)","같은 게임 수출이 조사통계 85.0억$ vs 행정통계 48.5억$(2024) — 인용 시 출처 구분 필수","제언: 행정통계를 기준 통계로, 통합 식별 장르는 조사로 보정, 외국환 거래정보 활용 법적 근거 마련"],"why":"진흥원 성과보고서나 예산 요구서에서 '수출 성과'를 쓸 때, 지금은 조사통계 하나만 인용한다. 이 연구는 그 수치가 어떤 한계를 갖는지 설명해 주는 근거다. 도내 기업 수출지원 사업의 성과지표를 '기업 응답 수출액'에서 '통관·외환 기반 수출액'으로 보완하자는 제안의 논리로 쓸 수 있다. 장르별 협의/광의 구분은 경기도 게임·음악 수출 통계를 따로 뽑을 때 설계 틀로 그대로 빌려 올 수 있다.","url":"https://www.kcti.re.kr/web/board/boardContentsView.do?board_id=2&contents_id=76bee7c697a8469587c610cf0c283641","file":"2026-10-07/KCTI_케이컬처_수출통계_기초설계.pdf","_recent":true},{"id":"2026-09-15-mcst-3rd-regional-culture-plan","week":"2026-10-07","title":"제3차 지역문화진흥기본계획(2026~2030) — 문화가 있는 일상, 머물고 싶은 지역","issuer":"문화체육관광부 지역문화정책과","type":"정부계획","published":"2026-09-15","pages":67,"size":"2.0MB","genres":["정책·산업","IP·공간"],"tags":["지역문화진흥법","5극3특","문화기본권","초광역협약","로컬비즈니스","지역문화AI","대중문화공연장","경기도"],"lede":"5극3특 균형발전과 맞물린 향후 5년 지역문화 법정계획 — 협약·초광역·로컬비즈니스가 축","speakers":[{"name":"문화체육관광부","role":"지역문화정책과","topic":"계획 수립(지역문화협력위원회 심의, 17개 시·도 과제 반영)"}],"summary":"「지역문화진흥법」 제6조에 따른 5년 단위 법정계획이다. 2025년 6월부터 전문가 분과위(30명, 18회), 권역별 토론회(316명), 시·도와 기초문화재단 간담회(54개 기관)를 거쳐 2026년 9월 지역문화협력위원회 심의로 확정됐다. 진단은 두 가지다. 하나는 수도권 쏠림이다. 공연 건수의 61.3%가 수도권에서 열리고, 청년이 지역을 떠나는 이유 1위가 '문화·여가·소비 인프라 부족'(49.3%)으로 일자리(45.8%)보다 높다. 다른 하나는 문화예산 지방이양(2023년 약 2,655억 원) 뒤 중앙·광역·기초의 역할이 흐려졌다는 점이다. 목표는 문화예술관람률 60.2%→70%(2030), 지자체 문화예술 재정 비율 1.6%→2.0%, 문화적 정주여건 만족도 60%다. 4대 전략과 16개 과제 가운데 주목할 것은 이렇다. ① 기초지자체가 문화기본권 보장계획을 세우면 중앙·광역·기초가 2028~2030년 다년도 협약을 맺고 국비를 차등 지원한다. ② 5극3특 단위 문화공간계획을 세우고, 문체부와 초광역권이 정책협약(2028년~)을 맺는다. ③ 복합문화돔구장 2개소(2031년 착공)를 짓고, 체육시설·문예회관 30개소에 대중문화 공연 기능을 넣는다(~2028). ④ 지역 원천콘텐츠를 디지털화하고 AI 학습데이터와 윤리 가이드를 만든다. ⑤ 모태펀드 지방투자 인센티브와 문화산업보증 지방기업 우대로 로컬 문화비즈니스를 키운다. ⑥ '원도심 RE:CORE'(2027년~)를 추진한다. 시·도별 장에서 경기도는 기반시설 633개로 전국 1위지만 인구 100만 명당 46개(12위)에 그쳐, '많지만 부족한' 지역으로 진단됐다.","keypoints":["목표: 문화예술관람률 60.2%→70%, 지자체 문화예술 재정비율 1.6%→2.0%, 문화적 정주여건 만족도 60%(2030)","청년 지역이탈 사유 1위 '문화·여가·소비 인프라 부족' 49.3% > 일자리 45.8% — 문화를 정주정책으로 재정의","기초 문화기본권 보장계획 → 중앙·광역·기초 다년도 협약('28~'30), 재정여건 따라 국비 차등","5극3특 문화공간계획 + 문체부–초광역권 정책협약('28~), 공립 거점시설 신축 50%·리모델링 60% 국고보조","K-컬처 대중문화 인프라: 복합문화돔구장 2개소('31 착공), 기존 시설 30개소 대중공연 기능 확충(~'28)","로컬 문화비즈니스: 모태펀드 지방투자 인센티브·문화산업보증 지방기업 우대, 로컬플레이어 IP 보호 협약","지역콘텐츠기업지원센터 성과(2,731개사·고용 6,260명·매출 1조 340억 원)를 2차 계획 성과로 명시"],"why":"향후 5년 국비 사업이 '협약형·초광역형'으로 바뀐다는 신호라서, 경기도·진흥원의 중장기 계획과 예산 요구 논리를 이 틀에 맞춰야 한다. 특히 지역거점 콘텐츠기업지원센터 성과가 정부 계획 성과로 명시되었고, 모태펀드·보증 지방 우대가 들어간 만큼 도내 콘텐츠 펀드·센터 사업의 국비 연계 근거로 인용할 수 있다. 경기도 항목의 '시설 수 1위·인구당 12위' 진단은 도 북부·외곽 문화격차 사업을 설계할 때 출발점으로 쓰기 좋다.","url":"https://www.mcst.go.kr/kor/s_notice/press/pressView.jsp?pSeq=22720","file":"2026-10-07/문체부_제3차_지역문화진흥기본계획(2026~2030).pdf","_recent":true},{"id":"2026-09-30-kcti-industry-monitoring-indicators","week":"2026-10-07","title":"문화체육관광 산업동향 모니터링 지표체계 구축 방안 연구 (현안연구 2026-02)","issuer":"한국문화관광연구원 데이터전략실","type":"연구보고서","published":"2026-09-30","pages":122,"size":"1.4MB","genres":["정책·산업"],"tags":["정책지표","속보성지표","모니터링","대시보드","메타데이터","위성계정","나우캐스팅","KCTI Data"],"lede":"국가통계의 공표시차를 전산망·카드·민간데이터로 메우는 95종 산업동향 지표체계 설계","speakers":[{"name":"송철재","role":"한국문화관광연구원 수석전문위원","topic":"연구책임"},{"name":"오시진","role":"한국문화관광연구원 차석전문원","topic":"공동연구"}],"summary":"현안이 터질 때마다 기관과 부서가 통계를 따로 찾아 정리하는 방식을 바꾸자는 연구다. 문화예술·콘텐츠·관광·체육 4개 산업을 상시 점검하는 '속보성(연 단위 미만) 모니터링 지표체계'를 설계했다. 국가승인통계는 정확하지만 공표가 늦다. 반대로 공연·영화 통합전산망, 카드 지출, 온라인 거래, OTA 자료는 빠르지만 시장 전체를 대표하지 못한다. 그래서 국가통계는 '수준·구조'를 보는 기준지표로, 행정·민간자료는 '방향·증감'을 보는 속보지표로 역할을 나눴다. 틀은 4개 산업 × 7개 경제활동 부문(생산·소비·고용·임금·물가·국제·지역) × 7개 정책수요 유형(산업기반, 고용·소득, 소비·참여, 대외수요·수출, 지역격차, 가격부담, K-컬처 연관산업)이다. 여기서 지금 바로 확보 가능한 95종(문화예술 29, 콘텐츠 26, 관광 24, 체육 16)을 골라 핵심·진단·보완지표로 나눴다. 보고는 월간(전년동월비 + 연간 누적 진척률), 반기, 수시(이상신호 발생 시) 세 가지로 한다. 2026년 상반기에 시범 적용한 결과, 콘텐츠는 생산 진척률 97.7%(+1.7%), 실질임금 421.9만 원(-0.8%), 콘텐츠 수지 6.26억 달러 흑자로 '수출 호조 속 업종 편중'으로 진단됐다. 관광은 방한객 +21.3%였고, 체육은 생산 회복이 늦었다. 한계도 그대로 적었다. 문체부 실·국 수요조사는 회신이 부족해 정량 분석에 쓰지 못했다. 또 콘텐츠 투자·R&D, 저작권, 예술인 소득은 쓸 만한 단기지표가 없는 공백 영역으로 남았다. 로드맵은 2026 도입, 2027 자동수집·대시보드, 2028 조기경보·투자지표, 중장기 위성계정 연계 순이다.","keypoints":["국가통계=수준·구조 판단 기준지표, 전산망·카드·OTA 등 민간자료=증감 방향의 속보지표로 역할 분리","분류틀: 4개 산업 × 7개 경제활동 부문 × 7개 정책수요 유형(K-컬처 연관산업 포함)","현재 확보 가능한 95종 선정(문화예술 29·콘텐츠 26·관광 24·체육 16), 핵심/진단/보완 3계층","2026 상반기 시범: 콘텐츠 생산 진척률 97.7%(+1.7%), 실질임금 421.9만 원(-0.8%), 콘텐츠수지 6.26억$ 흑자","공백 영역: 콘텐츠 투자·R&D, 저작권, 예술인 소득·권리 — 단기 지표 자체가 없음","작성 원칙: 카드·전산망은 규모 아닌 증감만 해석, 공연·영화·출판은 분야 간 단순합산 금지, 명목·실질 구분","로드맵: '26 도입 → '27 자동수집·대시보드 → '28 조기경보·투자지표 → 중장기 위성계정·GDP 기여도"],"why":"기획조정팀이 도 업무보고나 이사회 자료에 '경기 콘텐츠산업 동향'을 넣을 때 쓸 지표 선정 기준과 작성 원칙(진척률+전년동기비, 잠정치 표시, 단순합산 금지)을 그대로 가져올 수 있다. 콘텐츠 투자·R&D가 '단기지표 공백'으로 명시돼 있어, 진흥원이 보유한 지원사업·펀드 데이터를 KCTI 지표체계에 제공하는 협력 제안의 근거로도 쓸 만하다.","url":"https://www.kcti.re.kr/web/board/boardContentsView.do?board_id=2&contents_id=bc1caf12bc344b7ca3386779b8e9123f","file":"2026-10-07/KCTI_산업동향_모니터링_지표체계.pdf","_recent":true},{"id":"2026-09-30-kocca-shenzhen-shortform-drama","week":"2026-10-07","title":"광둥성의 숏폼 드라마 제작 인프라와 해외 수출 모델 (심천 26-05호)","issuer":"한국콘텐츠진흥원 심천비즈니스센터","type":"해외 산업동향","published":"2026-09-30","pages":18,"size":"0.9MB","genres":["영상·방송","글로벌·수출","AI·기술"],"tags":["숏폼드라마","마이크로드라마","광둥성","심천","릴숏","AI드라마","촬영기지","인앱결제"],"lede":"중국 숏폼드라마가 해외 IAP 93%를 쥔 비결 — 3일 촬영 기지, 지자체 보조금, AI 현지화","speakers":[{"name":"김유미","role":"나초(북경)컨설팅 부장","topic":"집필"},{"name":"김은아","role":"나초(북경)컨설팅 과장","topic":"집필"},{"name":"심계진","role":"한국콘텐츠진흥원 심천비즈니스센터장","topic":"감수"}],"summary":"중국 숏폼(마이크로) 드라마의 규모, 광둥성의 산업화 방식, 심천의 해외 수출 모델을 정리한 리포트다. 중국 이용자는 8억 명을 넘었다. 시장은 2025년 1,000억 위안(+98%)이고 2026년 1,210억 위안이 전망된다. 2026년 1~8월 신규 작품은 43만 편으로 2025년 한 해 등록분의 13배인데, 90% 이상이 AI 드라마다. 그래서 9월 1일 「미단극발전관리방법」이 시행됐다. 투자액 300만 위안(AI 드라마는 80만 위안) 이상이면 광전총국 사전심의를 받아야 한다. 이미 올해 8개월 동안 6.8만 편이 단속됐다. 해외에서는 중국 플랫폼이 사실상 시장을 장악했다. 2025년 해외 IAP 매출은 22.8억 달러(+129%)이고, 2026년 상반기 다운로드의 85%, IAP의 93%가 중국 앱에서 나왔다. IAP 상위 20개 앱 중 16개가 중국 앱이고, 한국은 비글루(15위) 하나다. 이 공급을 받치는 곳이 광둥이다. 동관 슈덴기지는 세트 108곳에 12팀이 동시 촬영하며 '3~5일 촬영·15일 내 전 플랫폼 공개'를 돌린다. 지자체 보조금도 공격적이다. 헝친은 작품당 최대 20만 위안, 심천은 랜드마크 5곳 이상 촬영 시 최대 200만 위안, 포산은 현지 촬영 80% 이상 시 37만 위안을 준다. 심천은 게임 수출 경험을 살려 결제부터 배급까지 '기술-콘텐츠-배포-수익화' 생태계를 만들었다. 2025년 매출은 78억 위안(+160%)이다. 무게중심은 번역 수출에서 현지 제작으로 옮겨 가고 있다. 현지 제작 비중은 20% 미만에서 36%로 늘었고, AI로 현지 드라마를 만들면 비용이 1/5로 줄어든다고 한다. 릴숏은 미국 현지 배우·작가로 IAP 2위(1.88억 달러)에 올랐다. 한국 제작사의 <트웬티: 첫사랑 체인지>는 릴숏으로 유통돼 콘텐츠아시아 어워즈 금상을 받았다.","keypoints":["중국 숏폼드라마 2025년 1,000억 위안(+98%), 2026년 1,210억 위안 전망, 이용자 8억 명","2026년 1~8월 신규 43만 편(전년 13배), 90% 이상 AI 드라마 → 9월 1일 사전심의제 시행·6.8만 편 단속","해외 IAP 2025년 22.8억$(+129%), 2026 상반기 다운로드 85%·IAP 93%가 중국 앱 — 상위 20개 중 16개","IAP 국가순위에서 한국이 4위 시장 — 한국은 '팔리는 시장'이지만 앱 공급자는 비글루(15위) 하나","동관 슈덴기지: 세트 108곳·12팀 동시 촬영, 3~5일 촬영 → 15일 내 전 플랫폼 공개","지자체 보조금: 헝친 최대 20만 위안, 심천 랜드마크 5곳 촬영 시 최대 200만 위안, 포산 최대 37만 위안","심천 2025년 매출 78억 위안(+160%), 현지 제작 비중 20%→36%, AI 현지 제작 시 비용 1/5"],"why":"도내 숏폼·웹드라마 제작지원이나 로케이션 지원사업을 설계할 때 참고할 만한 사례다. 중국 지방정부의 '랜드마크 촬영 인센티브 + 초고속 세트기지 + 수출 서비스 플랫폼' 패키지를 경기도 촬영지원·영상 클러스터 정책과 견줘 볼 수 있다. 한국 제작사가 중국계 플랫폼(릴숏)으로 글로벌 수상을 한 만큼, 도내 기업 지원의 초점을 '자체 앱'이 아니라 '해외 플랫폼 공급형 IP 제작'에 두자는 논리로도 쓸 수 있다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158950/2012610.do?menuNo=204160","file":"2026-10-07/[해외산업동향] 광둥성의 숏폼 드라마 제작 인프라와 해외 수출 모델 [심천 26-05호].pdf","_recent":true},{"id":"2026-09-17-kocca-whitepaper-2025","week":"2026-09-30","title":"2025 콘텐츠산업백서 연차보고서","issuer":"문화체육관광부·한국콘텐츠진흥원","type":"산업백서","published":"2026-09-17","pages":602,"size":"84.8MB","genres":["정책·산업","투자·금융"],"tags":["콘텐츠산업백서","2024년기준통계","문체부예산","지역거점기관","수도권집중","2026정책방향","정책금융","게임산업법"],"lede":"정부 1년치 콘텐츠 정책·예산·통계를 한 권에 묶은 연례 기록, 경기 매출 9.6% 감소","speakers":[{"name":"문화체육관광부·한국콘텐츠진흥원","role":"발행","topic":"정부 연차보고서(장르별 기관 원고 취합)"}],"summary":"문체부가 매년 내는 콘텐츠산업 정부 연차보고서의 2025년판이다. 602쪽 분량이며 ①2025 정책 개요·법제·예산 ②국내외 산업 현황(2024년 기준 콘텐츠산업조사 인용) ③16개 추진과제별 성과 ④11개 장르별 성과·전망 ⑤2026 정책 방향 ⑥협회·행사 부록으로 짜여 있다. 산업 수치를 보면 2024년 매출은 157조 4,021억 원으로 전년보다 2.1% 늘었다. 2020~24년 연평균 증가율 5.2%와 비교하면 성장이 확연히 둔화됐다. 백서도 서두에서 '성장세 둔화'를 인정하고, 돌파구로 AI 전환(AX)을 내세운다. 수출은 140.8억 달러(+5.5%)로 게임이 60.4%를 차지한다. 증가분은 음악(+47.4%, 18억 달러)과 방송영상(+20.0%)에서 나왔고, 광고(-65.1%)와 영화(-32.5%)는 급감했다. 지역 수치는 GCA가 눈여겨볼 대목이다. 서울 매출 비중은 65.9%에서 66.1%로 올랐다. 반면 경기 매출은 29.1조 원으로 9.6% 줄었다. 사업체 수 기준 서울 비중은 36.1%에서 42.1%로 뛰었고, 경기 사업체는 0.3% 감소했다. 백서는 이를 '수도권 집중 심화'로 요약했지만 실제로는 서울 한 곳으로 쏠린 것이다. 예산 쪽을 보면 2025년 문체부 예산은 3조 7,718억 원이다. 표 1-4-1 기준 콘텐츠산업 부문 예산은 9,820억 원에서 8,308억 원으로 15.4% 줄었고, 부처 내 비중도 28.1%에서 22.0%로 낮아졌다. 본문의 '약 1조 81억 원, 30.6%'는 미디어정책국까지 합친 값이라 서로 다른 숫자처럼 보이니 인용할 때 주의해야 한다. 2026 방향으로는 ①청장년용 애니메이션 101억 원 ②K-OTT와 IP를 공동보유하는 제작지원 399억 원 ③게임 수출국을 북미·동남아로 다변화 ④세계 7대 도시 K-팝 공연장 확보 ⑤해외 운용사 전용펀드를 1,000억 원에서 1,500억 원으로 확대 ⑥'미래전략 펀드' 신설을 제시했다.","keypoints":["2024년 콘텐츠 매출 157.4조 원(+2.1%), 연평균 5.2%에서 급둔화 — 백서 스스로 '성장세 둔화'와 AX 필요 명시","수출 140.8억 달러(+5.5%), 게임 60.4% 편중 속 음악 +47.4%·방송영상 +20.0%가 견인, 광고 -65.1%·영화 -32.5%","경기 매출 29.1조 원(18.5%)으로 전년 대비 9.6% 감소, 서울 비중 66.1%로 상승 — 서울 단극 집중","사업체 수 서울 비중 36.1%→42.1%(백서상 서울 +19.2%, 전국 +2.4%), 경기 -0.3%","콘텐츠산업 부문 예산(표 1-4-1) 9,820억→8,308억 원(-15.4%), 부처 내 비중 28.1%→22.0%. 본문 '1조 81억'은 미디어국 포함치","2026 방향: 청장년 애니 101억·K-OTT IP 공동보유 제작 399억·해외운용사 전용펀드 1,500억·미래전략 펀드 신설","경기콘텐츠진흥원이 16개 지역 거점기관(표 3-3-9)으로 명시, 지역 인프라 예산 약 500억 원 규모"],"why":"업무보고·예산 요구서의 '정부 정책 방향과의 정합성' 항목에 인용할 수 있는 공식 연례 자료다. 특히 경기 매출 9.6% 감소와 서울 단극 집중 수치(p.57~59)는 도 콘텐츠 예산 방어 논리의 근거로 바로 쓸 수 있다. 2026 신규 재원(청장년 애니, K-OTT IP 공동보유, 해외 운용사 펀드)은 국비 매칭 공모를 미리 준비할 대상으로 목록화해 둘 만하다. 예산 수치는 표와 본문의 집계 범위가 다르므로 표 1-4-1 기준으로 인용할 것.","url":"https://www.kocca.kr/kocca/bbs/view/B0000146/2012549.do?menuNo=204154","file":"2026-09-30/2025 콘텐츠산업백서 연차보고서.pdf","_recent":true},{"id":"2026-09-29-kcti-content-service-trade-2026h1","week":"2026-09-30","title":"[콘텐츠산업 동향 인덱스] 콘텐츠 분야 서비스 무역 (2026년 상반기)","issuer":"한국문화관광연구원 콘텐츠연구본부 한류경제연구센터","type":"산업통계","published":"2026-09-29","pages":9,"size":"0.4MB","genres":["글로벌·수출","게임"],"tags":["서비스무역","지식서비스무역통계","멀티미디어수지","저작권수지","게임수출","중국","북미","콘텐츠솔루션"],"lede":"상반기 수출 +2.0%라지만 중국 게임 -46%를 미국이 메운 것, 저작권 수지는 적자 전환","speakers":[{"name":"이용관","role":"한국문화관광연구원 한류경제연구센터 센터장","topic":"작성·문의"},{"name":"김민채","role":"한국문화관광연구원 사업전문원","topic":"작성·문의"}],"summary":"한국은행 「지식서비스 무역통계」(외환 유출입 기준, 매년 3·9월 반기 공표)를 KCTI가 콘텐츠 기준으로 다시 가공한 반기 인덱스다. 지표는 두 가지다. 영상·음악 제작서비스와 저작권을 합친 '멀티미디어 부문 수지'가 하나, 콘텐츠산업 특수분류로 다시 묶은 '콘텐츠산업 서비스 수출액'(수입 누락 때문에 수출만 제공)이 다른 하나다. 2026년 상반기 헤드라인은 '콘텐츠 서비스 수출 58.4억 달러, 전년 동기 대비 +2.0%'다. 하지만 이 2%는 안정 성장이 아니라 거의 상쇄에 가깝다. 중국향 수출이 14.2억 달러에서 8.2억 달러로 42.5% 줄었고, 대부분이 게임(-6.1억 달러, -45.9%)이다. 그 빈자리를 미국(+22.0%, +3.2억 달러)이 채웠는데, 역시 대부분 게임(+2.8억 달러, +55.8%)이다. 이 결과 아시아 비중은 59.5%에서 48.2%로 떨어지고 북미는 25.9%에서 31.0%로 올랐다. 유럽(+47.0%)은 게임(+63.8%)과 방송영상(+121%)이 끌어올렸다. 장르별로는 음악 +15.2%(8.3억 달러), 콘텐츠솔루션 +54.3%(5.5억 달러)가 늘었다. 반면 방송영상 -9.9%, 지식정보 -33.3%, 만화 -21.7%는 줄었다. 더 경고성 신호는 멀티미디어 수지다. 흑자가 5.8억 달러에서 3.4억 달러로 줄었고, 저작권 수지는 +3.7억 달러에서 -0.4억 달러로 적자 전환했다. 대미 저작권 수출이 38.8% 줄고 수입은 37.4% 늘었기 때문으로, 'K-콘텐츠 판권을 파는 쪽'에서 '사오는 쪽'으로 기운 것이다. 참고로 이 통계는 해외 자회사 매출이나 굿즈를 빼고 집계하므로, 콘텐츠산업조사 수출액의 약 1/1.57 수준이다.","keypoints":["상반기 콘텐츠 서비스 수출 58.4억 달러(+2.0%) — 중국 -6.0억 달러를 미국 +3.2억·유럽 +3.6억 달러가 상쇄한 결과","중국 게임 수출 -45.9%(13.3억→7.2억 달러), 미국 게임 +55.8%(5.0억→7.9억 달러): 게임 수출 축이 이동","권역 비중: 아시아 59.5%→48.2%, 북미 25.9%→31.0%, 유럽 13.5%→19.5%","멀티미디어 수지 흑자 5.8억→3.4억 달러, 저작권 수지 +3.7억→-0.4억 달러로 적자 전환","대미 저작권 수출 -38.8%·수입 +37.4% — 미국과의 판권 거래에서 순유출로 돌아섬","콘텐츠솔루션 +54.3%(5.5억 달러)·음악 +15.2%는 성장, 지식정보 -33.3%·방송영상 -9.9%·만화 -21.7%","외환 기준 통계라 콘텐츠산업조사 수출액의 약 1/1.57 — 두 수치를 섞어 인용하지 말 것"],"why":"도내 게임사 해외진출 지원사업의 타깃 권역을 정할 때, '중국 급감·북미 급증'이라는 반기 단위 최신 신호를 근거로 쓸 수 있다. 백서의 2026 방향(북미·동남아 다변화)과도 방향이 맞는다. 저작권 수지 적자 전환은 IP 보유형 제작지원이나 판권 역수입 구조를 점검하자는 정책 논리로 연결할 수 있다. 수출 수치를 인용할 때는 이 자료(외환 기준)와 콘텐츠산업조사(기업 응답 기준)의 출처를 반드시 구분해 표기할 것.","url":"https://www.kcti.re.kr/web/board/boardContentsView.do?board_id=34&contents_id=77f6a1e6c9eb4392b08865be41e9f9a6","file":"2026-09-30/[콘텐츠산업 동향 인덱스] 콘텐츠 분야 서비스 무역_260929.pdf","_recent":true},{"id":"2026-09-18-kofic-aug","week":"2026-09-30","title":"2026년 8월 한국 영화산업 결산","issuer":"영화진흥위원회 정책본부 정책개발팀","type":"산업통계","published":"2026-09-18","pages":30,"size":"0.7MB","genres":["영상·방송"],"tags":["영화산업결산","박스오피스","여름성수기","할리우드블록버스터","한국영화점유율","추석개봉","독립예술영화"],"lede":"8월 매출 +52.7%인데 한국영화 점유율은 10.3%, 외화 2편이 전체의 83%","speakers":[{"name":"김성희","role":"영화진흥위원회 정책개발팀 객원연구원","topic":"집필"}],"summary":"영진위 월간 결산의 8월호다. 겉으로 보면 호황이다. 8월 전체 매출은 2,070억 원으로 전년 동월 대비 52.7% 늘었고, 관객은 1,950만 명으로 45.0% 늘었다. 하지만 구조를 보면 극단적인 쏠림이다. 8월 5일 개봉한 〈오디세이〉(1,000억 원·901만 명)와 〈스파이더맨: 브랜드 뉴 데이〉(8월분 720억 원·692만 명) 두 편이 8월 매출의 83.1%를 차지했다. 미국영화 점유율은 86.1%다. 한국영화 매출은 214억 원으로 64.6% 줄었고, 점유율은 10.3%로 전년보다 34.2%p 떨어졌다. 8월 한국영화 1위는 애니메이션 〈사랑의 하츄핑〉(79억 원)이었고, 100만 관객을 넘긴 한국영화는 한 편도 없었다. 보고서는 원인으로 여름 할리우드 블록버스터 집중과 한국 기대작의 추석(9월) 개봉 이동을 든다. 성수기를 통째로 외화에 내준 셈이다. 누적으로 보면 그림이 다르다. 1~8월 매출은 8,983억 원(+36.4%), 관객은 8,726만 명(+28.9%)이다. 한국영화도 4,483억 원(+46.7%)으로 점유율 49.9%를 지켰다. 2월 〈왕과 사는 남자〉(1,633억 원·1,692만 명)의 메가히트에 이어 〈군체〉·〈호프〉·〈살목지〉가 달마다 고르게 흥행한 덕이다. 즉 올해 한국영화는 '1편의 메가히트+월별 중형 흥행'으로 버텼고, 8월은 그 공백이 드러난 달이다. 배급사로는 UPI(48.8%)와 소니(35.6%) 두 곳이 84%를 가져갔다. 독립·예술영화 1위는 일본 다큐 〈어떻게 해야 했을까?〉(8.2억 원)였고, 4K 리마스터 재개봉작 2편이 상위 5위 안에 들었다.","keypoints":["8월 매출 2,070억 원(+52.7%)·관객 1,950만 명(+45.0%) — 외화 2편이 매출의 83.1%","한국영화 매출 214억 원(-64.6%), 점유율 10.3%(-34.2%p), 100만 관객 한국영화 0편","원인: 여름 할리우드 블록버스터 집중 + 한국 기대작의 추석(9월) 개봉 이동","1~8월 누적 8,983억 원(+36.4%), 한국영화 누적 점유율 49.9% — 연간 흐름은 여전히 회복세","〈왕과 사는 남자〉 누적 1,633억 원·1,692만 명이 한국영화 누적의 36%를 차지하는 메가히트 의존 구조","8월 배급 점유율 UPI 48.8%·소니 35.6%로 두 직배사가 84% 차지","독립·예술 상위 5편 중 4K 리마스터 재개봉 2편 — 재개봉이 예술영화관 편성의 한 축"],"why":"'관객 회복'이라는 헤드라인과 달리 월별 한국영화 점유율 변동이 매우 크다는 근거다. 도내 영상 제작·배급 지원사업에서 개봉 시기 분산이나 비수기 개봉 인센티브를 논의할 때 참고할 수 있다. 8월 실적만 인용하면 '한국영화 붕괴'로, 누적만 인용하면 '완전 회복'으로 읽히므로 보고서에는 두 수치를 함께 적어야 오해가 없다. 독립·예술 재개봉 흐름은 도내 예술영화관·영상미디어센터 프로그래밍에도 참고할 만하다.","url":"https://www.kofic.or.kr/kofic/business/board/selectBoardDetail.do?boardNumber=2&boardSeqNumber=75526","file":"2026-09-30/2026년 8월 한국 영화산업 결산 보고서.pdf","_recent":true},{"id":"2026-09-29-kocca-france-game","week":"2026-09-30","title":"2026 프랑스 게임 시장 현황 (프랑스 26-07호)","issuer":"한국콘텐츠진흥원 프랑스비즈니스센터","type":"해외 산업동향","published":"2026-09-29","pages":24,"size":"0.9MB","genres":["게임","글로벌·수출"],"tags":["프랑스","CNC","SELL","모바일게임","DLC·마이크로트랜잭션","e스포츠","EWC2026","게이머세분화"],"lede":"58.6억 유로 시장, 성장은 모바일(+10.8%)이 견인하고 게이머 평균 나이는 40세","speakers":[{"name":"나우진","role":"국민대학교 강사","topic":"집필"},{"name":"김문주","role":"KOCCA 프랑스비즈니스센터장","topic":"감수"}],"summary":"프랑스 국립영화영상센터(CNC)의 「Bilan 2025」 게임 부문과 퍼블리셔협회(SELL)의 2025 시장결산을 바탕으로 쓴 국가 리포트다. SELL 자료는 GSD·GameTrack·Sensor Tower·IDC 데이터를 쓰고, 이용자 조사는 Médiamétrie(4,001명)와 Toluna(3,286명+752가구)가 맡았다. 2025년 프랑스 게임시장은 58억 5,600만 유로(+2.9%)로 역대 두 번째 규모다. 콘솔이 43.6%로 가장 크지만 사실상 정체(-0.3%)였고, Switch 2 하드웨어(+13.9%)가 소프트웨어 감소(-6.2%)를 메웠다. 성장은 모바일(17.9억 유로, +10.8%, 사상 최대)이 이끌었다. 소프트웨어만 보면 모바일 48.3%, 콘솔 38.8%, PC 12.9% 순이다. 수익구조도 바뀌었다. 콘솔 디지털 풀게임 판매는 19.4% 줄었고, DLC·마이크로트랜잭션은 51.4% 늘었다. PC는 디지털 비중이 99.7%이고 DLC·MTX가 41%를 차지한다. 모바일은 매출의 94.2%가 F2P 인앱결제에서 나온다. 이용자 쪽에서는 10~80세의 73%(4,020만 명)가 게임을 하고, 평균 연령은 40세로 인구 평균 44세와 거의 같다. 65세 이상 이용률은 49%로 6%p 올라 가장 큰 폭으로 늘었다. 여성 이용률은 69%, 남성은 77%다. 하지만 스스로 '게이머'라고 여기는 사람은 32.9%에 그친다. CNC는 이용자를 하드코어 8.7%(주 25시간), 미드코어, 캐주얼, 라이트, 모바일 전용 15.6%의 다섯 유형으로 나눴다. 모바일 전용층의 55.5%는 게임을 한 번도 사지 않는다. 게임 원작 영화·시리즈 시청은 62%, 굿즈 구매 경험은 50.4%로 IP 확장 소비가 넓다. e스포츠는 43.5%가 시청한다. 2026년 EWC는 중동 정세로 리야드 대신 파리에서 긴급 개최됐다.","keypoints":["2025년 시장 58.56억 유로(+2.9%), 콘솔 43.6%(정체)·모바일 17.9억 유로(+10.8%, 사상 최대)","소프트웨어 기준 모바일 48.3% > 콘솔 38.8% > PC 12.9% — 2024년부터 모바일이 콘솔 추월","콘솔 디지털 풀게임 -19.4% vs DLC·MTX +51.4%, PC는 디지털 99.7%·DLC·MTX 41%","모바일 매출의 94.2%가 F2P 인앱결제, 유료 구매 0.5%","이용률 73%(4,020만 명), 평균 40세, 65세+ 49%(+6%p), 여성 69%, 자칭 게이머는 32.9%","게임 원작 영상 시청 62%·굿즈 구매 50.4%·e스포츠 시청 43.5% — IP 확장 소비 기반 두터움","EWC 2026이 리야드에서 파리로 긴급 이전, 프랑스가 국제 e스포츠 개최지로 부상"],"why":"도내 게임사의 유럽 진출 상담·해외 마켓 참가 사업에서 프랑스를 '콘솔 국가'로만 보지 않도록 해 주는 자료다. 모바일 F2P와 콘솔·PC의 DLC 수익화가 함께 커지는 구조라는 점을 짚을 수 있다. KCTI 반기 무역통계에서 유럽 게임 수출이 +63.8% 늘어난 흐름과 함께 인용하면 유럽 권역 지원 확대 논리가 선다. 65세 이상·가족 공동 플레이 확산은 기능성·가족형 게임 지원사업의 해외 사례로도 쓸 수 있다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158950/2012604.do?menuNo=204160","file":"2026-09-30/[프랑스 26-07호] 2026 프랑스 게임 시장 현황.pdf","_recent":true},{"id":"2026-06-29-kofice-overseas-hallyu-survey-15","week":"2026-09-16","title":"2026 해외한류실태조사 결과보고서(제15차) 분석편","issuer":"문화체육관광부·한국국제문화교류진흥원(KOFICE) 문화교류연구센터","type":"조사통계","published":"2026-06-29","pages":1726,"size":"58MB","genres":["글로벌·수출","정책·산업"],"tags":["해외한류실태조사","30개국","소비지출액","접촉경로","OTT","구매경험률","국가별비교"],"lede":"30개국 2만7,400명, 나라별로 접촉경로도 지출액도 다르다","speakers":[],"summary":"2012년 9개국으로 시작해 15회째를 맞은 국내 유일의 한류 이용실태 조사다. 2025년 11월 13일~12월 12일 30개 국가·지역의 만 15~59세 한국 문화콘텐츠 경험자 27,400명(국가별 500~2,100명)을 조사했고, 이번 회차에 싱가포르·칠레·폴란드가 신규 편입됐다. 이 '분석편'은 총괄 요약본이 아니라 30개국을 절 단위로 나눠 각각 국가 개요·한류 현황·콘텐츠 분야별 경험률·소비지출·접촉경로·인식·한국산 제품 구매까지 같은 틀로 반복 서술한 1,726쪽짜리 레퍼런스 볼륨이다. 따라서 '한류가 늘었나 줄었나'를 묻기보다 진출 대상국을 정해놓고 그 절만 펼쳐 보는 자료다. 국가별 편차가 이 조사의 핵심 정보다. 소비지출액은 미국 33.1달러(전년 대비 +4.4달러), 중국 26.3달러, 말레이시아 14.5달러, 일본 9.2달러로 4배 가까이 벌어지고, 소비 비중도 말레이시아 32.3%에서 일본 15.3%까지 차이가 난다. 접촉경로 역시 시장마다 갈린다. 미국은 드라마·영화·애니메이션이 OTT 중심(60~65%)인데 예능(63.6%)과 음악(66.9%)은 SNS·숏폼이 주경로이고, 중국은 드라마조차 '비공식 공유 사이트'(24.2%)가 OTT(20.2%)보다 높으며 플랫폼도 아이치이·유쿠·한주티비 등 자국 서비스가 주도한다. 말레이시아는 넷플릭스가 영상 90.9%를 점유하는 반면 무료 광고형 OTT 이용이 드라마·예능·음악에서 46~63%에 달해 유료 전환이 과제로 남는다. 시장 성숙도의 방향도 엇갈려, 중국은 경험률이 드라마 78.9%→75.8% 등 전 분야에서 하락했지만 소비시간(13.5시간)과 지출액은 오히려 늘어 '이용자는 줄고 코어 팬은 더 쓰는' 선별화가 진행 중이고, 일본은 뷰티 경험률이 전년 대비 7.4%p 급등했다. 한국산 제품 구매 경험률은 최근 1년 내 저관여 제품 기준 말레이시아 99.0%, 중국 97.7%, 미국 96.0%, 일본 89.9%로 모두 높지만, 일본은 고관여 제품 평균 구매 횟수가 0.40회→0.33회로 줄어 구매 빈도는 별도로 봐야 한다.","keypoints":["30개국 27,400명, 2025년 11~12월 조사 — 싱가포르·칠레·폴란드 신규 편입","1인당 소비지출액 미국 33.1달러 > 중국 26.3 > 말레이시아 14.5 > 일본 9.2달러로 최대 4배 격차","중국은 드라마 접촉경로 1위가 '비공식 공유 사이트'(24.2%)로 OTT(20.2%)를 앞섬","미국은 영상은 OTT, 예능(63.6%)·음악(66.9%)은 SNS·숏폼으로 경로가 장르별로 갈림","말레이시아는 넷플릭스가 영상 90.9% 점유하나 무료 광고형 OTT 이용이 46~63%","중국은 경험률 전 분야 하락(드라마 78.9%→75.8%)에도 소비시간·지출액 증가 — 코어 팬 선별화","일본 뷰티 경험률 전년 대비 +7.4%p, 다만 고관여 제품 구매 횟수는 0.40→0.33회로 감소","총괄 요약본이 아니라 30개국을 같은 틀로 반복 서술한 1,726쪽 국가별 레퍼런스"],"why":"도내 기업의 해외 진출 상담·컨설팅에서 국가를 특정해 근거를 대야 할 때 펼쳐 쓰는 1차 자료다. 사업계획서에 '한류 확산'을 통으로 쓰는 대신 대상국의 경험률·지출액·접촉경로를 그대로 인용하면 심사 설득력이 달라진다. 특히 접촉경로 데이터는 마케팅 예산 배분의 근거가 된다 — 중국향이면 자국 플랫폼과 비공식 유통 대응이, 미국향이면 장르별로 OTT와 숏폼을 나누는 설계가 필요하다는 식이다. 1,726쪽 전체를 읽을 자료가 아니므로, 사업별 타깃 국가 목록을 먼저 정하고 해당 절만 발췌해 내부 배포용으로 정리해두면 재사용성이 높다.","url":"https://www.archivecenter.net/hallyuresearch/archive/srch/ArchiveNewSrchView.do?i_id=153488","file":"2026-09-16/KOFICE_2026_해외한류실태조사_15차_분석편.pdf","_recent":false},{"id":"2026-09-08-kocca-indonesia-music-live","week":"2026-09-16","title":"2026년 인도네시아 음악·공연 시장 현황 (인니 26-11호)","issuer":"한국콘텐츠진흥원 인도네시아비즈니스센터 (집필 이현석, PT EPIN)","type":"해외 산업동향","published":"2026-09-08","pages":25,"size":"2.1MB","genres":["음악·공연","글로벌·수출"],"tags":["인도네시아","K팝공연","프로모터","티켓가격","스트리밍","라마단","공연장"],"lede":"K팝 공연 2024년 46개 정점 뒤 감소, 시장이 아니라 선별","speakers":[{"name":"이현석","role":"PT EPIN","topic":"집필"},{"name":"신화범","role":"KOCCA 인도네시아비즈니스센터장","topic":"감수"}],"summary":"인도네시아 K팝 공연을 건별 실적 데이터로 해부한 보고서다. PwC 기준 2026년 인도네시아 음악 시장은 2억 9,400만 달러로, 라이브 음악이 1억 6,700만 달러(56.8%)로 여전히 최대지만 2024~2029년 연평균성장률은 라이브 2.0%인 데 반해 Recorded Music 7.9%, 스트리밍 8.3%여서 성장축이 공연에서 디지털로 넘어가는 중이다. 소비 기반은 크다 — 인터넷 이용자 2억 3,526만 명(보급률 81.7%), Z세대·밀레니얼 보급률 약 90%. 다만 스트리밍은 유료 구독 계정이 약 600만 개에 그치고 광고기반 매출(6,000만 달러)이 유료(6,400만 달러)와 거의 같아, PwC는 인도네시아를 인도·중국과 함께 '유료구독이 아직 확산되지 않은 광고형 선호 시장'으로 분류한다. 공연 데이터가 이 보고서의 핵심이다. 최근 5년간 K팝 공연은 총 167건으로 2022년 19건 → 2023년 35건 → 2024년 46건(역대 최다) 뒤 2025년 36건, 2026년 31건으로 줄었다. 보고서는 이를 시장 위축이 아니라 팬데믹 이월 수요가 소진되고 티켓 가격·가격 민감도·로컬 및 서구권 공연과의 경쟁이 겹치면서 중소형 공연이 정리되는 '선별화'로 본다. 근거는 양극화다 — 2026년 BTS·EXO는 빠른 매진과 추가회차가 나오는 반면, 티켓 최고가는 에이티즈 475만 루피아·BTS 450만 루피아인데 최저가는 김명수 80만 루피아까지 내려간다. 일정도 균등하지 않아 라마단·르바란과 겹친 3월은 공연이 0건이고 8~11월에 연간의 48.4%가 몰린다. 유통 구조도 구체적이다. 31개 공연을 16개 프로모터가 나눠 맡되 상위 4개사가 48.4%를 담당하며, 특히 Dyandra Global이 맡은 6건은 aespa·NCT WISH·EXO·NCT 127 등 전부 SM 계열이어서 현지 프로모터가 특정 기획사와 반복 협업하는 경향이 드러난다. 공연장은 ICE BSD City(6건) 등 상위 6개 시설이 74.2%를 차지하고 자카르타 광역권(자보데타벡)에 집중돼 있다. 소비자 조사에서는 공연 선택 기준이 출연 아티스트 59%, 티켓 가격 58%로 사실상 동률이며, 티켓 구매의 75%가 온라인이고 티켓닷컴(35%)·트라벨로카(18%) 등 여행·커머스 플랫폼이 주요 채널이다.","keypoints":["2026년 음악시장 2억 9,400만 달러 — 라이브 56.8%지만 CAGR은 라이브 2.0% vs 스트리밍 8.3%","K팝 공연 2022년 19건 → 2024년 46건(정점) → 2026년 31건, 최근 5년 총 167건","감소는 위축이 아니라 선별화 — BTS·EXO는 매진·추가회차, 중소형은 공급 조정","티켓 최고가 에이티즈 475만·BTS 450만 루피아, 최저가 김명수 80만 루피아로 격차 큼","라마단·르바란 겹친 3월 공연 0건, 8~11월에 연간 공연의 48.4% 집중","31개 공연에 프로모터 16개사 참여, 상위 4개사가 48.4% — Dyandra는 6건 전부 SM 계열","공연장 상위 6곳이 74.2% 차지(ICE BSD City 6건), 자카르타 광역권 집중","공연 선택 기준은 아티스트 59% vs 티켓 가격 58%로 사실상 동률, 온라인 구매 75%"],"why":"K팝 공연 연계 해외진출을 지원할 때 '팬이 많다'와 '티켓이 팔린다'를 구분하는 근거로 쓸 수 있다. 같은 주에 실린 KCTI의 K팝 해외공연 브리프가 공연과 수출의 관계를 통계로 다뤘다면, 이 보고서는 그 공연이 실제로 어떻게 성사되는지를 프로모터·공연장·가격대 수준에서 보여준다. 특히 프로모터 16개사의 5년 실적표와 기획사별 반복 협업 패턴은 도내 기업에 현지 파트너를 연결할 때 실사 체크리스트로 바로 쓸 수 있고, 라마단·르바란을 피한 8~11월 집중 구조는 사업 일정 수립에 반영할 만하다. 무료 광고형 스트리밍 선호와 낮은 유료 전환율은 '팔로워 수로 시장성을 판단하지 말라'는 이 보고서의 경고와 함께 인용하면 과도한 기대를 조정하는 데 유용하다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158950/2012511.do?menuNo=204160","file":"2026-09-16/[인니 26-11호] 2026년 인도네시아 음악 및 공연 시장 현황.pdf","_recent":false},{"id":"2026-09-10-kcti-brief26-5-kpop-concert-export","week":"2026-09-16","title":"콘텐츠산업 동향 브리프 26-5호: K팝 해외공연과 콘텐츠 수출의 동태적 관계","issuer":"한국문화관광연구원 콘텐츠연구본부 한류경제연구센터","type":"이슈리포트","published":"2026-09-10","pages":18,"size":"2.0MB","genres":["음악·공연","글로벌·수출"],"tags":["K팝해외공연","콘텐츠수출","패널분석","음악서비스","저작권사용료","공연서비스","낙수효과"],"lede":"공연 낙수효과, 음악에만 확실하고 영화·웹툰엔 공연 당기뿐","speakers":[{"name":"이용관","role":"한국문화관광연구원 콘텐츠연구본부 한류경제연구센터 연구위원","topic":"단독 저자"}],"summary":"'K팝 공연이 다른 K-콘텐츠 수출도 끌어올린다'는 통념을 실제 데이터로 검증한 브리프다. 2011년 1분기~2025년 2분기(해외공연이 막혔던 2020~2021년은 제외) 19개 국가·지역의 분기 패널자료 950개 관측치를 썼고, 핵심 설명변수를 '공연 횟수'가 아니라 공연장 수용규모×공연일수로 만든 '공연 규모'(분기 평균 4만 9,011석, 최대 139만 석)로 잡은 점이 기존 분석과 다르다. 수출 자료는 무역협회 K-STAT 통관자료와 한국은행 지식서비스무역통계를 결합했고, 국가·분기 고정효과에 GDP·브로드밴드 가입자·서비스 FTA·환율을 통제했다. 분석은 ①단독시점(T~T+4) → ②공연 전후를 한 모형에 넣는 분산시차모형(T-4~T+4) → ③사전·사후 계수 공동검정의 3단계로 진행했다. 결과는 장르별로 뚜렷하게 갈린다. 음악콘텐츠는 공연 1분기 전(T-1, 계수 0.025)부터 공연 4분기 후까지 일관된 정(+)의 관계가 유지되고 사전·사후 공동검정도 모두 유의하다. 다만 그 안에서도 음반은 공연 당기와 직후(T, T+1)에만 반짝하고 공동검정은 비유의여서 '단기 상품 수요'에 그치는 반면, 음원 사용료·공연서비스 같은 서비스 수출은 공연 전후로 길게 이어진다. 공연서비스는 사후 공동검정(F=6.42, p=0.0022)이 사전(p=0.0506, 경계적)보다 뚜렷해 공연 이후 관계가 강화되는 유일한 유형이었다. 반면 영화·방송영상·웹툰은 공연 당기(T)에만 유의했고 공동검정에서는 모두 비유의했으며, 애니메이션·게임은 아예 유의한 관계가 없었다. 저자는 음악콘텐츠·사용료에서 공연 '이전'에도 유의성이 나온다는 점을 근거로, 이를 인과효과가 아니라 '수요가 많은 시장에 큰 공연이 열린다'는 시장선택·역인과 가능성을 배제할 수 없는 동태적 연계로 해석해야 한다고 명시한다.","keypoints":["19개국 분기 패널 950개 관측치, 공연 '횟수'가 아니라 공연장 규모×공연일수로 만든 '공연 규모'가 핵심 변수","음악콘텐츠는 T-1부터 T+4까지 지속적 정(+), 사전·사후 공동검정 모두 유의(F=3.84/6.31)","음반은 T·T+1에만 반짝하고 공동검정 비유의 — 상품은 단기, 서비스(사용료·공연서비스)는 장기","공연서비스만 사후(F=6.42, p=0.0022)가 사전(p=0.0506)보다 강해 '공연 이후 강화' 패턴 확인","영화·방송영상·웹툰은 공연 당기(T)에만 유의하고 공동검정은 전부 비유의 — 낙수효과 일반화 불가","애니메이션·게임은 K팝 공연 규모와 유의한 관계 없음 — 장르 선별 지원 필요","저자 스스로 '수출을 증가시켰다'는 인과 해석을 경계하고 시장선택·역인과 가능성을 명시"],"why":"GCA가 도내 기업의 해외 공연·쇼케이스 연계사업을 설계·평가할 때 근거로 쓸 수 있다. 첫째, 성과지표를 공연 당일 관객·상담 건수로 끝내지 말고 공연 전 1분기부터 후 4분기까지의 음원·저작권 수익을 함께 보라는 근거가 된다. 둘째, '공연을 붙이면 웹툰·영화도 같이 팔린다'는 식의 연계 논리는 이 분석에서 지지되지 않으므로, 음악 외 장르를 묶을 때는 수출 확대가 아니라 인지도 제고·바이어 접점이라는 목표로 사업계획서를 써야 논리 방어가 된다. 셋째, 공연 규모(좌석수×일수)를 지원 대상 선정 기준으로 쓰는 방식은 이 보고서가 직접 제안하는 바다.","url":"https://www.kcti.re.kr/web/board/boardContentsView.do?board_id=34&contents_id=34446aab22b14fcc839a3041324c8a33","file":"2026-09-16/KCTI_콘텐츠산업동향브리프_26-5호_K팝해외공연과_콘텐츠수출.pdf","_recent":false},{"id":"2026-09-11-kcti-mcst-industry-stats-2023","week":"2026-09-16","title":"2023년 기준 문화체육관광산업통계","issuer":"한국문화관광연구원 데이터전략실 (국가승인통계 제434001호)","type":"산업통계","published":"2026-09-11","pages":104,"size":"2.0MB","genres":["정책·산업"],"tags":["국가승인통계","문화체육관광산업","지역별통계","경기도","사업체수","매출액","행정자료연계"],"lede":"사업체 수는 경기가 서울을 앞섰지만 매출은 서울의 44%","speakers":[],"summary":"국가데이터처 기업통계등록부와 관세청 수출입통관자료를 연계해 만드는 국가승인통계의 2023년 기준판이다. 표본조사가 아니라 행정자료 연계라 '문화체육관광산업을 영위하는 사업체'를 통째로 훑는다는 점이 콘텐츠산업조사와 다르다. 전국 규모는 사업체 51만 9,714개, 종사자 144만 5,549명, 매출 328조 6,716억 원. 대분류로는 문화산업 32만 4,444개·192조 8,729억 원, 스포츠산업 12만 7,513개·74조 6,318억 원, 관광산업 7만 8,920개·62조 8,784억 원이다. 이번 판의 구조적 변경 두 가지를 먼저 봐야 한다. 첫째, 4대보험 자료 생산이 중단돼 일자리 현황 통계 16종이 통째로 빠졌다(대체 자료인 취업활동통계등록부는 기업체 단위라 사업체 단위 생산이 불가능하다). 임금·고용 형태를 이 통계로 보던 작업은 다른 출처를 찾아야 한다. 둘째, 매출액은 해당 사업체의 총매출이라 문화·체육·관광 외 영역의 매출까지 포함해 '산업 매출'보다 크게 잡히고, 한 사업체가 여러 산업을 겸할 수 있어 산업별 합과 전체가 일치하지 않는다. 지역 구조가 이 통계의 핵심이다. 사업체 수는 경기 12만 4,378개로 서울 12만 3,812개를 근소하게 앞서 전국 1위이고, 특히 스포츠산업 사업체는 경기 3만 4,682개(전국의 27.2%)로 서울 2만 3,774개(18.6%)를 크게 웃돈다. 그러나 매출은 서울 169조 3,719억 원 대 경기 75조 1,802억 원으로 경기가 서울의 44% 수준이다. 문화산업 매출만 보면 격차가 더 벌어져 서울 109조 9,396억 원(57.0%) 대 경기 49조 1,452억 원(25.5%)이고, 반대로 스포츠산업 매출은 경기 27조 3,218억 원(36.6%)이 서울 24조 9,098억 원(33.4%)을 앞선다. 규모 분포도 극단적이어서 4인 이하 사업체가 전체의 90.4%(46만 9,929개)이고 300인 이상은 269개(0.1%)뿐이다. 음악산업은 4인 이하 비중 98.8%, 개인사업자 비중 96.8%로 전 산업 중 가장 영세하다.","keypoints":["2023년 전국 사업체 51만 9,714개·종사자 144만 5,549명·매출 328조 6,716억 원","사업체 수 경기 12만 4,378개 > 서울 12만 3,812개 — 경기가 전국 1위","매출은 서울 169조 3,719억 vs 경기 75조 1,802억 — 경기가 서울의 44%","스포츠산업만은 경기가 사업체 27.2%·매출 36.6%로 서울(18.6%·33.4%)을 앞선다","4인 이하 사업체가 전체의 90.4%, 300인 이상은 269개(0.1%)","음악산업은 4인 이하 98.8%·개인사업자 96.8%로 가장 영세, 애니메이션·광고·콘텐츠솔루션은 법인 비중이 절반 넘음","★변경: 4대보험 자료 생산 중단으로 일자리 현황 통계 16종이 이번 판부터 제외"],"why":"경기도 콘텐츠 정책 문서에 인용할 지역 수치의 1차 출처다. '사업체 수는 전국 1위인데 매출은 서울의 44%'라는 구도는 도내 기업의 영세성과 본사 서울 집중을 동시에 설명하는 근거로, 기업 성장단계별 지원 논리를 세울 때 바로 쓸 수 있다. 스포츠산업에서 경기가 사업체·매출 모두 전국 1위라는 점은 융복합 사업 기획 시 활용할 수 있다. 다만 일자리 통계가 이번 판부터 빠졌으므로 고용 수치를 인용해 온 기존 문서는 출처를 바꿔야 하고, 매출액이 해당 사업체의 총매출(타 영역 포함)이라는 점도 인용 시 각주로 달아야 한다.","url":"https://www.kcti.re.kr/web/board/boardContentsView.do?board_id=34&contents_id=98e0d2e9a7304585b86b2de06951d90f","file":"2026-09-16/KCTI_2023년기준_문화체육관광산업통계.pdf","_recent":false},{"id":"2026-09-08-mcst-ct-budget-2027","week":"2026-09-09","title":"전략사업부터 민간투자, 해외 진출 잇는 문화기술 국가전략산업 생태계 조성 본격화","issuer":"문화체육관광부 문화미디어산업실 문화기술과·문화산업정책과·저작권산업과","type":"예산자료","published":"2026-09-08","pages":10,"size":"677KB","genres":["정책·산업","AI·기술"],"tags":["문화기술예산","CT펀드","R&D","케이컬처라이브","K뮤지엄","AI저작권","사업화보조금"],"lede":"2027년 문화기술 R&D·펀드 예산 2,406억 원, 역대 최대로 편성","speakers":[],"summary":"문화체육관광부가 2026년 9월 8일 배포한 보도자료로, 2027년 문화기술(CT) 생태계 정부 예산안이 역대 최대인 2,406억 원(R&D 1,774억, 보조사업 32억, 펀드 600억)으로 편성됐다고 밝혔다. 2026년 본예산 2,115억 원 대비 291억 원(13.7%) 늘었고, 그중 R&D 예산은 1,515억→1,774억 원으로 17.1% 증가했다. R&D 세부로는 콘텐츠·문화예술 1,390억(+22.4%), 체육 87억(+33.3%), 관광 50억(+33.3%)이 늘고 저작권만 176억으로 13.4% 줄었다. 예산 증액의 핵심은 문체부가 2003년 R&D 사업을 시작한 이래 24년 만에 처음 편성한 대형 R&D다. '케이컬처 라이브 공연향유 경험 혁신 기술개발'에 250억 원이 반영돼, 콘서트·스포츠를 원격 극장에서 '현장에 있는 듯' 몰입해 관람하게 하는 AI 연출·실감중계 기술을 2030년까지 상용화한다. 과기부의 '우리의 과학(K-Science)' 프로젝트와 '2027년 국민체감 R&D 10선'에 선정된 'K-뮤지엄 글로벌 선도 기술개발'에는 62억 원이 붙어, 박물관 유물의 비파괴 탐사부터 AI 보존관리·데이터 전환·콘텐츠 활용까지 전주기를 연결한다. 이 밖에 기업주도 단기 R&D인 '케이컬처 현장솔루션 기술개발'(50억, 신설)과 'AI 저작권 신뢰 거버넌스 기술개발'(31억, 신설)이 새로 생겼다. 특히 현장솔루션형 선행사업은 참여 기업의 매출 증가 비율 69%, 5년 후 생존율 85.5%(일반 문화산업 기업 24.3%의 3.5배)라는 성과를 근거로 제시했다. 연구 성과의 사업화 공백을 메우기 위한 첫 보조사업 'K-문화기술 글로벌 사업화 및 시장창출 지원'(32억, 신설)도 생겨, 기술 사업화의 1·2차 '데스밸리'(자금·IP연계 부족, 해외판로·투자유치 부족)를 직접 지원한다. 정부 예산과 별개로 2026년 처음 조성한 1,000억 원 규모(정부 600억+민간 400억) '문화기술(CT) 펀드'는 2027년에도 같은 규모로 유지된다. 조직 측면에서는 2월 문화기술과 신설, 4월 한국콘텐츠진흥원 부설기관으로 '한국문화기술기획평가원'을 세워 R&D 정책수립·현장지원 기능을 강화했다. 문체부는 이를 통해 '케이컬처' 400조 원 달성을 목표로 내세웠다.","keypoints":["2027년 CT 예산 2,406억 원(전년비 +13.7%) 역대 최대, R&D 1,774억·보조 32억·펀드 600억","24년 만의 첫 대형 R&D '케이컬처 라이브 공연향유 경험 혁신 기술개발' 250억 편성, 2030년 상용화 목표","K-뮤지엄 기술개발 62억, 과기부 '우리의 과학' 프로젝트·2027 국민체감 R&D 10선 동시 선정","기업주도 단기 R&D '케이컬처 현장솔루션' 50억 신설 — 선행사업 참여기업 5년 생존율 85.5%(일반 24.3%)","연구성과 사업화 첫 보조사업 'K-문화기술 글로벌 사업화·시장창출 지원' 32억 신설, 데스밸리 완화 목적","CT펀드 2026년 1,000억(정부600·민간400) 신설에 이어 2027년도 동일 규모 유지"],"why":"GCA가 2027년 국비 매칭사업을 설계할 때 참고할 1차 자료다. '케이컬처 현장솔루션 기술개발'처럼 기업주도 단기(1년) 자유공모형 R&D는 도내 중소 콘텐츠기업이 직접 신청 가능한 트랙이므로 사업 공고 시점을 미리 챙겨 안내할 수 있다. 문화기술(CT)펀드가 2027년에도 1,000억 규모로 유지된다는 점은 투자유치 상담 시 안내할 자금 창구가 된다. 아울러 AI 저작권 신뢰 거버넌스 기술개발은 최근 도내 창작자 대상 AI 저작권 교육·상담 사업의 정책적 배경으로 인용할 수 있다.","url":"https://www.mcst.go.kr/kor/s_notice/press/pressView.jsp?pSeq=22695","file":"2026-09-09/mcst_ct_budget_2027.pdf","_recent":false},{"id":"2026-09-04-kocca-focus216-ai-usage","week":"2026-09-09","title":"[KOCCA포커스 통권 216호] 콘텐츠산업에서 AI는 누가, 어떻게 활용하는가: 사업체·종사자·프리랜서의 AI 활용 현황","issuer":"한국콘텐츠진흥원 정책연구본부 미래정책팀","type":"이슈리포트","published":"2026-09-04","pages":26,"size":"1.6MB","genres":["AI·기술","정책·산업"],"tags":["생성형AI","AI활용률","프리랜서","노동환경조사","장르별AI","제작단계AI","사업체AI도입"],"lede":"사업체 3곳 중 1곳, 종사자·프리랜서 10명 중 4명 이상이 업무에 AI 활용","speakers":[{"name":"김지현","role":"한국콘텐츠진흥원 정책연구본부 미래정책팀 책임연구원","topic":"저자"}],"summary":"「2025년 콘텐츠산업 노동환경 조사연구」의 사업체·종사자·프리랜서 정량조사(6,048개 응답, 가중치 적용 6,000개)와 사업체 심층인터뷰 11건·종사자 20명·프리랜서 23명 FGI를 결합해, 콘텐츠산업에서 AI를 '누가·어떤 업무에·어떻게' 쓰는지 실증 분석한 KOCCA 포커스다. 핵심은 사업체의 공식 도입과 현장 인력의 개인 활용이 따로 움직이는 '분산형 활용구조'다. 업무에 AI를 공식 도입한 사업체는 34.1%(애니메이션 51.7%·캐릭터 45.0%·음악 21.6%)에 그치지만, 종사자의 40.6%·프리랜서의 41.9%는 조직의 공식 환경과 무관하게 개인 계정으로 이미 AI를 업무에 쓰고 있다. AI 전문인력을 확보한 사업체(11.8%)조차 70.3%가 신규채용이 아니라 기존 인력 재배치로 충원했고, 자체 생성형 AI를 구축한 곳은 2.9%뿐이다. 활용 기술은 역할에 따라 갈린다 — 종사자는 자료 탐색·검색·분석(34.4%)처럼 업무를 보조하는 기능을, 프리랜서는 3D 모델링(35.5%)·2D 이미지 생성(34.7%) 등 결과물을 직접 만드는 기능을 더 많이 쓴다. 두 집단 모두 '효율성·생산성 향상'(종사자 55.7%·프리랜서 54.9%)을 활용 목적 1순위로 꼽아, 새로운 수익 창출보다는 반복업무 절감에 방점이 있다. 가치사슬 단계별로는 사업체·종사자가 모든 장르에서 기획보다 제작 단계의 AI 활용 가능성을 높게 평가한 반면, 프리랜서만은 유일하게 만화·웹툰에서 기획(63.5%)을 제작(53.2%)보다 높게 평가했다 — 별도 기획 인력 없이 혼자 전 공정을 담당하는 프리랜서 특유의 업무구조 때문이다. 장르별로는 애니메이션이 사업체·종사자·프리랜서 전 집단에서 활용률 1위(51.7/55.9/52.2%)를 지켰고, 출판은 텍스트(교정·교열), 만화·웹툰·애니메이션·캐릭터는 이미지·영상, 음악은 음원·음향을 중심으로 활용 기술이 갈렸다. 정성조사에서 확인된 공통 패턴은 'AI 생성 후 사람이 검수'다 — 만화·웹툰은 AI가 만든 배경·효과를 작가가 리터칭하고, 음악은 AI 반주를 참고자료로 실제 악기 재녹음하며, 출판은 AI 교정·번역 결과를 편집자가 원문과 대조한다. 보고서는 이 구조를 근거로 AI 지원정책이 '도입 자체'가 아니라 장르·직무별 활용역량과 결과물 검수능력 강화에 초점을 둬야 한다고 제언한다.","keypoints":["사업체 공식 AI 도입률 34.1%(애니메이션 51.7%) vs 종사자 40.6%·프리랜서 41.9% 개인 활용 — 조직 밖에서 이미 더 많이 쓴다","AI 전문인력 확보 사업체 11.8%, 그중 70.3%는 신규채용 아닌 기존인력 재배치 — 채용시장엔 안 잡히는 수요","종사자는 자료탐색(34.4%) 등 보조기능, 프리랜서는 3D모델링(35.5%)·이미지생성(34.7%) 등 제작기능 중심","두 집단 모두 활용목적 1위는 '효율성·생산성 향상'(55%대) — 새 아이디어·수익창출은 최하위권","만화·웹툰 프리랜서만 기획단계(63.5%)를 제작단계(53.2%)보다 높게 평가, 1인 다역 업무구조 반영","AI 생성물은 예외 없이 사람이 검수·수정 후 사용 — 리터칭(만화), 재녹음(음악), 원문대조(출판) 등"],"why":"GCA의 콘텐츠기업 AI 지원사업 설계에 바로 쓸 수 있는 실증 근거다. 사업체 공식 도입률(34%)만 보고 정책 수요를 판단하면 종사자·프리랜서의 개인 단위 활용(40%대)을 놓치므로, 지원사업 대상을 '기업'만이 아니라 '프리랜서·개인 계정'까지 넓혀야 한다는 근거로 인용할 수 있다. AI 교육을 설계할 때도 일반적 툴 사용법보다 장르·직무별 활용사례와 결과물 검수 역량을 중심에 두라는 제언은 도내 AI 활용 교육과정 개편에 그대로 적용 가능하다.","url":"https://www.kocca.kr/kocca/bbs/view/B0000141/2012494.do?menuNo=204145","file":"2026-09-09/[KOCCA포커스 통권 216호] 콘텐츠산업에서 AI는 누가, 어떻게 활용하는가_사업체·종사자·프리랜서의 AI 활용 현황.pdf","_recent":false},{"id":"2026-09-07-kocca-china-physical-ai","week":"2026-09-09","title":"중국 피지컬 AI 발전 현황과 문화산업 응용 사례 (중국 26-08호)","issuer":"한국콘텐츠진흥원 북경비즈니스센터","type":"해외 산업동향","published":"2026-09-07","pages":34,"size":"2.4MB","genres":["글로벌·수출","AI·기술"],"tags":["피지컬AI","휴머노이드로봇","구신지능","차이나조이","로봇공연","팝업스토어","문화기술"],"lede":"휴머노이드 로봇이 공장 설비를 벗어나 박물관·공연장·팝업스토어의 콘텐츠 인터페이스로","speakers":[],"summary":"KOCCA 북경비즈니스센터가 2026년 9월 7일 발간한 중국 콘텐츠 산업동향(2026년 8호)의 심층분석으로, 중국에서 '피지컬 AI(物理AI, 구신지능/체화지능)'가 제조·물류 현장을 넘어 문화산업의 오프라인 접점으로 확산되는 과정을 다룬다. 시장 규모부터 압도적이다. 넓은 의미의 중국 체화지능 시장은 2018년 2,133억 위안에서 2025년 9,150억 위안으로 커졌고 2026년 1조 위안 돌파가 전망되며, 그중 휴머노이드 로봇 시장만 2025년 4,648억 위안(2026년 5,717억 위안 전망)이다. 2025년 기준 전 세계 휴머노이드 로봇 완성품 기업 300여 곳 중 140개가 중국 기업이고, 중국의 연간 출하량(약 1만 4,400대)은 세계 전체의 84.7%를 차지한다. 정책 뒷받침도 빠르다 — 2025년 중국 정부업무보고에 피지컬 AI가 처음 명시되며 바이오제조·양자기술·6G와 함께 미래 육성 산업으로 국가전략 수준에 올랐고, 2026년 6월 공업정보화부·국유자산감독관리위원회 공동 통지는 2026년 말까지 100개 이상의 고부가가치 응용 장면과 1만 대급 현장 배치 역량 확보를 목표로 못박았다. 문화산업 응용은 세 갈래로 나타난다. 엔터테인먼트·IP 분야에서는 2026년 7~8월 '차이나조이 2026'에서 유니트리의 격투 로봇 G1이 최대 화제를 모았고, 블리자드 <월드 오브 워크래프트>와 협업한 '멀록 커스텀 에디션' 로봇처럼 게임 IP를 입은 소비자용 로봇이 등장했다. 방송에서는 2025년 CCTV 춘절특집 <추봇>(H1 로봇 16대의 민속춤)에 이어 2026년 <무봇>이 외부 위치 보조 없는 완전 자율 협업으로 무술 동작을 구현했고, 베이징 냐오차오에서 열린 가수 장제 콘서트에는 로봇 30여 대가 투입돼 16회 연속 공연을 안정적으로 수행했다. 문화·관광 분야는 가장 빠르게 실용화됐다 — 상하이의 도시 통합 AI 에이전트 '후샤오유', 상하이역사박물관의 안내로봇 '리샤오보'(도슨트+판매보조 겸용), 베이징의 '문화관광 10대 과학기술 응용 장면'(로봇밴드·로봇셰프 등)이 그 사례다. 리테일에서는 갤봇이 2025년 8월 로봇이 전 과정을 자율 운영하는 2.7평 팝업스토어를 열어 일부 지점 일 매출 1만 위안을 기록했고, 이후 20여 개 도시 100개 이상 지점으로 확대됐다. 보고서는 중국의 강점을 전기차 산업에서 축적한 배터리·센서·정밀조립 공급망의 이식에서 찾으면서도, AI 칩·핵심 소프트웨어는 여전히 엔비디아 등 해외 의존적이라는 한계도 짚는다.","keypoints":["중국 체화지능 시장 2025년 9,150억 위안→2026년 1조 위안 돌파 전망, 휴머노이드만 4,648억 위안","세계 휴머노이드 완성품기업 140개가 중국, 연간 출하량 84.7%(약 1만4,400대) 세계 최대 점유","2025년 중국 정부업무보고에 피지컬AI 최초 명시 후 국가전략산업 승격, 2026년 말까지 응용장면 100개+현장배치 1만대 목표","차이나조이 2026서 블리자드 IP 결합 로봇 등장, CCTV 춘절 <무봇>은 완전자율 무술 퍼포먼스로 진화","상하이 '리샤오보'는 도슨트+판매보조 겸용, 갤봇 무인 팝업스토어는 20여 도시 100개 지점으로 확장","강점은 전기차 공급망(배터리·센서·정밀조립) 이식, 약점은 AI칩·핵심부품의 대외(엔비디아 등) 의존"],"why":"국내에서도 로봇·AI 융합 콘텐츠 수요가 커지는 가운데, 중국이 하드웨어 제조 우위를 문화산업 응용 실증(공연·관광·리테일)으로 빠르게 전환하는 경로를 보여준다. GCA가 실감콘텐츠·XR 지원사업에 로봇 인터랙션 요소를 검토할 때 참고할 해외 벤치마크이며, 팝업스토어형 로봇 리테일이나 관광 안내 로봇처럼 도내 관광·상업시설과 결합 가능한 응용 사례를 발굴하는 데도 참고할 수 있다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158950/2012504.do?menuNo=204160","file":"2026-09-09/[중국 26-08] 중국 피지컬 AI 발전 현황과 문화산업 응용 사례.pdf","_recent":false},{"id":"2026-09-01-mcst-2027-restructuring","week":"2026-09-02","title":"2027년 문화체육관광부 지출구조조정 사업 (대외공개용)","issuer":"문화체육관광부 기획조정실","type":"예산자료","published":"2026-09-01","pages":1,"size":"41KB","genres":["정책·산업","투자·금융"],"tags":["2027예산안","지출구조조정","모태펀드","K-콘텐츠펀드","국민성장펀드","우선순위조정","정책금융"],"lede":"문체부가 2027년 정부안을 짜며 잘라낸 417개 사업과 감액 사유 전량","speakers":[],"summary":"문화체육관광부가 2027년 예산 정부안 제출에 맞춰 9월 1일 예산자료 게시판에 올린 지출구조조정 실적표다. 엑셀 한 장에 417개 세부사업의 2026년 본예산 → 2027년 정부안 → 감액분 → 구조조정 유형이 그대로 나열돼 있어, 부처가 무엇을 어떤 명목으로 잘랐는지 사업 단위로 확인할 수 있는 1차 자료다. 대상 사업 총액은 1조 5,051억 원에서 7,959억 원으로 7,092억 원(47.1%)이 정리됐고, 이 중 132개 사업은 2027년 정부안에서 전액(3,645억 원) 삭감됐다. 유형별로는 '우선순위 조정'이 282건·3,659억 원으로 압도적이고, 집행부진 10건·1,289억 원, 유사중복 정비 33건·717억 원, 기타 32건·669억 원, 평가·지적 40건·533억 원이 뒤를 잇는다. 콘텐츠 관련 사업만 추리면 75건·3,025억 원이다. 단일 최대 감액은 'K-콘텐츠 펀드 출자(모태펀드 문화계정, 수출펀드 등)' 1,800억 원 전액이고, 유형은 '우선순위 조정'으로 적혀 있다. 다만 이 한 줄을 콘텐츠 정책금융 축소로 곧장 읽으면 오독이다. 같은 시기 금융위원회 국민성장펀드 기금운용심의회(8.27) 누적 승인 목록에는 'K-콘텐츠펀드 1,500억 원'이 부처협업펀드로, CJ포디플렉스 지분투자 2,200억 원이 콘텐츠 항목으로 이미 올라 있다. 조달 창구가 모태펀드 문화계정에서 국민성장펀드 쪽으로 옮겨가는 국면으로 보이며(이 표만으로 단정할 수는 없다), 2027년 문화·체육·관광 총지출은 오히려 11조 6,100억 원으로 20% 넘게 늘어난다. 그 밖에 신기술융합콘텐츠 향유 인프라 조성 86억, 게임제작환경 AX 지원 75억, 지역특화소재 콘텐츠 개발 66억, 콘텐츠 해외시장 개척지원 66억, 한류연계 협업콘텐츠 기획개발 59억, 방송영상 후반작업 지원 50억, 중소제작사 글로벌 도약 지원 40억이 전액 또는 대폭 잘렸다.","keypoints":["417개 사업 1조 5,051억 → 7,959억, 7,092억(47.1%) 구조조정. 132개 사업은 2027년 정부안 0원","감액 사유 1위는 '우선순위 조정' 282건·3,659억 원 — 사업 실패가 아니라 순위 밀림이 대세","콘텐츠 관련 75건·3,025억 원 감액. 최대는 K-콘텐츠 펀드 출자(모태펀드 문화계정) 1,800억 전액","단, 8.27 국민성장펀드 심의회에 'K-콘텐츠펀드 1,500억'이 부처협업펀드로 등재 — 창구 이동 정황","지역·수출 사업이 집중 타깃: 지역특화소재 콘텐츠 66억, 콘텐츠 해외시장 개척 66억, 한류연계 기획개발 59억 전액 삭감","비콘텐츠 최대 감액은 스포츠산업 융자 1,248억(집행부진) — 융자사업 집행률이 감액 근거로 쓰인 사례"],"why":"내년도 국비 사업을 설계할 때 '어떤 명목이 감액 사유가 되는가'를 역으로 읽을 수 있는 자료다. 우선순위 조정·집행부진·유사중복 정비가 감액 3대 사유이므로, GCA 신규 사업 기획서에는 유사 사업과의 차별점과 집행 가능성(실적 기반)을 앞세워야 방어된다. 특히 지역특화소재 콘텐츠 개발·콘텐츠 해외시장 개척지원처럼 지역 진흥원이 수행하던 매칭 사업이 전액 삭감된 만큼, 2027년 국비 매칭을 전제로 잡아둔 사업은 조기에 재원 대체안을 검토해야 한다. K-콘텐츠 펀드가 모태펀드에서 국민성장펀드로 옮겨가는 흐름은 도내 콘텐츠 기업 투자유치 안내 창구를 바꿔야 한다는 뜻이기도 하다.","url":"https://www.mcst.go.kr/site/s_data/budget/budgetView.jsp?pSeq=1001","file":"2026-09-02/MCST_2027년_지출구조조정_사업.xlsx","_recent":false},{"id":"2026-08-03-kcti-content-firms-2025q3","week":"2026-09-02","title":"콘텐츠 산업 기업 동향 (2025년 3분기)","issuer":"한국문화관광연구원 데이터정책본부 데이터전략실","type":"산업통계","published":"2026-08-03","pages":26,"size":"1.3MB","genres":["정책·산업"],"tags":["기업통계등록부","콘텐츠기업","종사자","상용직","임시일용직","수도권집중","고용의질"],"lede":"기업 수는 늘었지만 방송은 상용직이 줄고 임시일용직만 9.6% 급증","speakers":[{"name":"채예린","role":"한국문화관광연구원 데이터전략실 연구원","topic":"통계 작성·문의"},{"name":"오시진","role":"한국문화관광연구원 데이터전략실 차석전문원","topic":"통계 작성·문의"}],"summary":"국가데이터처 기업통계등록부(분기 자료)를 「콘텐츠산업 특수분류」로 재가공한 분기 통계다. 사업체가 아닌 '기업(본사 기준)' 단위이고 국가승인통계가 아닌 가공통계라, 일러두기에서 총량보다 증감률의 변화를 보라고 못 박아 두었다. 2025년 3분기 콘텐츠 산업 기업 수는 99,049개로 전년동기 대비 2.7%(+2,574개), 종사자는 1,478,149명으로 1.1%(+15,502명) 늘었다. 업종별로 기업 수 비중은 음악(32.7%)·출판(30.4%)이, 종사자 비중은 방송(32.4%)·지식정보(19.8%)가 크다(한 기업이 여러 업종을 겸하면 중복 집계돼 합이 100%를 넘는다). 숫자가 말하는 구조는 두 갈래다. 첫째는 지역 집중이다. 기업의 78.6%, 종사자의 79.6%가 수도권에 몰려 있고(서울 49.6%/58.9%, 경기 25.4%/18.6%, 인천 3.6%), 비수도권 1위 부산조차 기업 3.4%·종사자 3.4%에 그친다. 경기는 기업 비중(25.4%)이 종사자 비중(18.6%)보다 약 7%p 높아, 서울 대비 기업당 규모가 작다는 사실이 그대로 드러난다. 둘째는 고용의 질이다. 전체로는 상용직 1,067,545명(+1.1%)과 임시일용직 410,604명(+0.9%)이 함께 늘었지만, 상용직 증가분 11,665명은 사실상 전부 여성(+12,044명, +2.6%)이고 남성 상용직은 379명 줄었다. 업종별로 보면 방향이 갈린다. 방송산업은 상용직이 365,803명으로 0.4% 감소해 2025년 1분기부터 3분기 연속 줄어든 반면 임시일용직은 112,532명으로 9.6% 늘며 증가율이 확대되고 있다 — 방송 종사자 전체 증가율 1.8%가 사실상 비정규 고용으로 채워졌다는 뜻이다. 애니메이션은 상용직 33,527명(-0.7%)·임시일용직 11,520명(-3.3%)이 동반 감소해 12개 업종 중 유일하게 종사자가 줄었다(-1.4%). 반대로 게임은 9분기 연속 감소하던 임시일용직이 증가로 돌아서 22,174명(+4.6%)으로 2분기째 늘었다. 기업 수 증가율은 음악(4.1%)·영화(3.8%)·콘텐츠솔루션(3.8%)·만화(3.7%) 순이다.","keypoints":["기업 99,049개(+2.7%)·종사자 1,478,149명(+1.1%) — 기업이 종사자보다 두 배 이상 빠르게 늘어 영세화 진행","수도권 집중: 기업 78.6%·종사자 79.6%. 경기는 기업 25.4% 대 종사자 18.6%로 기업당 규모가 작다","방송: 상용직 365,803명(-0.4%, 3분기 연속 감소) vs 임시일용직 112,532명(+9.6%) — 정규직의 비정규 대체","애니메이션만 종사자 감소(-1.4%), 상용·임시일용 동반 하락으로 12개 업종 중 유일","상용직 순증 11,665명 중 여성이 12,044명, 남성은 -379명 — 증가분 전량이 여성 고용","게임 임시일용직이 9분기 연속 감소를 끊고 2분기 연속 증가(+4.6%) — 제작 현장 재가동 신호"],"why":"경기도 콘텐츠산업 정책의 근거로 쓸 수 있는 최신 분기 고용 데이터다. 경기의 기업 비중(25.4%)이 종사자 비중(18.6%)을 크게 웃도는 구조는 '기업은 많은데 규모가 작다'는 GCA의 기존 문제의식을 국가 통계로 뒷받침해 주므로, 성장단계별 스케일업 지원 사업의 논거로 바로 인용할 수 있다. 방송 상용직 3분기 연속 감소와 임시일용직 급증은 방송영상 인력지원 사업을 신규 채용 중심에서 프리랜서·비정규 종사자 보호 쪽으로 조정할 근거가 된다. 애니메이션 종사자 감소는 도내 애니메이션 지원 사업 우선순위를 다시 볼 신호다.","url":"https://www.kcti.re.kr/web/board/boardContentsView.do?board_id=34&contents_id=847075f6be614d70a74c45675b579678","file":"2026-09-02/KCTI_콘텐츠산업_기업동향_2025년3분기.pdf","_recent":false},{"id":"2026-08-31-kocca-tokyo-broadcast","week":"2026-09-02","title":"일본 방송산업 동향: TV를 떠나는 시청자, 세계로 향하는 일본 방송사 (도쿄 26-08호)","issuer":"한국콘텐츠진흥원 도쿄비즈니스센터","type":"해외 산업동향","published":"2026-08-31","pages":18,"size":"3.0MB","genres":["영상·방송","글로벌·수출"],"tags":["일본방송","국제공동제작","포맷수출","숏폼","웹툰IP","TBS","후지TV","OTT"],"lede":"일본 TV 시청률은 무너지는데 한국과의 공동제작은 전면화되고 있다","speakers":[{"name":"이혜은","role":"KOCCA 도쿄비즈니스센터 센터장","topic":"감수"},{"name":"하기 쿠루미","role":"KOCCA 도쿄비즈니스센터 주임","topic":"감수"},{"name":"김승미","role":"VPO 경영기획부 리서치팀 팀장","topic":"집필"},{"name":"야마자키 나오키","role":"VPO 경영기획부 부장","topic":"집필"},{"name":"하세가와 토모코","role":"저널리스트","topic":"집필"}],"summary":"총무성 「정보통신백서 2026」, NHK방송문화연구소 국민생활시간조사, 덴츠 「정보미디어백서 2026」 등을 엮어 정리한 일본 방송산업 리포트다. 안으로는 시청자 이탈, 밖으로는 공동제작 확장이라는 두 흐름이 뼈대다. 2024년도 일본 방송산업 규모(방송사업 수입+외 수입)는 3조 6,042억 엔으로 전년의 99.4%에 그쳐 2022년도부터 감소세이며, 2007년 정점(4조 740억 엔)을 회복하지 못했다. 구성은 공중파 민방 2조 1,833억 엔(60.8%), 케이블TV 4,740억 엔(13.2%), 위성계 3,200억 엔(8.9%), NHK 6,125억 엔이다. NHK는 수신료 인하 영향으로 경상수입이 전년의 93.3%, 수신료 수입은 5,958억 엔(93.0%)으로 내려앉았고, 케이블TV는 2018년 이후 6년 연속 감소했다. 시청 이탈은 더 극적이다. 평일 15분 이상 실시간 TV를 보는 비율은 2005년 90% → 2020년 79% → 2025년 71%로, 1995년 현행 조사 도입 이래 처음으로 모든 세대에서 동시에 감소했다. 16~19세는 47%→27%, 30대는 63%→43%로 5년 만에 급락했고, 16~19세·20대의 약 70%와 30대의 약 60%가 평일에 TV를 거의 보지 않는다. 2025년 시청률 상위는 NHK 홍백가합전(개인 26.4%)과 MLB 도쿄시리즈·하코네 역전 등 스포츠·이벤트가 싹쓸이해, 정규 편성물의 소구력이 사라졌음을 보여준다. 반면 방송 콘텐츠 수출액은 2024년 1,147.3억 엔으로 전년 대비 311.5억 엔 늘었다. 애니메이션이 978.3억 엔으로 대부분이지만 드라마·버라이어티 등 실사 부문도 169억 엔으로 증가했고, 총무성이 세운 '2025년도 857억 엔(2020년의 1.5배)' 목표는 이미 초과 달성됐다. 방송사별 전략은 구체적이다. 니혼TV는 200억 엔대인 해외 매출을 2033년 1,000억 엔(약 5배)으로 늘리겠다며 글로벌 포맷 스튜디오 'GYOKURO STUDIO'를 신설했고, TBS HD는 CJ ENM·U-NEXT와 프리미엄 IP 스튜디오 'StudioMonowa'를 세우며 <SASUKE> 라이선스를 165개국·포맷을 25개국으로 넓혔다. TV도쿄는 'VISION 2035' 아래 200억 엔 전략투자와 M&A로 해외 매출 비중 40%를 목표하고, 애니·스트리밍 부문에서 매출 523억 엔(+11.5%)·영업이익 65억 9,000만 엔(+55.0%)을 냈다. 후지TV는 2030년까지 미디어·콘텐츠에 1,500억 엔을 투자하며 한국과의 공동제작을 전면에 세웠다 — 카카오엔터·플레이리스트와 웹툰 <남장비서> 숏폼 드라마, 이매지너스와 OTT 드라마, 이준기 출연 <kiDnap GAME>(홍콩 MakerVille·한국 심스토리 공동제작, 18개국 방영 예정), 웹툰 레이블 'TOON8' 신설이 그 목록이다.","keypoints":["일본 방송산업 3조 6,042억 엔(전년 99.4%), 2007년 정점 4조 740억 엔 이후 회복 실패","평일 15분 이상 TV 시청률 71%(2005년 90%) — 1995년 조사 도입 이후 처음으로 전 세대 동시 감소","16~19세 47%→27%, 30대 63%→43%. 20대 이하 약 70%가 평일 TV를 거의 안 봄","수출은 2024년 1,147.3억 엔(+311.5억). 애니 978.3억이 주력이나 실사 부문도 169억으로 증가","TBS HD가 CJ ENM·U-NEXT와 'StudioMonowa' 설립, 후지TV는 카카오엔터·플레이리스트·이매지너스와 연쇄 공동제작","후지TV 2030년까지 1,500억 엔 투자, TV도쿄 해외 매출 비중 40% 목표 — 자금이 붙은 파트너 수요"],"why":"일본 방송사가 내수 붕괴를 국제 공동제작으로 메우려 하고, 그 1순위 파트너로 한국을 지목하고 있다는 점이 핵심이다. 후지TV-카카오엔터의 웹툰 원작 숏폼, TBS-CJ ENM의 IP 스튜디오처럼 '한국 IP + 일본 자본·플랫폼' 조합이 이미 계약 단계로 넘어갔으므로, 도내 웹툰·숏폼 제작사를 대상으로 한 일본 바이어 매칭은 지금이 적기다. 니혼TV·TV도쿄가 명시한 해외 매출 목표와 투자 규모는 GCA 수출상담회·비즈매칭 유치 제안서에 상대의 구매 여력을 보여주는 근거로 쓸 수 있다. 동시에 일본의 TV 이탈 데이터는 국내 방송영상 지원 사업이 편성 중심에서 숏폼·OTT 중심으로 옮겨가야 할 이유를 보여준다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158950/2012467.do?menuNo=204160","file":"2026-09-02/[도쿄26-08호]일본 방송산업 동향_TV를 떠나는 시청자, 세계로 향하는 일본 방송사.pdf","_recent":false},{"id":"2026-08-24-kofic-jul","week":"2026-08-26","title":"2026년 7월 한국 영화산업 결산","issuer":"영화진흥위원회 정책본부 정책개발팀","type":"산업통계","published":"2026-08-24","pages":21,"size":"0.7MB","genres":["영화","정책·산업"],"tags":["박스오피스","호프","극장매출","쇼박스","누적흥행","텐트폴분산","한국영화점유율"],"lede":"7월 매출 71.5%가 영화 한 편 〈호프〉 — 회복은 늘 소수 대작이 끌고 간다","speakers":[{"name":"김성희","role":"영화진흥위원회 정책본부 정책개발팀 객원연구원","topic":"집필"}],"summary":"영진위 월간 극장 결산의 7월호. 7월 한국영화 매출액은 583억 원으로 전월 대비 36.8%, 전년 동월 대비 40.8% 늘었고 관객 수도 543만 명으로 전년 동월 대비 24.2% 증가했다. 그런데 이 증가분의 대부분은 사실상 영화 한 편이 만들었다. 나홍진 감독의 SF 액션 대작 〈호프〉가 7월 한 달에만 매출 417억 원·관객 386만 명을 기록했는데, 이는 7월 한국영화 전체 매출의 71.5%에 해당한다. 개봉일인 7월 15일부터 14일 연속 일일 박스오피스 1위를 지켰다. 반대로 외국영화는 매출 556억 원(-24.3%)·관객 539만 명(-26.9%)으로 2022년 팬데믹 거리두기 해제 이후 7월 기준 최저치를 기록했는데, 원인은 부진이 아니라 개봉 시기 분산이다. 〈스파이더맨: 브랜드 뉴 데이〉가 7월 29일에야 개봉했고 〈오디세이〉 등 다른 기대작도 7월 말~8월 초로 밀리면서, 예년처럼 7월에 외화 텐트폴이 몰리지 않았다. 1~7월 누적으로 보면 전체 매출 6,929억 원(+32.6%)·관객 6,786만 명(+25.1%)으로 견조하지만, 이 역시 소수 대작 편중이 뚜렷하다. 누적 흥행 1~4위(〈왕과 사는 남자〉 1,632억·〈군체〉 627억·〈호프〉 417억·〈살목지〉 333억)가 전부 한국영화이고, 이 네 편이 한국영화 누적 매출 4,286억 원(+74.8%)의 상당 부분을 차지한다. 외국영화는 누적 매출 2,644억 원으로 오히려 4.8% 줄었다. 배급사별로도 7월 한 달 메가박스중앙㈜플러스엠이 〈호프〉 한 편으로 매출 점유율 36.6%를 가져가며 전체 배급사 1위에 올랐다.","keypoints":["7월 한국영화 매출 583억원(+40.8%)·관객 543만명(+24.2%) — 증가분의 71.5%가 〈호프〉 한 편","〈호프〉는 개봉 후 14일 연속 일일 박스오피스 1위, 7월 매출 417억·관객 386만명","외국영화 매출 556억원(-24.3%)은 2022년 이후 7월 최저 — 부진이 아니라 텐트폴 개봉시기가 7월말~8월로 밀린 결과","1~7월 누적 매출 6,929억원(+32.6%)이나 흥행 1~4위 전부 한국영화(왕과 사는 남자·군체·호프·살목지)에 쏠림","1~7월 외국영화 누적 매출은 오히려 4.8% 감소(2,644억원) — 회복은 한국영화 대작 편중 구조","7월 배급사 순위 1위 메가박스중앙㈜플러스엠, 〈호프〉 단 한 편으로 매출 점유율 36.6% 확보"],"why":"월별 결산은 얼핏 통계 나열로 보이지만, '흥행 회복'을 대작 1~2편 편중으로 읽어낼 수 있는 자료다. 상반기 결산(쇼박스 48.6% 편중)에 이어 7월에도 동일한 구조(단일작 71.5%)가 반복된다는 점은 국내 영화산업의 허리(중소 배급·중예산 영화) 지원 필요성을 뒷받침하는 근거로 쓸 수 있다.","url":"https://www.kofic.or.kr/kofic/business/board/selectBoardDetail.do?boardNumber=2&boardSeqNumber=74984","file":"2026-08-26/2026년 7월 한국 영화산업 결산 보고서.pdf","_recent":false},{"id":"2026-08-25-kcti-content-trade-2026h1","week":"2026-08-26","title":"[콘텐츠산업 동향 인덱스] 콘텐츠 분야 상품 무역 (2026년 2호)","issuer":"한국문화관광연구원 콘텐츠연구본부","type":"산업통계","published":"2026-08-25","pages":11,"size":"0.7MB","genres":["정책·산업","글로벌·수출"],"tags":["무역수지","K팝굿즈","응원봉","포토카드","음반수출","게임용품적자","관세청통관","유럽수출"],"lede":"K팝 실물 굿즈가 무역흑자를 만든다 — 음반·응원봉은 폭증, 포토카드는 반토막","speakers":[],"summary":"관세청 통관 신고 기준 한국무역협회 「K-stat 무역통계」를 재가공해, 콘텐츠가 내재된 실물 품목의 국경 간 거래만 따로 떼어 본 통계 인덱스다. 음반물·영상물·서적·잡지·게임용품에 더해 포토카드(인쇄카드 코드)와 콘서트 응원도구(축제도구 기타 코드)까지 콘텐츠 상품으로 범주화한 것이 특징으로, 라이선스·서비스 수출 위주인 기존 콘텐츠산업 수출통계에서는 잡히지 않던 '팬덤 실물 소비'를 볼 수 있다.\n\n2026년 상반기 콘텐츠 분야 상품 무역수지는 2억2,330만 달러 흑자로, 전년 동기(8,570만 달러)보다 1억3,760만 달러 늘었다. 수출이 5억3,160만 달러로 39.8% 급증한 반면 수입은 3억830만 달러로 4.7% 증가에 그치면서 흑자폭이 벌어졌다. 흑자를 만든 것은 사실상 K팝 관련 두 품목이다. 음반물 수출이 2억5,750만 달러로 122.5% 늘어 단일 품목 최대 흑자(2억5,490만 달러)를 냈고, 콘서트 응원도구(응원봉 등)는 수출 5,020만 달러로 183.6% 폭증하며 흑자가 120만 달러에서 3,450만 달러로 한 해 만에 29배가 됐다.\n\n반대 방향의 숫자도 분명하다. 한때 팬덤 굿즈의 대표 품목이던 포토카드는 수출이 2,150만 달러로 52.1% 급감해 흑자가 3,470만 달러에서 1,410만 달러로 반토막 났다. 서적은 수출 1억750만 달러(-18.8%)로 흑자가 6,280만→4,440만 달러로 줄었는데, 대중국 수출이 21.1% 빠진 영향이 크다. 게임용품은 유일한 대규모 적자 품목으로 1억2,690만 달러 적자를 기록했다(수출 9,010만 달러 vs 수입 2억1,700만 달러). 콘솔·게임기기를 사 오는 구조가 그대로다.\n\n권역별로는 對아시아 수지가 -1,810만 달러에서 +1,460만 달러로 흑자 전환한 것이 최대 변화다. 대중 적자가 -1억2,220만→-8,370만 달러로 개선됐는데, 중국 음반물 수출이 204.4% 늘어난 것이 주된 이유다. 유럽은 수출이 8,030만 달러로 142.9% 늘며 흑자가 1,450만→6,090만 달러로 커졌고, 특히 유럽향 콘서트 응원도구 수출이 939.1%(영국은 1,508.7%) 폭증했다. 북미도 수출 1억5,230만 달러(+78.5%), 미국 음반물 수출은 281.0% 늘었다. 반면 중동은 수출이 51.2% 줄었다.","keypoints":["2026년 상반기 콘텐츠 상품 무역수지 2억2,330만달러 흑자 — 전년 동기 대비 1억3,760만달러 증가","수출 5억3,160만달러(+39.8%)가 수입 4.7% 증가를 크게 앞지르며 흑자폭 확대","음반물 수출 +122.5%(2억5,750만달러), 콘서트 응원도구 수출 +183.6% — 흑자 120만→3,450만달러(29배)","포토카드는 수출 -52.1%로 급감, 흑자 3,470만→1,410만달러 반토막 — 팬덤 굿즈 안에서도 품목 교체 진행","게임용품은 유일한 대규모 적자(-1억2,690만달러) — 수입 2억1,700만달러 vs 수출 9,010만달러","對아시아 수지 흑자 전환(-1,810만→+1,460만달러), 대중 적자도 개선 — 중국 음반물 수출 +204.4%","유럽 수출 +142.9%, 유럽향 응원도구 수출 +939.1%(영국 +1,508.7%) — 서구권 팬덤 실물소비 본격화","서적 수출 -18.8%(대중국 -21.1%)로 출판 수출은 역행"],"why":"콘텐츠 수출을 이야기할 때 흔히 쓰는 KOCCA 수출액은 라이선스·서비스 중심이라 굿즈·MD 실물 거래가 빠진다. 이 인덱스는 관세청 통관 기준이라 그 공백을 메우며, '응원봉 수출 +183.6%' 같은 수치는 경기도 굿즈·MD 제조기업 지원사업이나 K팝 연계 수출상담회의 필요성을 설명할 때 바로 쓸 수 있는 근거다. 포토카드 급감·게임용품 적자처럼 방향이 엇갈리는 품목이 함께 있어, 지원 품목을 고를 때의 판단 자료로도 유용하다.","url":"https://www.kcti.re.kr/web/board/boardContentsView.do?board_id=34&contents_id=5795c0f6edcd49dca22647a67bce3449","file":"2026-08-26/콘텐츠 분야 상품무역_2026.2호.pdf","_recent":false},{"id":"2026-08-21-kocca-saudi-kpop","week":"2026-08-26","title":"사우디 음악 시장에서 K-Pop 활동 및 팬덤의 특징과 현지 진출 시사점 (사우디 26-3호)","issuer":"한국콘텐츠진흥원 사우디아라비아비즈니스센터 (집필: ㈜스트라베이스)","type":"해외 산업동향","published":"2026-08-21","pages":19,"size":"0.7MB","genres":["음악·공연","글로벌·수출"],"tags":["사우디아라비아","K팝","중동진출","MDLBEAST","국부펀드","니타카트","현지법인화","G2G협력"],"lede":"K팝 중동 진출의 다음 단계는 완제품 수출이 아니라 '제작 시스템 이식'","speakers":[{"name":"김정미","role":"㈜스트라베이스 (집필)","topic":"사우디 음악시장·K팝 팬덤 분석"},{"name":"구재상","role":"한국콘텐츠진흥원 사우디아라비아비즈니스센터장 (감수)","topic":"감수"}],"summary":"UAE와 함께 중동 엔터테인먼트 매출의 60% 이상을 차지하는 사우디아라비아 시장에서 K팝이 자리 잡는 과정과 그 산업적 함의를 다룬 심층 리포트다. PwC 전망에 따르면 사우디 음악산업은 2023년 이후 연평균 6.7% 성장해 2028년 3억1,000만 달러 규모에 이를 전망이고, 대형 페스티벌을 포함한 라이브 공연 시장은 2026년 기준 27억7,000만 달러에 달한다. 이 성장 축에 K팝이 올라타는 방식이 이 보고서의 핵심이다. 사우디 최대 뮤직페스티벌 MDLBEAST 사운드스톰 등에 K팝 아티스트가 참여하는 '플러그인 전략'으로 오프라인 트래픽을 만들고, 엠넷플러스·빅크 같은 디지털 플랫폼이 여성의 장거리 단독 이동 제약 등 현지 특수성을 보완하며 팬덤을 상시적으로 결집시킨다. 팬들은 공동구매·생일카페 등 오프라인 이벤트를 실물 경제 활동으로 정착시키고 있고, 'Habibi Dance Remix'처럼 중동 전통 타악기와 K팝 사운드를 결합한 현지화 시도도 나타난다. 다만 보고서가 강조하는 진짜 변곡점은 소비가 아니라 생산 구조의 이전이다. CJ ENM은 사우디 국부펀드(PIF) 산하 이벤트 기업 SELA와 파트너십을 맺어 현지 법인화를 진행 중인데, 이는 사우디 정부의 '지역본부(RHQ) 프로그램' — 중동·북아프리카 총괄 거점을 사우디에 두는 다국적기업에 정부 조달 우선권과 세제 혜택을 주는 정책 — 에 대한 선제 대응이기도 하다. 2025년 리야드 'K-콘텐츠 엑스포'에서 국내 기업 30개사가 현지 바이어 83개사와 447건의 비즈니스 미팅을 갖고 약 500억 원 규모 상담 성과를 낸 사례를 근거로, 보고서는 K팝의 오디션·육성 시스템(A&R)과 360도 무대·LED 등 공연 프로덕션 기술 자체를 현지에 수출하는 '시스템 이식' 모델로의 전환을 전망한다. 동시에 자국민 의무고용제 '니타카트', 이슬람 율법에 따른 콘텐츠 검열, 송금 시 원천징수세 등 실무 리스크를 짚으며, 개별 기업 역량만으로는 돌파가 어려운 만큼 사우디 엔터테인먼트청(GEA)·투자부(MISA)와의 상시 G2G 채널이 필요하다고 제언한다.","keypoints":["사우디 음악산업 연평균 6.7% 성장, 2028년 3억1천만달러 전망 — 라이브공연 시장은 이미 27억7천만달러(2026년)","K팝은 MDLBEAST 사운드스톰 등 메가 페스티벌 '플러그인' 참여로 오프라인 트래픽 확보, 엠넷플러스·빅크로 팬덤 상시 결집","'Habibi Dance Remix' 등 중동 전통음악과 K팝 사운드를 섞는 현지화 리믹스가 페스티벌 핵심 장르로 부상","CJ ENM, 사우디 국부펀드(PIF) 산하 SELA와 파트너십 체결 — 현지법인화로 'RHQ 프로그램' 세제혜택·정부조달 우선권 선점","2025년 리야드 K-콘텐츠 엑스포: 국내 30개사·현지 바이어 83개사, 447건 미팅·약 500억원 상담 성과","다음 단계는 완제품 수출이 아니라 오디션·A&R 시스템, 360도 무대·LED 등 공연 프로덕션 기술의 '턴키 수출'","리스크: 자국민 의무고용제 니타카트, 콘텐츠 검열, 송금 원천징수세 — G2G 채널을 통한 정책적 방어막 필요성 제언"],"why":"중동은 K팝의 다음 신흥시장으로 꼽히지만 국내에 축적된 실무 정보가 적다. 국부펀드 연계 페스티벌·RHQ 세제혜택 등 사우디 특유의 진출 조건과 니타카트·검열 같은 리스크 요인이 정리돼 있어, GCA가 경기도 콘텐츠기업의 중동 진출 지원사업(박람회 참가·현지 파트너 매칭)을 설계할 때 국가별 리스크 체크리스트로 바로 활용할 수 있다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158950/2012407.do?menuNo=204160","file":"2026-08-26/[사우디26-03호]사우디 음악 시장에서 K-Pop 활동 및 팬덤의 특징과 현지 진출 시사점.pdf","_recent":false},{"id":"2026-08-19-kocca-domestic-q1-2026","week":"2026-08-19","title":"2026년 1분기 콘텐츠산업 동향분석 보고서","issuer":"한국콘텐츠진흥원 (수행: 한국갤럽조사연구소)","type":"분기보고서","published":"2026-07-15","pages":230,"size":"16.5MB","genres":["정책·산업","투자·금융"],"tags":["콘텐츠산업통계","1분기결산","경영체감도CBI","상장사분석","웹툰","K팝실적","붉은사막","왕과사는남자"],"lede":"매출 40.9조·수출 38억달러는 늘고 종사자는 준 국내 콘텐츠산업 1분기 성적표","speakers":[{"name":"전종섭","role":"한국콘텐츠진흥원 데이터정책팀 책임연구원","topic":"연구책임"},{"name":"김태경","role":"한국갤럽조사연구소 부장","topic":"조사수행 PM"}],"summary":"표본 2,500개 사업체 실태조사와 상장사 재무제표 정량분석, 산업별 정성 이슈분석을 결합한 KOCCA의 분기 정례 보고서다. 2026년 1분기 국내 콘텐츠산업 매출은 40조9,495억 원으로 전년 동기 대비 7.9% 증가했고 수출은 38억1,604만 달러로 21.4% 늘었지만, 종사자 수는 68만1,756명으로 0.8% 줄어 '매출·수출은 늘어도 고용은 준다'는 구조가 재확인됐다. 산업별로는 영화가 전년 동기 대비 42.6% 늘어 가장 크게 성장했는데, 장항준 감독의 <왕과 사는 남자>가 1,573만 관객·1,518억 원의 단일작품 매출로 역대 한국영화 박스오피스 매출 1위에 오르며 극장가 전체를 팬데믹 이후 최대 실적으로 끌어올린 결과다. 음악산업은 17.7% 성장했는데, 하이브(매출 6,983억 원)·SM(2,791억 원)·JYP(1,860억 원)·YG(1,471억 원) 4대 기획사가 일제히 호실적을 내며 비음악(MD·라이선싱·팬클럽) 매출 비중을 하이브 34%·SM 25%·YG 18%·JYP 12%까지 끌어올렸고, 동남아 매출이 전년 대비 32% 성장하며 '미-일-동남아-중' 4각 편대로 시장이 다변화됐다. 게임산업은 23.9% 성장했지만 속을 들여다보면 양극화가 뚜렷하다 — 넥슨과 크래프톤(펄어비스 '붉은사막' 26일 만에 500만 장 판매 등) 두 회사의 영업이익 합계가 상장 14개사 전체 영업이익의 약 73%를 차지했다. 반대로 방송산업은 지상파 3사가 3년 연속 영업손실(2025년 1,174억 원)을 낸 반면, 티빙 가입자를 37.3% 늘린 CJ ENM과 중예산 드라마로 해외 매출 비중 61%를 달성한 스튜디오드래곤 등 OTT 공급 스튜디오는 뚜렷이 갈렸다. 출판은 3.7% 감소했지만 '문학의 부활'(베스트셀러 100위 내 소설 22권, 2년 전의 4배)과 생성형 AI 저작권 이슈가 새로운 화두로 떠올랐고, 캐릭터산업은 2025년 한 해 3,000개를 넘어선 팝업스토어 붐(전년비 +13.7%)에 힘입어 9.4% 성장했다.","keypoints":["1분기 매출 40조9,495억원(+7.9%)·수출 38억1,604만달러(+21.4%) 증가, 종사자는 68만1,756명(-0.8%)으로 감소","영화산업 +42.6% 최대 성장 — <왕과 사는 남자> 1,573만명·1,518억원으로 역대 한국영화 박스오피스 매출 1위","음악산업 +17.7%, 4대 기획사 비음악매출 비중 하이브34%·SM25%·YG18%·JYP12%로 확대, 동남아 매출 +32%","게임산업 +23.9% 성장이나 양극화 심화 — 넥슨·크래프톤 2개사가 상장 14개사 영업이익의 73% 독식","방송광고 매출 3년연속 감소(2조134억원,-12.3%)·지상파 3년연속 영업손실(1,174억원) vs CJ ENM·스튜디오드래곤 등 OTT공급 스튜디오는 호실적","출판 -3.7% 침체 속 '소설의 부활'(베스트셀러100위 내 소설 22권, 2년전 4배)과 생성형AI 저작권 딜레마 부상","캐릭터산업 +9.4% — 2025년 팝업스토어 3,000개 상회(+13.7%)가 성장 견인, AI 초개인화 체험이 신규 트렌드"],"why":"국가승인 수준의 표본조사에 기반한 분기 매출·수출·고용 정량치와 업종별 이슈분석이 결합돼 있어 GCA의 사업계획서·의정보고·보도자료에 근거자료로 바로 인용할 수 있다. 특히 게임·방송에서 확인된 '상위 소수 쏠림' 구조는 경기도 중소 콘텐츠기업 대상 지원사업을 설계할 때 우선순위 판단 근거로 쓸 만하다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158949/2012173.do?menuNo=204157","file":"2026-08-19/2026년 1분기 콘텐츠산업 동향분석 보고서.pdf","_recent":false},{"id":"2026-08-19-kocca-tokyo-character","week":"2026-08-19","title":"일본 캐릭터산업 동향: 생활 인프라가 된 캐릭터 (도쿄 26-07호)","issuer":"한국콘텐츠진흥원 도쿄비즈니스센터","type":"해외 산업동향","published":"2026-08-19","pages":21,"size":"4.2MB","genres":["글로벌·수출","IP·공간"],"tags":["일본","캐릭터산업","오시카츠","굿즈·MD상품","인바운드소비","산리오","포켓몬","생활인프라화"],"lede":"17.4조원 역대 최대 일본 캐릭터시장 — '오시카츠'가 굿즈를 생필품으로 바꿨다","speakers":[{"name":"김승미","role":"한국콘텐츠진흥원 경영기획부 리서치팀 팀장","topic":"집필"},{"name":"이혜은","role":"한국콘텐츠진흥원 도쿄비즈니스센터장","topic":"감수"},{"name":"하기 쿠루미","role":"한국콘텐츠진흥원 도쿄비즈니스센터 주임","topic":"감수"}],"summary":"일본 캐릭터데이터뱅크의 <CharaBiz DATA 2026>을 바탕으로 KOCCA 도쿄센터가 정리·분석한 보고서다. 2025년 일본 캐릭터 상품 소매시장은 전년 대비 3.2% 성장한 1조7,400억 엔으로 코로나 이후 5년 연속 확대되며 역대 최대치를 기록했다. 성장의 핵심 키워드는 '오시카츠(推し活, 최애 응원소비)'의 생활화다 — 좋아하는 대상을 응원하며 시간·돈을 쓰는 이 팬덤 행동이 일본은행 공식 경제보고서에 언급될 만큼 사회 전반으로 확산되면서, 캐릭터 상품이 '특별한 것'에서 '일상의 전제'로 바뀌었다. 수납·향기·위생·수면·요리 등 생활 전 영역에서 캐릭터가 역할을 부여받아 쓰이는 사례가 늘었고, 액세서리·의류·가정용품 등에서는 '세계관 단위' 시리즈 구매가 확산됐다. 채널 측면에서는 통신판매(온라인쇼핑몰)가 점유율 18.45%(전년대비 +1.47%p)로 1위에 올랐고, 반대로 완구·잡화 매대를 줄인 종합슈퍼(GMS)는 점유율이 11.21%나 급감해 저출산·업태 축소의 직격탄을 맞았다. 캐릭터 순위는 포켓몬스터가 5년 연속 1위, 호빵맨이 5년 연속 2위를 지켰고, 2017년 SNS 낙서에서 출발한 '치이카와(먼작귀)'가 4위에서 3위로 뛰어올라 매달 4~5개 신상 굿즈를 내는 등 신흥 IP의 저력을 보였다. 성별로는 여성 소비가 60.76%로 압도적이며, 영유아층(0~4세)과 30대 오시카츠층이 시장 확대를 이끈 반면 16~29세 청년층·50대 이상은 오히려 점유율이 줄었다. 흥미로운 점은 광고 지표와의 괴리다 — 캐릭터 기용 TV광고(2,356건)와 판촉 기용(944건)은 오히려 2년 연속 감소했는데, 이는 시장 전체를 견인할 '메가 히트' 캐릭터의 부재 때문으로 분석된다. 즉 소수 대형 IP 의존형 성장이 아니라 SNS발 오리지널 캐릭터(전년비 17.6%↑)까지 포함한 다층적 IP 생태계가 시장을 떠받치는 구조 전환이 일어난 것이다. 2026년에는 역직구·해외 팝업스토어 확대로 일본발 캐릭터의 '국내외 이중성장(Dual Growth)'이 본격화할 것으로 전망됐다.","keypoints":["2025년 일본 캐릭터 상품 소매시장 1조7,400억엔(전년비 3.2%↑), 코로나 이후 5년 연속 성장·역대 최대","성장 동력은 '오시카츠(推し活)' 생활화 + 인바운드 회복 + 체험소비 회복의 삼위일체","판매채널 1위 온라인쇼핑몰 18.45%(+1.47%p) — 반면 종합슈퍼(GMS)는 11.21%로 급감(비식품 매대 축소)","포켓몬스터 5년 연속 1위·호빵맨 5년 연속 2위, 2017년 SNS 낙서 출신 '치이카와'가 3위로 상승","여성 소비 60.76% vs 남성 39.24%, 0~4세·30대 오시카츠층이 성장 견인 vs 16~29세·50대+ 는 축소","캐릭터 기용 TV광고·판촉은 2년 연속 감소 — 대형 IP 대신 SNS발 캐릭터 다층화(오리지널 부문 +17.6%)로 성장구조 전환","2026년 전망: 브랜드 횡단 MD전략 심화 + 역직구·해외 팝업 확대로 '국내외 이중성장' 예상"],"why":"캐릭터·굿즈 산업이 팬덤 소비(오시카츠)를 매개로 생활용품 전 카테고리로 침투한 사례라, 경기 소재 IP·캐릭터 기업의 MD 다각화 지원사업이나 굿즈 스타트업 육성 방향을 설계할 때 참고자료로 쓸 수 있다. 특히 GMS(종합슈퍼) 쇠퇴와 온라인·전문점 강세라는 채널 재편 흐름은 국내 캐릭터 유통 지원정책에도 시사점을 준다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158950/2012398.do?menuNo=204160","file":"2026-08-19/[도쿄26-7호]일본 캐릭터산업 동향_생활 인프라가 된 캐릭터.pdf","_recent":false},{"id":"2026-08-19-kocca-india-policy","week":"2026-08-19","title":"인도 콘텐츠산업 지원정책 및 현황 (인도 26-11호)","issuer":"한국콘텐츠진흥원 인도비즈니스센터","type":"해외 산업동향","published":"2026-08-18","pages":15,"size":"0.7MB","genres":["정책·산업","글로벌·수출"],"tags":["인도","AVGC-XR","WAVES","공동제작협정","영화인센티브","콘텐츠정책","투자유치","K-콘텐츠진출"],"lede":"284억달러 인도 콘텐츠시장, 중앙·주정부가 경쟁하듯 쏟아내는 AVGC-XR 인센티브 지도","speakers":[{"name":"이경아","role":"더플랜지 대표","topic":"집필"},{"name":"김영수","role":"한국콘텐츠진흥원 인도비즈니스센터장","topic":"감수"}],"summary":"EY의 <2025 M&E Report>를 토대로 KOCCA 인도센터가 중앙정부·주정부의 콘텐츠산업 지원정책을 총정리한 보고서다. 2025년 인도 콘텐츠산업 규모는 284억 달러(약 2.7조 루피, 인도 GDP의 0.8%)로 전년 대비 7.2% 성장했고, 2028년에는 348억 달러까지 커질 전망이다. 디지털미디어가 44% 성장하며 처음으로 TV를 제친 반면, 게임 분야는 2025년 8월 인도가 RMG(실시간 현금게임) 금지법을 통과시키면서 17% 감소하는 등 분야별 명암이 뚜렷했다. 정책의 중심축은 2022-23 예산안에서 출범한 'AVGC-XR(애니메이션·VFX·게임·코믹스·XR)' 국가전략이다. 정보방송부·전자정보기술부가 공동 주도해 뭄바이 필름시티 내 국가우수센터(NCoE, 운영명 IICT)를 39.1억 루피(약 580억원) 예산으로 설립했고, Google·Apple·Microsoft·Meta·Adobe·NVIDIA와 산학협력을 맺어 1만5,000명 규모의 AI 인재양성 프로그램까지 연계했다. 외국 제작사 유치책도 구체적이다 — 2005년 이탈리아를 시작으로 한국(2015년, 11번째)·콜롬비아(2024년, 17번째)까지 국제 공동제작 협정을 체결해 자국 영화와 동일한 혜택을 부여하며, 인도 현지 촬영·후반작업 비용의 최대 40%(최대 3억 루피, 약 45억원)를 환급해준다. 2025년 5월 뭄바이에서 열린 WAVES 서밋은 90개국 1만 명 이상 대표단이 참가해 1,000억 루피(약 1.5조원) 규모의 거래·투자를 성사시켰고, 이후 상설화된 B2B 플랫폼 'WAVES Bazaar'는 3,000건 이상의 미팅과 133억 루피(약 2,100억원)의 라이선싱·공동제작 계약을 이끌어냈다 — Amazon Prime Video와 CJ ENM의 전략적 파트너십도 이 자리에서 발표됐다. 주정부 간 경쟁도 치열하다: 우타르프라데시는 지역어 촬영 영화에 제작비 최대 50%를 지원하며 노이다에 대형 필름시티를 조성 중이고, 마하라슈트라는 AVGC-XR에 '산업·인프라' 지위를 부여해 327억 루피(약 5,120억원) 예산을 승인, 마디야프라데시는 IP 등록비의 50%까지 보조한다. 다만 산업계(CII)는 2025년 12월 백서에서 생산연계인센티브(PLI) 10~20% 신설과 500억 루피(약 750억원) 규모 수출지원기금 조성을 정부에 요구하는 등 아직 지원이 충분치 않다는 목소리도 크다.","keypoints":["2025년 인도 콘텐츠산업 284억달러(GDP 0.8%), 2028년 348억달러 전망(연평균 6%) — 디지털미디어 44%성장이 견인","게임분야는 2025.8 RMG(실시간 현금게임) 금지법으로 17% 감소, 성장세 속 정책리스크 공존","AVGC-XR 국가전략: 뭄바이 국가우수센터(IICT)에 예산 580억원, Google·Meta 등과 산학협력·AI인재 1.5만명 양성","한국은 2015년 인도와 영상물 공동제작협정 체결(11번째) — 현지 지출 최대 40%(45억원 한도) 환급","2025 WAVES 서밋 1.5조원 거래·투자 유치, 상설 B2B 플랫폼 WAVES Bazaar에서 2,100억원 계약 체결(Amazon·CJ ENM 포함)","주정부별 인센티브 경쟁: 우타르프라데시(제작비 최대50%)·마하라슈트라(5,120억원 예산)·마디야프라데시(IP등록비 50%)","산업계(CII)는 PLI 10~20%·수출지원기금 750억원 신설을 정부에 추가 요구 중 — 지원은 확대일로이나 미충족 수요 여전"],"why":"국가·지방정부가 세제·현금·인프라 인센티브를 입체적으로 설계해 해외 제작사를 유치하는 인도 사례는, GCA가 경기도 콘텐츠기업의 해외 공동제작·투자유치 지원사업을 설계하거나 지자체 단위 인센티브 체계를 벤치마킹할 때 참고할 수 있다. 특히 한-인도 공동제작협정이 이미 발효 중이라는 점은 도내 기업의 인도 진출 지원 프로그램 기획에 바로 활용 가능하다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158950/2012385.do?menuNo=204160","file":"2026-08-19/[KOCCA_인도-11호] 인도 콘텐츠산업 지원정책 및 현황.pdf","_recent":false},{"id":"2026-08-19-kocca-content-industry-survey-2024","week":"2026-08-19","title":"2024년 기준 콘텐츠산업조사","issuer":"문화체육관광부·한국콘텐츠진흥원","type":"산업통계","published":"2026-07-03","pages":345,"size":"19.4MB","genres":["정책·산업"],"tags":["콘텐츠산업조사","국가승인통계","경기도","만화웹툰","지역편중","수출입","사업체수","부가가치"],"lede":"만화산업에서 경기도가 서울을 제치고 전국 1위로 — 콘텐츠산업 지도가 바뀌었다","speakers":[],"summary":"18,678개 사업체를 대상으로 2025년 10~11월 실사한, 콘텐츠산업 분야 유일의 국가승인통계다. 2024년 기준 국내 콘텐츠산업은 사업체 수 12만875개(전년비 +2.4%), 종사자 68만8,121명(+3.4%), 매출액 157조4,021억원(+2.1%)을 기록했고, 부가가치액은 56조9,577억원(부가가치율 36.2%)이었다. 수출은 전년비 5.5% 늘어난 140억7,543만 달러, 수입은 9억1,556만 달러로 131억5,987만 달러의 흑자를 냈으며 11개 세부산업 전부에서 수출이 수입을 웃돌았다 — 그중 게임산업 수출액(85억347만 달러)이 전체 수출의 60.4%를 차지해 절대적 비중을 이뤘다. 매출액 기준으로는 방송및영상(24조9,943억원, 15.9%)·지식정보(24조6,991억원)·출판(24조2,238억원)·게임(23조8,515억원)이 4강 구도를 형성했다. 이번 조사에서 GCA(경기콘텐츠진흥원)가 특히 주목할 대목은 지역별 통계다. 만화(웹툰)산업 매출을 지역별로 뜯어보면, 경기도가 2024년 전년 대비 177.9% 폭증한 1조5,554억원(비중 45.4%)을 기록하며 처음으로 서울(1조4,807억원, 43.2%, 오히려 전년비 △15.2% 감소)을 추월해 전국 최대 웹툰산업 거점으로 부상했다. 보고서는 이를 '대형 플랫폼 운영기반과 제작 인프라가 경기도로 집중된 영향'으로 해석했다. 다만 서울·경기 두 지역의 합산 비중이 전체 만화산업 매출의 88.6%(2023년 84.1%)에 달해, 웹툰산업의 수도권 집중이 오히려 더 심화됐다는 이면도 함께 나타났다. 조사는 콘텐츠산업 특수분류(출판·만화·음악·게임·영화·애니메이션·방송및영상·광고·캐릭터·지식정보·콘텐츠솔루션 11개)를 기준으로 사업체 수·매출액·제작비·부가가치·수출입·종사자 등을 산업별·지역별·조직형태별로 전수 추정한 결과를 담고 있어, 시·군 단위까지 내려가는 세부 표가 함께 제공된다.","keypoints":["2024년 콘텐츠산업 매출 157조4,021억원(+2.1%), 사업체 12만875개(+2.4%), 종사자 68만8,121명(+3.4%)","수출 140억7,543만달러(+5.5%)·무역흑자 131억5,987만달러, 11개 세부산업 전부 수출>수입 — 게임이 전체 수출의 60.4% 차지","매출 4강: 방송및영상(15.9%)·지식정보(15.7%)·출판(15.4%)·게임(15.2%)이 근소한 차이로 상위권 형성","★ 만화(웹툰)산업 매출, 경기도가 전년비 177.9% 급증한 1조5,554억원(45.4%)으로 서울(43.2%, △15.2%)을 처음 추월","다만 서울+경기 합산 비중이 만화산업 매출의 88.6%(2023년 84.1%)로 수도권 집중은 오히려 더 심화","국가승인통계(국가통계포털·문화셈터 게재)로, 정책 근거자료·경영계획·국제비교 등 공식 인용에 활용 가능"],"why":"경기도가 전국 웹툰산업 매출 1위로 올라섰다는 수치는 GCA 성과 홍보·의정보고·사업 타당성 논거로 즉시 활용 가능한 핵심 근거다. 다만 서울·경기 합산 집중도가 더 심화됐다는 이면은 비수도권 균형발전 관점의 지원사업 설계 논리로도 함께 쓸 수 있다. 국가승인통계라 예산·투자유치 자료에 인용해도 신뢰도 문제가 없다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158948/2011597.do?menuNo=204156","file":"2026-08-19/2024년 기준 콘텐츠산업조사_일반배포용_260703.pdf","_recent":false},{"id":"2026-08-05-kocca-spain-audiovisual","week":"2026-08-12","title":"한-스페인 시청각 콘텐츠 협력 전략: 공동제작, 제도·규제 체계 분석 및 KOCCA 협력 로드맵 연구 (스페인 26-03호)","issuer":"한국콘텐츠진흥원 스페인비즈니스센터","type":"해외 산업동향","published":"2026-08-05","pages":44,"size":"0.9MB","genres":["글로벌·수출","정책·산업","영상·방송"],"tags":["스페인","공동제작","EU문화협력의정서","SpainAudiovisualHub","웹툰트랜스미디어","FAST·CTV","IP권리확보"],"lede":"KOCCA 스페인 거점이 자체 협력 로드맵을 낸 드문 사례 — 양자 공동제작을 유럽 다자구조로","speakers":[{"name":"이사벨 세라노 마요","role":"마드리드 콤플루텐세 대학 교수","topic":"집필"},{"name":"알베르토 루이스 가르시아 가르시아","role":"마드리드 콤플루텐세 대학 교수","topic":"집필"},{"name":"변미영","role":"KOCCA 스페인비즈니스센터장","topic":"감수"}],"summary":"KOCCA 스페인비즈니스센터가 2025년 스페인 거점 개소를 계기로 마드리드 콤플루텐세 대학 교수 2인(이사벨 세라노 마요, 알베르토 루이스 가르시아 가르시아)에게 의뢰한 전략 컨설팅 보고서다. 통상의 시장동향 리포트와 달리 'KOCCA 협력 로드맵'을 스스로 제시한다는 점이 특이하다 — 문헌 72건(한국 40건·유럽·스페인 32건)을 비교분석해 양측 연구 관심사의 차이부터 짚는다. 한국 문헌은 경제·수출(25%)에, 유럽·스페인 문헌은 거버넌스·규제·통계(합계 43.8%)에 쏠려 있어, 협력전략이 서로 다른 정책 언어를 조율하는 데서 출발해야 함을 보여준다.\n\n산업 비교에서는 스페인이 2025년 423편(자국 통계 기준 376편, 국제공동제작 87편 포함)의 장편영화를 제작해 이탈리아·영국·프랑스를 제치고 유럽 최대 제작국(세계 6위)에 올랐다는 점, 100Mbps 이상 인터넷 보급률 94%·5G 96%로 원격제작 인프라가 우수하다는 점을 짚는다. 반면 한국은 웹툰 원천IP의 트랜스미디어 확장(2022년 웹툰 매출 1.8조원, 이 중
