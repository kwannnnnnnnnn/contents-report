  --paper:#0E1312; --surface:#151B19; --sunken:#1B2321; --zebra:#121917;
  --ink:#E3E9E5; --ink-2:#AEB9B4; --ink-3:#7E8A85; --rule:#2A3431; --rule-2:#212927;
  --accent:#59BE9F; --on-accent:#0E1312;
  --t-forum:#D2A65A; --t-issue:#7FAEDC; --t-report:#C88FAE; --t-global:#E0A184;
}
:root[data-theme="light"]{
  --paper:#F4F6F3; --surface:#FFFFFF; --sunken:#EBEEE9; --zebra:#FAFBF9;
  --ink:#151A18; --ink-2:#3D4744; --ink-3:#6B7671; --rule:#D6DCD6; --rule-2:#E6EAE5;
  --accent:#1C6B57; --on-accent:#F4F6F3;
  --t-forum:#8A6520; --t-issue:#2B5C93; --t-report:#7A3A5E; --t-global:#9A5330;
}

*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:ReportSans,'Noto Sans KR',Pretendard,'Malgun Gothic',
    'Apple SD Gothic Neo',system-ui,sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
  word-break:keep-all}
.serif{font-family:ReportSerif,'Noto Serif KR','Nanum Myeongjo',Batang,serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,ReportSans,'Noto Sans KR',monospace;
  font-variant-numeric:tabular-nums; font-size:.84em; letter-spacing:.01em}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.pad{padding:0 clamp(16px,2.2vw,34px)}

/* ---------- masthead ---------- */
.rule-accent{height:2px; background:var(--accent)}
.mast{background:var(--surface); border-bottom:1px solid var(--rule)}
.mast-in{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 22px; padding-top:22px; padding-bottom:17px}
.mast h1{font-size:28px; margin:0; font-weight:600; letter-spacing:-.01em}
.mast .sub{color:var(--ink-3); font-size:12.5px; line-height:1.55; margin:0}
.mast .sub b{color:var(--ink-2); font-weight:600}

/* ---------- controls ---------- */
.controls{position:sticky; top:0; z-index:30; background:var(--paper); border-bottom:1px solid var(--rule)}
.controls-in{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding-top:10px; padding-bottom:10px}
.search{flex:0 1 320px; display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--rule); padding:6px 11px}
.search input{flex:1; border:0; background:none; color:var(--ink); font:inherit; font-size:14px; min-width:0}
.search input::placeholder{color:var(--ink-3)}
.search svg{flex:none; stroke:var(--ink-3)}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{font-size:12px; padding:3px 10px; border:1px solid var(--rule); background:var(--surface);
  color:var(--ink-2); cursor:pointer; line-height:1.5; font-family:inherit;
  transition:background .12s,border-color .12s,color .12s}
.chip:hover{border-color:var(--accent); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.spacer{flex:1 1 auto}
.count{color:var(--ink-3); font-size:12px; white-space:nowrap}
.linkbtn{background:none; border:0; font:inherit; font-size:12px; color:var(--accent);
  cursor:pointer; padding:3px 2px; text-decoration:underline; text-underline-offset:3px}

/* ---------- table ---------- */
main{padding-top:26px; padding-bottom:70px}
table{width:100%; border-collapse:collapse; table-layout:fixed}
caption{text-align:left; padding:22px 0 7px; border-bottom:2px solid var(--ink)}
caption .ct{font-size:18px; font-weight:600; letter-spacing:-.01em}
caption .cn{color:var(--ink-3); font-size:12px; margin-left:12px}
thead th{position:sticky; top:60px; z-index:10; background:var(--paper);
  text-align:left; font-size:11px; font-weight:600; letter-spacing:.1em; color:var(--ink-3);
  padding:9px 12px 8px; border-bottom:1px solid var(--rule); white-space:nowrap}
thead th:first-child{padding-left:0}
thead th:last-child{padding-right:0}
col.c-date{width:96px} col.c-kind{width:112px} col.c-issuer{width:190px}
col.c-spk{width:184px} col.c-pub{width:96px} col.c-link{width:118px} col.c-x{width:40px}

tbody tr.row{border-bottom:1px solid var(--rule-2); cursor:pointer}
tbody tr.row:nth-child(4n+1){background:var(--zebra)}
tbody tr.row:hover{background:var(--sunken)}
tbody tr.row.open{background:var(--sunken)}
tbody td{padding:12px; vertical-align:top}
tbody td:first-child{padding-left:0}
tbody td:last-child{padding-right:0}
.c-date .mono{color:var(--ink-2)}
.kind{display:inline-block; font-size:10.5px; letter-spacing:.06em; font-weight:700;
  padding:2px 7px; border:1px solid currentColor; color:var(--t-issue); white-space:nowrap}
.kind[data-t="포럼 발표자료"]{color:var(--t-forum)}
.kind[data-t="연구보고서"]{color:var(--t-report)}
.kind[data-t="해외 산업동향"]{color:var(--t-global)}
.ttl{font-size:16.5px; font-weight:600; line-height:1.45; letter-spacing:-.012em; margin-bottom:3px}
.lede{color:var(--ink-3); font-size:13px; line-height:1.55}
.issuer,.spk{color:var(--ink-2); font-size:13px; line-height:1.5}
.spk em{font-style:normal; color:var(--ink-3)}
.open-link{display:inline-block; font-size:12.5px; padding:4px 10px; border:1px solid var(--rule);
  color:var(--ink-2); text-decoration:none; white-space:nowrap; transition:background .12s,color .12s}
.open-link:hover{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.x{width:26px; height:26px; border:1px solid var(--rule); background:var(--surface); color:var(--ink-2);
  cursor:pointer; font:inherit; font-size:14px; line-height:1; display:grid; place-items:center}
tr.row.open .x{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}

/* ---------- detail row ---------- */
tr.det{display:none} tr.det.on{display:table-row}
tr.det>td{padding:0 0 30px; border-bottom:1px solid var(--rule)}
.detin{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0 44px;
  align-items:start; background:var(--sunken); padding:22px 26px; border-left:2px solid var(--accent)}
.dh{font-size:10.5px; letter-spacing:.11em; font-weight:700; color:var(--accent);
  text-transform:uppercase; margin:0 0 7px}
/* 한글은 글자 폭이 넓어 em 기준으로 읽기 좋은 줄길이를 잡는다(≈45자) */
.dsum{color:var(--ink-2); font-size:14.5px; line-height:1.78; max-width:46em}
.dsum p{margin:0 0 13px} .dsum p:last-child{margin-bottom:0}
/* 【세션】 머리표가 붙은 문단은 눈에 띄게 */
.dsum p:not(:first-child){padding-top:11px; border-top:1px solid var(--rule)}
.kp{margin:0; padding:0; list-style:none; max-width:46em}
.kp li{display:flex; gap:10px; padding:6px 0; font-size:13.5px; line-height:1.6;
  border-bottom:1px solid var(--rule)}
.kp li::before{content:""; flex:none; width:5px; height:5px; margin-top:8px;
  background:var(--accent); transform:rotate(45deg)}
.why{font-size:13.5px; line-height:1.68; color:var(--ink-2); margin:0; max-width:46em}
.dfull{grid-column:1/-1; margin-top:22px; padding-top:18px; border-top:1px solid var(--rule)}
.spk-list{margin:0; padding:0; list-style:none;
  display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:0 30px}
.spk-list li{display:grid; grid-template-columns:132px 1fr; gap:3px 14px; padding:6px 0;
  border-bottom:1px solid var(--rule); font-size:13px; line-height:1.5}
.spk-name{font-weight:600}
.spk-name span{display:block; font-weight:400; color:var(--ink-3); font-size:12px}
.spk-topic{color:var(--ink-2)}
.filerow{grid-column:1/-1; margin-top:20px; padding-top:16px; border-top:1px solid var(--rule);
  display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px}
.copy{font-size:12.5px; padding:4px 11px; border:1px solid var(--rule); background:var(--surface);
  color:var(--ink-2); cursor:pointer; font-family:inherit}
.copy:hover{border-color:var(--ink-3); color:var(--ink)}
.path{color:var(--ink-3); word-break:break-all}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-left:auto}
.tag{font-size:11px; color:var(--ink-3); background:var(--surface); padding:2px 8px}

@media (max-width:1180px){ .detin{grid-template-columns:1fr; gap:22px 0} .kp{margin-bottom:0} }

.empty{color:var(--ink-3); font-size:13.5px; padding:16px 0 4px; max-width:66ch; line-height:1.7}
.foot{border-top:1px solid var(--rule); padding-top:22px; padding-bottom:56px;
  color:var(--ink-3); font-size:12px; line-height:1.8}
.foot code{background:var(--sunken); padding:1px 6px}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink);
  color:var(--paper); padding:9px 18px; font-size:13px; opacity:0; pointer-events:none;
  transition:opacity .18s; z-index:60}
.toast.on{opacity:1}
</style>

</head>

<script id="payload" type="application/json">{"updated":"2026-08-06","cutoff":"2026-07-09","reports":[{"id":"2026-08-03-kocca-france-ono","week":"2026-08-06","title":"프랑스 최대 로컬 웹툰 플랫폼 ONO의 비즈니스 모델, K-웹툰의 미래 (프랑스 26-05호)","issuer":"한국콘텐츠진흥원 프랑스비즈니스센터","type":"해외 산업동향","published":"2026-08-03","pages":23,"size":"1.3MB","genres":["웹툰·만화","글로벌·수출","정책·산업"],"tags":["ONO","프랑스웹툰","메디아파티시파시옹","현지공동창작","번역지원","불법유통","웹툰아카데미"],"lede":"현지 플랫폼 실무자가 직접 쓴 K-웹툰 진단 — \"일방향 공장식 수출로는 부족하다\"","speakers":[{"name":"이송현","role":"ONO Chief of Staff","topic":"집필"},{"name":"김문주","role":"KOCCA 프랑스비즈니스센터장","topic":"감수"},{"name":"이재현","role":"KOCCA 프랑스비즈니스센터 매니저","topic":"감수"}],"summary":"KOCCA 해외산업동향 시리즈지만 통상적인 시장 통계 보고서와 성격이 다르다. 집필자가 프랑스 웹툰 플랫폼 ONO의 Chief of Staff, 즉 K-웹툰을 수입해 파는 현지 사업자 본인이라 '해외 플랫폼 입장에서 본 K-웹툰'이라는 드문 시각이 담겼다.\n\nONO의 모회사 메디아-파티시파시옹은 1986년 설립된 프랑스-벨기에 미디어·출판 그룹으로 연매출 약 1조 3천억 원, 유럽 만화·망가·그래픽노블 부문 1위다. Dargaud·Dupuis·Le Lombard·Kana 등 40여 개 출판 라벨을 거느리고 「스머프」 「럭키 루크」 「나루토」 「데스노트」를 유통하며, 그룹 매출의 30% 이상이 만화에서 나온다. 여기에 애니메이션 제작사(Ellipse·Belvision), 게임 퍼블리셔 Microids, 보드게임 Iello, 라이선스 상품 Plastoy, 스트리밍 ADN·ONO, 테마파크 Parc Spirou까지 붙여 IP 360° 전략을 구성한다. ONO는 코로나 전후 한국 웹툰 플랫폼이 프랑스에서 빠르게 성장하는 것을 보고 만든 로컬 웹툰 플랫폼이다.\n\n보고서의 핵심은 마지막 시사점 장이다. 첫째, 현재 프랑스에 유통되는 한국 웹툰이 로맨스 판타지·이세계물 등 특정 장르와 반복 서사에 몰려 있다고 지적한다. 초기 진입에는 유효했지만 독자 피로도가 쌓이고 있으며, 이탈한 독자는 다른 웹툰 플랫폼이 아니라 쇼츠·릴스 같은 숏폼 영상으로 빠져나가 재유입이 구조적으로 어렵다는 것이다. 일상물·사회 비평·문학적 서사로 장르 스펙트럼을 넓혀야 한다고 본다. 둘째, 프랑스 독자에게 웹툰은 BD·망가와 달리 여전히 낯선 포맷이고 일부 취향층의 틈새 시장에 머물러 있다. 세분화 마케팅은 포맷 인지도가 확보된 다음 단계의 이야기이고, 지금 필요한 건 현지 작가와의 공동 창작이라는 진단이다. ONO는 웹툰 아카데미로 현지 창작 인력을 기르고 한불 공동 IP를 개발하는 것으로 이를 실행하고 있다.\n\n정책 제언도 구체적이다. 번역 지원을 일방향이 아니라 쌍방향(한국 작품의 해외 번역 + 현지 작품의 번역)으로 설계한 모델을 참고점으로 제시하고, 비용 보조에 그치지 말고 현지화 품질 관리 체계·전문 번역 인력 양성·현지 편집자 연계까지 구조를 강화해야 한다고 본다. 또 한국 콘텐츠를 일정 규모 이상 유통하는 현지 플랫폼·출판사에 공동 마케팅, 프로모션 비용 분담, 합작 프로젝트 보조금을 연계해 '계속 선택할 유인'을 만들자고 제안한다. 불법 유통 문제도 짚는데, 프랑스 내 망가·웹툰 불법 복제 트래픽이 이미 합법 플랫폼을 추월한 수준이며 한쪽이 단독으로 감당할 수 없으니 모니터링·신고·법적 대응의 비용과 정보를 양측이 나누는 체계가 필요하다고 본다.\n\n마지막으로 '현지 작가를 키우면 웹툰의 정체성이 희석되지 않느냐'는 우려에 대해, 망가에서 영감을 받은 서구 작가가 많아도 망가가 여전히 일본 고유의 시각 언어로 정의되는 것처럼 웹툰의 한국적 기원은 대체되지 않으며, 포맷 확산은 오히려 종주국의 문화적 영향력을 넓힌다고 반박한다.","keypoints":["집필자가 현지 플랫폼(ONO) 임원 — 수입하는 쪽에서 본 K-웹툰 진단이라 시각이 다르다","프랑스 유통 한국 웹툰이 로맨스판타지·이세계물에 편중 → 독자 피로 누적","이탈 독자는 다른 웹툰이 아니라 숏폼 영상으로 빠져나가 재유입이 구조적으로 어렵다","웹툰은 프랑스에서 아직 낯선 포맷 — 세분화 마케팅보다 현지 작가 공동창작이 먼저","번역 지원을 쌍방향 구조로 설계한 모델을 한국 지원체계의 참고점으로 제시","프랑스 내 망가·웹툰 불법복제 트래픽이 합법 플랫폼을 이미 추월 — 공동 대응 필요","모회사 메디아-파티시파시옹: 연매출 1.3조, 유럽 만화 1위, 출판→애니→게임→테마파크 IP 360°"],"why":"웹툰은 경기도 주력 장르이고 GCA도 관련 지원사업을 운영한다. '번역 비용 보조'에서 '현지화 품질관리·현지 편집자 연계'로 지원 범위를 넓히라는 제언, 그리고 현지 기업에 공동 마케팅·보조금을 붙여 지속 선택 유인을 만들라는 설계는 해외진출 지원사업 개편안에 바로 인용할 수 있다. 213호(수출 전환/지속 이원화)와 함께 읽으면 '지속' 단계 지원 논리가 구체화된다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158950/2012303.do?menuNo=204160","file":"2026-08-06/[프랑스 26-05호] 프랑스 최대 로컬 웹툰 플랫폼 ONO의 비즈니스 모델, K-웹툰의 미래.pdf","_recent":true},{"id":"2026-08-04-kocca-thai-blgl","week":"2026-08-06","title":"태국 BL/GL 콘텐츠 산업의 팬덤 경제와 글로벌 확장 전략 (태국 26-04호)","issuer":"한국콘텐츠진흥원 태국비즈니스센터","type":"해외 산업동향","published":"2026-08-04","pages":29,"size":"1.2MB","genres":["영상·방송","글로벌·수출","음악·공연"],"tags":["Y시리즈","BL","GL","팬덤경제","페어매니지먼트","공동제작","권리구조","팬투어리즘"],"lede":"3년 만에 매출 2.9배·아시아 BL 53%/GL 63% 점유 — 틈새 장르가 수출 산업이 된 구조 해부","speakers":[{"name":"이하얀","role":"한국외국어대학교 · 한국태국학회","topic":"집필"},{"name":"김철민","role":"KOCCA 태국비즈니스센터장","topic":"감수"}],"summary":"태국 Y-시리즈(BL·GL 통칭)가 대학 청춘물 틈새 장르에서 수출형 산업으로 올라선 과정을, 제작 시스템·팬덤 수익화·글로벌 유통·권리 구조까지 나눠 분석한 29쪽 보고서. 영상물에 한정하지 않고 원작 소설·출판, 배우 매니지먼트, 팬 커뮤니티, 공연·상품, 브랜드, 관광까지 산업 구조 전체를 다룬다.\n\n규모부터 확실하다. 제작사 매출이 2021년 약 14억 바트에서 2024년 약 42억 바트로 3년간 2.9배(연평균 42.4%) 늘었고, 시암상업은행 연구소는 태국 엔터 산업 내 Y-시리즈 비중이 2019년 0.7%에서 2025년 3.9%로 확대되며 시장 규모를 약 49억 바트로 추산했다. 2024년 기준 아시아 BL 시리즈의 53%, GL의 63%를 태국이 공급한다. 성장 궤적은 2014~16년 형성기(『Love Sick』 『SOTUS』, 배우 '페어' 문화 정착) → 2020년 『2gether』의 유튜브 확산으로 국제화 → 2020~22년 지역 정체성·사회문제·범죄액션 결합으로 외연 확대(『KinnPorsche』) → 2022~24년 GL의 독자 성장(『GAP』 『23.5』)으로 정리된다.\n\n수익화의 축은 팬덤이다. 배우 두 명을 작품 이후에도 공동 활동으로 장기 운영하는 '페어 매니지먼트'가 핵심이고, 팬미팅·콘서트·브랜드 협업·팬 관광이 뒤따른다. Vogue Business가 Launchmetrics로 측정한 수치로 Lingling Kwong의 Dior 활동 4,720만 달러, Rebecca Armstrong의 Chanel 활동 8,470만 달러 MIV를 소개하되, 이는 실제 매출이 아니라 미디어 노출 추정가치이므로 검색량·방문·쿠폰·예약과 함께 봐야 한다고 분명히 선을 긋는다. 팬 유통에 대한 관점도 실무적이다. 팬 번역·클립 편집이 초기 해외 진입 비용을 낮췄지만 저작권 침해와 오역도 함께 낳았으므로, 팬 활동을 전부 막기보다 공식 클립·자막 자료·2차 창작 지침으로 합법적 참여의 경계를 명시하고 방영 직후 공식 소재를 빠르게 뿌려 불법 재업로드 수요를 줄이라고 권한다. 플랫폼별 역할도 나눈다 — X는 방영 중 실시간 화제성, 틱톡은 신규 유입, 유튜브는 장기 아카이브, LINE·팬 커뮤니티는 공지와 티켓·상품 전달.\n\n권리 구조 장이 특히 실무적이다. 캐릭터와 배우 초상은 계약상 서로 다른 자산이라 제작사와 매니지먼트가 다르면 캐릭터 상품화권이 있어도 배우 이미지 사용권이 없을 수 있고, 영상화권 하나로 후속 사업 전체를 처리하면 안 되며 배급·기간·지역·속편·번역출판·웹툰·OST·공연·상품·게임·초상권을 나누고 미사용 권리의 회수 조건을 두라고 한다.\n\n한국 기업에 주는 결론은 '태국을 완성작 판매 시장이 아니라 협력 거점으로 보라'는 것. 한국이 원천 IP·기획·투자·후반제작·글로벌 판매를, 태국이 현지 각색·캐스팅·촬영·방송·배우와 팬덤 운영을 맡는 분업을 제시하며, 한국 웹툰·웹소설의 학원물·범죄·스릴러·판타지가 태국 BL/GL이 넓히는 장르와 접점이 크다고 본다. 현지화는 번역이 아니라 기획 단계에서 시작해야 하고, 파트너 실사는 흥행작 수가 아니라 권리·계약·회계·운영 능력을 확인하는 과정이어야 하며, 3~6개월짜리 짧은 파일럿(웹툰 티저·숏폼·리딩 영상)으로 반응을 본 뒤 장편과 공연·상품으로 넓히라고 권한다. 현지 창작자·배우 기여를 일회성 용역으로 처리하면 후속 시즌에서 관계가 끊긴다는 경고도 붙는다.","keypoints":["Y-시리즈 제작사 매출 2021년 14억 → 2024년 42억 바트(연 42.4% 성장), 아시아 BL 53%·GL 63% 점유","핵심 장치는 '페어 매니지먼트' — 배우 2인을 작품 종료 후에도 공동 활동으로 장기 운영","MIV·EMV는 미디어 노출 추정치일 뿐 — 검색·방문·쿠폰·예약과 함께 봐야 예산 근거가 된다","팬 2차창작을 전면 금지하지 말고 허용 범위를 예시로 명시 + 공식 소재를 빠르게 배포","캐릭터 상품화권과 배우 초상권은 별개 계약 — 상품·광고·공연에서 양쪽을 따로 확인해야","영상화권 하나로 후속사업을 묶지 말고 권리를 쪼개 미사용분 회수 조건을 둘 것","한국은 원천IP·기획·후반·글로벌판매 / 태국은 각색·캐스팅·촬영·팬덤운영 분업이 현실적","현지화는 번역이 아니라 기획 단계부터 — 3~6개월 파일럿으로 검증 후 확장"],"why":"장르 자체보다 '팬덤을 산업 구조로 만드는 법'이 참고 대상이다. 페어 매니지먼트·팬 이벤트·브랜드·관광을 하나의 일정과 권리표로 묶는 방식은 K-팝 외 장르에도 적용 가능하고, 권리 세분화(캐릭터권과 초상권 분리, 미사용 권리 회수 조건)는 213호가 지적한 'IP 패키징을 작품이 아니라 권리구조 관점으로'와 정확히 맞물린다. 공동제작 분업 모델은 해외 공동제작 지원사업 설계 시 역할 정의의 참고가 된다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158950/2012321.do?menuNo=204160","file":"2026-08-06/2026년 태국콘텐츠산업동향 4호.pdf","_recent":true},{"id":"2026-07-23-kocca-forum","week":"2026-08-05","title":"2026 콘텐츠산업포럼 결과자료집","issuer":"문화체육관광부 · 한국콘텐츠진흥원","type":"포럼 발표자료","published":"2026-07-23","pages":57,"size":"5.9MB","genres":["정책·산업","AI·기술","게임","투자·금융","IP·공간"],"tags":["콘텐츠산업포럼","AX","UGC","인디게임","아레나","피지컬AI","K-콘텐츠"],"lede":"글로벌·IP·금융·AX 4개 세션 17개 발제 — 인디게임, K-뮤직, 전통IP, 공간비즈니스, 투자혹한기, AX까지","speakers":[{"name":"이상봉","role":"한국패션디자이너연합회 회장","topic":"패션 크리에이티브 산업과 'K' — 초청강연 (자료집에 표지만 수록)"},{"name":"송화준","role":"(재)아모레퍼시픽재단 사무국장","topic":"우리만의 아름다움으로 글로벌 문화를 만드는 K-뷰티 — 초청강연 (자료집에 표지만 수록)"},{"name":"신혜련","role":"명지대학교 디지털콘텐츠디자인학과 교수","topic":"글로벌 유저 패러다임 변화와 플랫폼 다각화를 통한 글로벌 도약"},{"name":"이유겸","role":"마운드미디어㈜ 유통부문대표","topic":"K-Music 스케일업: 로컬 디스트리뷰터 관점의 글로벌 진출"},{"name":"김남경","role":"메종 단하 대표","topic":"한국 전통 IP의 다각화: 글로벌 패션마켓의 신성장 동력"},{"name":"정현섭","role":"KRAFTON PUBG IP Franchise DIV. 팀장","topic":"PUBG SEONGSU — 게임 IP가 도시를 바꾼다"},{"name":"김인하","role":"CJ ENM PD","topic":"포맷을 만드는 공간, 공간을 만드는 포맷"},{"name":"이현명","role":"인스파이어 엔터테인먼트 리조트 이사","topic":"음악공연 그 이상, IP 체험과 공간 비즈니스"},{"name":"김창록","role":"㈜신세계 패션플랫폼팀 팀장","topic":"입는 IP에서 머무는 IP로 성장하는 패션"},{"name":"최연진","role":"The VC 애널리스트","topic":"콘텐츠 투자 트렌드 분석과 전망"},{"name":"박형태","role":"와프인베스트먼트 상무","topic":"K-콘텐츠 글로벌 도약 엔진: 정책 금융의 역할과 필요성"},{"name":"신동원","role":"DSC인베스트먼트 상무","topic":"플레이브·QWER 사례로 본 음악·엔터 투자 방정식 (자료집에 표지만 수록)"},{"name":"최연우","role":"디즈니+ 로컬 콘텐츠 총괄","topic":"K-콘텐츠, 성공을 넘어 확장으로 (자료집에 표지만 수록)"},{"name":"류정혜","role":"AI 미래포럼 공동의장","topic":"AI를 통한 콘텐츠 미래전략"},{"name":"장한용","role":"NC AI 실장","topic":"AI NPC 진화와 디지털 트윈: 엔터테인먼트를 넘어 산업 혁신으로"},{"name":"김유열","role":"EBS 사장","topic":"AI를 통한 방송의 가치혁신"},{"name":"김근재","role":"바이스벌사 대표","topic":"AI 시대의 패션, 옷이 아니라 콘텐츠를 파는 시대"}],"summary":"문체부·콘진원이 '세계를 감동시키고 경제를 움직이는 K-콘텐츠'를 주제로 3일간 연 포럼의 발표 녹취 자료집. 초청강연 2건과 글로벌·IP·금융·AX 4개 세션 15개 발제로 구성된다. 다만 17건 중 13건만 발표 전문이 실렸고, 초청강연 2건(이상봉·송화준)과 금융 세션 2건(DSC인베스트먼트 신동원, 디즈니+ 최연우)은 표지만 있으니 유의할 것.\n\n【글로벌 세션】 명지대 신혜련 교수는 인디·소규모 개발사의 부상을 데이터로 짚는다. Unity 프로젝트 개발기간 중앙값이 2022년 대비 2025년 약 77% 감소했고, 1~9인 팀의 65% 이상이 멀티플랫폼을 개발하며, 30달러 미만 PC 신작 매출은 2022년 대비 156% 늘었다. 로드컴플릿 〈레전드 오브 슬라임〉(누적 2,000억 원, 매출 98%가 해외)은 여러 MVP를 동시 출시해 지표가 좋은 것만 골라 키운 사례로 제시된다. 제언은 두 갈래 — 크로스플랫폼형 UGC 플랫폼 생태계를 국가가 인큐베이팅할 것, 그리고 지원사업을 제작비 보조에서 '노하우 중심 고도화'(프로젝트 아키텍처 설계, 글로벌 테스트, 라이브운영 전수)로 옮길 것. AI가 코드·아트를 뽑아줘도 프로젝트 전체의 컨텍스트를 유지하는 건 여전히 시니어의 설계 역량이라는 이유에서다. 마운드미디어 이유겸 대표는 K-POP이 아닌 'K-뮤직'(인디·비주류 장르)의 확산을 다룬다. 웨이브 투 어스는 월간 리스너가 2022년 40만 명에서 1,500만 명 이상으로 늘고 'seasons' 누적 5억 스트리밍, 북미 29개 도시 투어 전석 매진에 이르렀는데, 대규모 자본이나 미디어 노출 없이 틱톡 오가닉 바이럴이 스포티파이 알고리즘과 맞물린 결과였다. 유통사의 역할은 메타데이터 정비·태그 최적화로 '발견될 준비'를 갖춰주는 것이라고 정리한다. 메종 단하 김남경 대표는 2020년 블랙핑크 'How You Like That' 뮤직비디오 의상 이후 달라진 전통 IP 시장을 이야기한다. 전통 문양을 애슬레저에 얹은 라인이 해외에서 사실상 전량 완판됐고 파리 프랭탕 백화점 진출로 이어졌다. 요지는 전통을 박물관에 박제하지 말고 'OSMU형 전통 IP'로 현대의 언어와 연결하라는 것.\n\n【IP 세션 — 콘텐츠의 공간화】 크래프톤 정현섭 팀장은 PUBG SEONGSU를 소개한다. 9개 공간 중 3개를 상설 운영하고, 배틀그라운드 세계관을 살린 72석 PC방('플레이 아레나')을 두었으며, 게임처럼 알파→오픈베타→얼리액세스→런칭 단계를 오프라인 개관에 그대로 적용했다. 6개월간 방문객 12만 명, 지역·문화 행사 13회를 치렀고 성수동 젠트리피케이션을 의식해 공간을 무상 제공하는 사회공헌도 병행한다. 내부적으로는 'IP를 어디까지 확장할 수 있는지 실험하는 공간'으로 규정한다. CJ ENM 김인하 PD는 〈환승연애 4〉의 공간 설계를 공개한다. 4층 집을 골라 'X끼리 몰래 만날 공간'을 확보하되 시청자 혼선을 막으려 방마다 색을 부여해 캐릭터를 인지시켰고, 메인 거실 외에 '미니 거실'을 만들어 솔직한 대화를 유도했다. 섭외는 DM 1만 건 → 대면 인터뷰 1,000명 이상. 러닝타임을 1시간 줄이는 빠른 호흡으로 바꿔 유료 가입 기여도를 이전 대비 2배 이상 끌어올렸다. 인스파이어 이현명 이사는 국내 최초 라이브 전문 아레나(1.5만 석) 운영 관점을 전한다. 인천공항 2터미널 10분 거리로 아시아 주요 도시에서 4시간 내 도달 가능한 입지를 무기로 삼고, 슬로건은 '티켓이 아니라 추억을 판다'. 현재 약 1.7조 원인 한국 라이브 시장이 10년 내 3조 원 이상으로 커질 것으로 보면서, 암표 근절 기술·제도, 공연 인력 양성, 그리고 무엇보다 대중교통 인프라가 민간만으로는 안 되는 영역이라고 짚는다. 신세계 김창록 팀장은 공간 IP 브랜드 '하이퍼 그라운드'를 소개한다. 센텀시티 지하 2층 2,700평에서 물판 공간을 줄이고 체험·휴식으로 채운 뒤, 도쿄 시부야 109에서 거리를 통제한 런웨이에 한국 신진 브랜드 7개를 세우고, 파리 프랭탕에서 K-뷰티 14개 브랜드 팝업을 두 달간 열었다. 매스 고객을 백화점 VIP로 끌어올리고 신진 브랜드를 하이엔드로 키우는 가교가 사업 모델이다.\n\n【금융 세션】 The VC 최연진 애널리스트는 투자 혹한기의 구조를 짚는다. 100억 원 이상 빅딜 비중이 급증한 반면 초기 라운드 건수 점유율은 2024년 80%에서 올해 70% 이하로 떨어져, 자금이 소수 대형 딜과 AI로 쏠리고 있다. 콘텐츠 분야에서 살아남은 논리는 두 가지 — 흥행 예측 불가라는 약점을 IP 비즈니스로 상쇄하는 전략(투자 축이 웹툰·웹소설 원천 IP와 제작 스튜디오에서 K-팝 IP 기반 엔터테크로 이동), 그리고 제작 효율을 높이는 버티컬 크리에이티브 AI 툴이다. 와프인베스트먼트 박형태 상무는 정책금융을 정면으로 비판적으로 다룬다. 문체부가 2030년까지 콘텐츠 정책금융 공급을 5조에서 10조 원으로 상향 발표했고 2026년 모태펀드 1차 출자도 약 7,300억 원(문화부 몫 6,500억 원)으로 역대 최대다. 민간 출자 비율 53.4%로 마중물 역할은 확인되지만, 문제는 양적 확대가 아니라 그 돈이 산업의 필요한 곳으로 흐르느냐다. 운용사 선정을 수익률이 아니라 '산업 기여도' 지표로 재설정하고 정성평가 비중을 만들 것, 스케일업 펀드와 별개로 초기·기획개발 단계 IP에 재원이 가는 구조를 둘 것을 제안한다.\n\n【AX 세션】 AI 미래포럼 류정혜 의장은 '변방 콤플렉스'를 지적하며 기획 단계부터 Born to be Global로 가야 한다고 말한다. AI 시대의 기회를 IP 가치 증폭, 새 비즈니스 모델·플랫폼 출현, 제작 혁신(효율 40%+), 초개인화 경험 넷으로 정리하고, 해외 메가 이벤트를 유치만 할 게 아니라 우리 손으로 메가 K-팝 페스티벌 브랜드를 만들자고 제안한다. NC AI 장한용 실장은 피지컬 AI 시대일수록 콘텐츠가 더 중요해진다는 역설을 제시한다. 드론·라이다로 도시 규모 디지털 트윈을 복원하고 프롬프트로 3D 오브젝트를 생성하는 기술을 소개한 뒤, 육체노동이 대체되면 여가시간이 폭증하고 로봇·자율주행·서비스 로봇에 감정 교류용 디지털 휴먼 기술이 그대로 이식되어야 한다는 논리다. EBS 김유열 사장의 발제가 가장 구체적이다. 지상파 광고 총액이 20년 전 2.4조 원에서 5,500억 원 수준으로 무너지고 드라마 편당 제작비는 5~6천만 원에서 20~30억 원으로 뛴 구조를 짚은 뒤, 《블루오션 전략》을 인용해 '비용혁신과 가치혁신 동시 달성'을 목표로 삼아 AI 도입으로 장기 적자를 벗고 2년 연속 흑자를 냈다고 밝힌다. AI 조직을 자회사로 외주화하지 말고 본사에 내재화하라, 전 부서가 직접 AI 콘텐츠를 만들어 마인드부터 리셋하라는 것이 실행 처방이다. 바이스벌사 김근재 대표는 패션 AX를 브랜드 DNA 학습 → AI 에이전트 → 멀티 에이전트 → 온톨로지 4단계로 정리한다. 프롬프트만으로 만든 결과물은 브랜드가 쓸 수 없더라는 현장 경험이 출발점이며, 자라가 6천여 매장 판매 데이터로 재고 낭비율을 연 50% 낮춘 사례를 들어 '지금 쌓는 데이터의 질과 구조가 1년 뒤 격차를 만든다'고 맺는다.","keypoints":["[게임] 개발기간 77% 단축·1~9인 팀의 65%가 멀티플랫폼 — 지원을 제작비 보조에서 '노하우 전수형'으로 전환하라는 제언","[음악] 웨이브 투 어스 월간 리스너 40만→1,500만 명. 자본·미디어 없이 틱톡 바이럴×스포티파이 알고리즘","[전통IP] 블랙핑크 한복 이후 전통은 보존 대상이 아니라 OSMU형 IP — 파리 프랭탕까지 진출","[공간] PUBG SEONGSU 6개월 12만 명. 게임처럼 알파→베타→런칭 단계를 오프라인 개관에 적용","[방송] 〈환승연애 4〉 방마다 색을 부여해 캐릭터 인지, 러닝타임 1시간 단축 → 유료가입 기여도 2배","[공연] 한국 라이브 시장 1.7조 → 10년 내 3조. 병목은 베뉴가 아니라 대중교통·인력·암표","[투자] 초기 라운드 건수 비중 80%(2024)→70% 이하. 자금은 빅딜과 AI로 쏠리고 콘텐츠는 IP·엔터테크로 이동","[정책금융] 2030년까지 10조 원으로 상향. 양적 확대보다 운용사 선정을 '산업 기여도' 지표로 재설계해야","[AX] EBS, AI로 비용·가치 혁신 동시 추구해 2년 연속 흑자. AI 조직은 외주화 말고 본사 내재화","[AX] 피지컬 AI 시대엔 여가시간 폭증·로봇 인터랙션 수요로 콘텐츠 시장이 오히려 커진다"],"why":"GCA 사업기획 관점에서 바로 쓸 재료가 많다. 신혜련 교수의 '제작비 보조에서 노하우 전수형으로'와 박형태 상무의 '운용사 선정을 산업 기여도 지표로'는 지원사업 개편 논의에 그대로 인용할 수 있는 제언이다. IP 세션 4건(PUBG SEONGSU·환승연애4·인스파이어·하이퍼그라운드)은 지역 거점·복합공간 제안서의 벤치마크가 되고, 특히 이현명 이사가 짚은 '병목은 베뉴가 아니라 대중교통·인력·암표'는 공연장 유치 논의에서 지자체 몫을 설명할 때 유용하다. 발제자 17인의 소속·주제가 그대로 정리돼 있어 향후 포럼·간담회 연사 풀로도 쓸 수 있다.","url":"https://www.kocca.kr/kocca/bbs/view/B0000180/2012236.do?menuNo=204164","file":"2026-08-05/2026 콘텐츠 산업포럼_결과자료집.pdf","_recent":true},{"id":"2026-07-09-kocca-focus-214","week":"2026-08-05","title":"한류산업 수출의 경제 효과 (KOCCA 포커스 통권 214호)","issuer":"한국콘텐츠진흥원 정책연구본부","type":"이슈리포트","published":"2026-07-09","pages":27,"size":"1.6MB","genres":["정책·산업","글로벌·수출"],"tags":["한류산업진흥기본법","생산유발효과","취업유발","중력모형","K-뷰티","관광"],"lede":"한류 수출 1억 달러가 생산 7,824억 원·고용 3,389명을 만든다 — 4차 추정 결과와 계수 반등의 이유","speakers":[{"name":"김윤지","role":"한국콘텐츠진흥원 원장","topic":"공동 저자"},{"name":"염정완","role":"한국콘텐츠진흥원 정책연구본부 미래정책팀","topic":"공동 저자"}],"summary":"2012년·2019년·2022년에 이은 네 번째 한류 수출 경제효과 추정 연구다. 2006~2024년 6개 지역(중화권·일본·동남아·북미·유럽·기타)의 한류산업 수출액과 연관산업 수출액으로 패널 데이터를 구성해 중력모형 기반 고정효과 회귀분석을 수행했다. 핵심 결과는 한류산업 수출 1억 달러 증가가 한류 연관산업 수출 2.02억 달러를 견인하고, 국내 생산유발액 총 5.7억 달러(7,824억 원)와 취업유발인원 3,389명을 발생시킨다는 것. 이 5.7억 달러는 한류산업 자체 생산유발 1.7억 달러와 연관산업 생산유발 4.0억 달러의 합이며, 취업유발 3,389명도 콘텐츠 1,251명 + 연관산업 2,138명으로 분해된다. 주목할 점은 견인계수의 추세다. 1차 연구 4.12배 → 2차 2.48배 → 3차 1.80배로 계속 낮아지다가 이번에 2.02배로 반등했는데, 하락의 원인은 국내 전자기업이 스마트폰 해외생산 비중을 80% 이상으로 늘리면서 IT기기 수출이 연평균 6.3% 감소한 데 있고, 반등은 「한류산업진흥 기본법」 취지를 반영해 관광 수출을 연관산업에 새로 포함한 결과다. 품목별로는 한류산업 수출 1억 달러당 IT기기 1.05억, 화장품 0.73억, 의류 0.17억, 식품 0.15억 달러가 증가한다. 관광은 코로나로 데이터가 분절돼 단일 품목으로는 유의하지 않았다. 배경 통계도 충실하다. 2025년 콘텐츠 수출은 149.1억 달러(전년 대비 +5.9%)로 음악 +32.4%, 영화 +19.9%, 캐릭터 +12.8%가 성장을 견인한 반면 콘텐츠솔루션 -10.3%, 애니메이션 -7.6%, 출판 -3.1%은 감소했다. 게임이 여전히 57.7%로 절대 비중이고 게임·음악·방송영상 3개가 82.8%를 차지한다. 콘텐츠 수출액은 우리나라 총수출의 2.1%로 이차전지·가전·섬유·컴퓨터보다 크고 바이오헬스보다 작은 12번째 규모 품목이다. 2026년 세계 콘텐츠 시장은 2조 4,281억 달러(+5.6%) 전망이며 미·중이 60%를 점유하고, 한국은 세계 8위지만 연평균 성장률이 3.46%로 낮아 수출 확대가 성장 과제로 지목된다.","keypoints":["한류산업 수출 1억 달러 → 연관산업 수출 2.02억 달러 견인, 생산유발 5.7억 달러(7,824억 원), 취업유발 3,389명","견인계수 4.12 → 2.48 → 1.80 → 2.02배. 하락은 IT기기 해외생산 탓, 반등은 관광 포함 효과","2025년 콘텐츠 수출 149.1억 달러(+5.9%). 음악 +32.4%, 영화 +19.9%","콘텐츠 수출은 총수출의 2.1%, 바이오헬스 다음가는 12번째 주요 수출 품목","한국 콘텐츠 시장은 세계 8위지만 CAGR 3.46%로 저성장 — 내수로는 한계","「한류산업진흥 기본법」(2025.4 시행)이 관광·화장품·식품·전통문화상품을 연관산업으로 법제화"],"why":"지자체·기관 제안서에서 콘텐츠 지원사업의 경제효과를 주장할 때 인용할 공식 계수가 갱신됐다. 특히 '1억 달러 수출 → 7,824억 원 생산유발·3,389명 고용'은 예산 논리로 그대로 쓸 수 있는 숫자다. 부천시 협력사업처럼 지역 단위 제안서에서도 콘텐츠→관광·소비재로 이어지는 파급 논리의 근거가 된다.","url":"https://www.kocca.kr/kocca/bbs/view/B0000141/2012133.do?menuNo=204145","file":"2026-08-05/[KOCCA포커스 통권 214호] 한류산업 수출의 경제 효과.pdf","_recent":true},{"id":"2026-06-29-kocca-focus-213","week":"2026-08-05","title":"콘텐츠 기업의 수출은 어떻게 시작되고 지속되는가 (KOCCA 포커스 통권 213호)","issuer":"한국콘텐츠진흥원 정책연구본부","type":"이슈리포트","published":"2026-06-29","pages":26,"size":"1.0MB","genres":["정책·산업","글로벌·수출"],"tags":["수출전환","수출지속","지원사업설계","IP패키징","현지화인력","이질적기업무역이론"],"lede":"수출을 시작하게 하는 역량과 이어가게 하는 역량은 다르다 — 지원사업 이원화의 실증 근거","speakers":[{"name":"염정완","role":"한국콘텐츠진흥원 정책연구본부 미래정책팀 책임연구원","topic":"공동 저자"},{"name":"유정호","role":"국립부경대학교 국제통상학부 부교수","topic":"공동 저자"}],"summary":"통계청 기업활동조사 2006~2024년 패널로 콘텐츠 기업(출판·영상오디오·방송 등)의 수출 참여·전환·지속 결정 요인을 분리 분석한 연구. 문제의식이 날카롭다. 내수기업이 수출기업으로 전환하는 비율은 8.4%에 불과하고, 수출을 시작한 기업의 31.6%는 이듬해 수출을 중단한다. 지원사업 체계가 이미 수출 역량 강화를 지향하고 있는데도 왜 이 간극이 생기는가에 대한 답이 이 연구의 핵심이다. 결론은 '수출을 시작하게 만드는 역량과 이어가게 만드는 역량이 구조적으로 다르다'는 비대칭성이다. 수출 전환 단계에서 유의한 변수는 기업 규모·무형자산(IP)·R&D 인력 보유·해외 자본 보유였고, 생산성과 광고비는 유의하지 않았다. 반대로 수출 지속 단계에서는 기업 규모·기업 생산성·광고비가 유의해지고, 전환 단계의 핵심이던 무형자산·R&D 인력·해외 자본의 효과는 사라진다. 특히 R&D 인력을 보유한 기업은 미보유 기업보다 수출 전환 확률이 5.8%p 높은데, 이는 평균 전환율 8.4%의 약 70%에 해당하는 큰 폭이다. 이론적 배경으로는 Melitz(2003)의 이질적 기업 무역이론을 가져온다. 수출은 학습의 결과가 아니라 원래 우수한 기업이 고정비용을 감당할 수 있어 선택하는 '자기선택'의 성격이 강하다는 것. 콘텐츠 산업의 고정비용은 번역·자막·더빙·판권 정리·국제계약·플랫폼 등록·현지 규제 대응·해외 마케팅으로 구체화된다. 정책 제언이 매우 실무적이다. 전환 단계에는 ①IP 패키징 지원 강화(장르·작품 단위를 넘어 2차 저작물 권리 정비, IP 포트폴리오 구조화, 국제 표준계약서 연계) ②현지화 전문인력 양성(번역·현지 문화 전문가·플랫폼 알고리즘 대응) ③비즈매칭의 일회성 탈피(다년도 파트너십, U-KNOCK 확대) ④콘텐츠 단위 지원을 기업 성장과 연계(동일 기업 다년도 지원 누적 관리). 지속 단계에는 ①마케팅 지원을 단계별로 재설정(수출 중 기업에는 해외 집행 증빙 연계 조건부 지원) ②생산성은 직접 개입 대신 수출보증·세액공제 등 간접 지원 ③수출 이탈 조기 모니터링 체계 도입을 제안한다. 한계도 명시한다. 기업활동조사가 50인 이상 또는 자본금 3억 원 이상만 포함해 콘텐츠산업 다수를 차지하는 영세·중소기업이 빠지고, 직접 수출만 잡혀 라이선스·로열티·플랫폼 수익이 제외된다.","keypoints":["내수→수출 전환율 8.4%, 수출 시작 기업의 31.6%가 이듬해 중단","전환 요인: 기업규모·무형자산(IP)·R&D 인력·해외자본 / 지속 요인: 기업규모·생산성·광고비","R&D 인력 보유 시 수출 전환 확률 +5.8%p (평균 전환율의 70% 수준)","현행 지원사업 대부분이 수출 단계를 구분하지 않아 효과가 희석됨 → 이원적 설계 필요","IP 패키징은 작품 단위가 아니라 권리구조 정비·포트폴리오 구조화 관점으로 전환해야","비즈매칭 일회성 한계 → 다년도 파트너십·공동제작으로 지속 관계 설계"],"why":"이번 주 3건 중 기획조정팀 실무에 가장 직접적이다. '전환 지원과 지속 지원을 나눠 설계하라'는 결론은 GCA 지원사업 개편·성과지표 설계 논의에 그대로 인용 가능하고, 비즈매칭 일회성 지적과 다년도 파트너십 제안은 마켓 참가 지원사업의 개선 근거가 된다. 다년도 지원 누적 관리·이탈 모니터링은 사업 관리체계 제안으로도 쓸 수 있다.","url":"https://www.kocca.kr/kocca/bbs/view/B0000141/2012072.do?menuNo=204145","file":"2026-08-05/[KOCCA포커스 통권 213호] 콘텐츠 기업의 수출은 어떻게 시작되고 지속되는가_콘텐츠 기업 수출 결정 요인 분석.pdf","_recent":true},{"id":"2026-05-27-kocca-focus-212","week":"2026-08-05","title":"콘텐츠산업 종사자가 생성형 AI 이용 시 주의할 법률 쟁점 (KOCCA 포커스 통권 212호)","issuer":"한국콘텐츠진흥원 콘텐츠산업정책연구센터","type":"이슈리포트","published":"2026-05-27","pages":19,"size":"0.8MB","genres":["AI·기술","정책·산업"],"tags":["인공지능기본법","EU AI Act","투명성의무","워터마크","딥페이크","표시의무"],"lede":"AI 표시의무, 한국은 아직 '이용자' 예외지만 EU는 아니다 — 서비스·결과물 유형별 표시 방법 정리","speakers":[{"name":"권구민","role":"한국콘텐츠진흥원 산업정책팀 책임연구원","topic":"공동 저자"},{"name":"박만수","role":"한국콘텐츠진흥원 산업정책팀 책임연구원","topic":"공동 저자"},{"name":"유재규","role":"법무법인(유한) 태평양 변호사","topic":"공동 저자"}],"summary":"2026년 1월 22일 시행된 「인공지능 발전과 신뢰 기반 조성 등에 관한 기본법」(인공지능기본법)과 EU AI Act를 콘텐츠 실무자 관점에서 해설한 보고서. 가장 실무적으로 중요한 지점은 적용 대상의 차이다. 한국 인공지능기본법은 '인공지능사업자'가 적용 대상이라, AI를 활용해 만든 결과물을 제품·서비스로 제공하는 콘텐츠 기업은 '이용자'에 해당해 현재는 법상 의무를 지지 않는다. 반면 EU AI Act는 개인적·비직업적 사용을 제외하고 업무상 AI 시스템을 사용하는 자를 'deployer(배포자)'로 규정해 투명성 의무를 부과하므로, 유럽 대상 서비스라면 국내 기준만 보고 안심하면 안 된다. 다만 국내에서도 온라인 플랫폼에 AI 생성물을 게시할 때 게시자가 AI 생성물임을 표시하도록 의무화하는 'AI 생성물 표시제' 도입이 발표됐고 정보통신망법 개정안이 발의돼 있어, 규제 공백은 곧 닫힐 전망이다. 보고서의 실용적 가치는 서비스 유형별·결과물 유형별 표시 방법을 표로 정리한 부분에 있다. 서비스별로는 대화 기반 서비스(초기 안내 또는 지속 로고, 반복 표시 불필요), 음성 어시스턴트(이용 전 음성·화면 안내, 실물 제품은 겉면 표시), 게임·메타버스(AI가 구성요소로 포함된 경우가 대상이며 AI 캐릭터·NPC임을 이름이나 초기 대화에서 안내), 생산성 향상 서비스(이용화면 로고 표출)로 나뉜다. 결과물별로는 텍스트(머리말·메타데이터, 코드는 주석이나 .md 명시), 이미지(로고 삽입 등 가시적 방법 또는 디지털 워터마킹), 동영상(화면 일부 로고 또는 시작부 안내), 음성(시작부 멘트, 재생 전체 표시 불필요)으로 구분되며, 비가시적 방법만 쓴 경우 다운로드 시 1회 이상 별도 안내가 필요하다는 조건이 붙는다. 광고·표시 규제도 함께 다룬다. 가상 인물이 등장하는 추천·보증 광고는 가상 인물 근처에 '가상 인물' 문구를 표시해야 하고, AI로 생성한 가상 음향·이미지·영상을 활용해 전문가가 의료기기를 보증·추천하는 것처럼 오인하게 하는 광고를 금지하는 의료기기법 개정안이 2026년 5월 7일 국회 본회의를 통과해 공포 6개월 후 시행된다. 결론은 향후 플랫폼·서비스 특성에 맞춘 맞춤형 표시 체계와 UI/UX 설계 역량이 경쟁력이 되며, 업계 공통 가이드라인과 산업 표준화 논의가 확대돼야 한다는 것이다.","keypoints":["한국 인공지능기본법(2026.1.22 시행)은 'AI사업자'만 대상 — AI 결과물을 서비스로 제공하는 콘텐츠 기업은 '이용자'로 현재 의무 없음","단, EU AI Act는 업무상 사용자를 'deployer'로 보아 투명성 의무 부과 — 유럽 대상 서비스는 별도 대응 필요","국내도 'AI 생성물 표시제' 도입 발표 + 정보통신망법 개정안 발의 — 규제 공백은 임시적","서비스별(대화/음성/게임·메타버스/생산성)·결과물별(텍스트/이미지/동영상/음성) 표시 방법이 표로 정리됨","비가시적 표시(워터마크·메타데이터)만 쓰면 다운로드 시 1회 이상 별도 고지 필요","가상 인물 광고는 '가상 인물' 문구 표시 의무, 의료기기법 개정안 2026.5.7 국회 통과"],"why":"AI 활용 콘텐츠 제작 지원사업이나 기관 자체 홍보물에 생성형 AI를 쓸 때 바로 참조할 체크리스트다. 특히 서비스·결과물 유형별 표시 방법 표는 사업 공고문의 준수사항이나 참여기업 가이드로 옮겨 쓰기 좋다. 3개월 경계선(5/27)에 걸쳐 있어 이번 주가 지나면 최신 목록에서 빠지므로 지금 챙겨둘 것.","url":"https://www.kocca.kr/kocca/bbs/view/B0000141/2011828.do?menuNo=204145","file":"2026-08-05/[KOCCA포커스 통권 212호] 콘텐츠산업 종사자가 생성형 AI 이용 시 주의할 법률 쟁점.pdf","_recent":true}],"genres":["정책·산업","글로벌·수출","AI·기술","게임","IP·공간","투자·금융","음악·공연","영상·방송","웹툰·만화"],"genreOrder":["정책·산업","글로벌·수출","AI·기술","게임","IP·공간","투자·금융","음악·공연","영상·방송","웹툰·만화","패션·뷰티"]}</script>
<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const FOLDER = 'E:\\클로드백업\\contents report\\';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = { q:'', genre:null, allOpen:false };

document.getElementById('m-upd').textContent = D.updated;
document.getElementById('m-cnt').textContent = D.reports.length;

const gc = document.getElementById('gchips');
gc.innerHTML = D.genres.map(g =>
  `<button class="chip" type="button" data-g="${esc(g)}" aria-pressed="false">${esc(g)}</button>`).join('');
gc.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  state.genre = (state.genre === b.dataset.g) ? null : b.dataset.g;
  [...gc.children].forEach(c => c.setAttribute('aria-pressed', String(c.dataset.g === state.genre)));
  render();
});

const qi = document.getElementById('q');
qi.addEventListener('input', () => { state.q = qi.value.trim().toLowerCase(); render(); });

const ta = document.getElementById('toggleAll');
ta.addEventListener('click', () => {
  state.allOpen = !state.allOpen;
  ta.textContent = state.allOpen ? '내용 모두 접기' : '내용 모두 펼치기';
  render();
});

function hay(r){
  return [r.title, r.lede, r.issuer, r.type, r.summary, r.why, r.published, r.week,
          ...(r.tags||[]), ...(r.genres||[]), ...(r.keypoints||[]),
          ...(r.speakers||[]).flatMap(s => [s.name, s.role, s.topic])].join(' ').toLowerCase();
}
function match(r){
  if (state.genre && !r.genres.includes(state.genre)) return false;
  if (!state.q) return true;
  const h = hay(r);
  return state.q.split(/\s+/).every(t => h.includes(t));
}
function spkShort(r){
  const s = r.speakers || []; if (!s.length) return '<em>—</em>';
  return s.length === 1 ? esc(s[0].name)
       : `${esc(s[0].name)} <em>외 ${s.length - 1}인</em>`;
}

function rows(r){
  const open = state.allOpen;
  return `<tr class="row${open?' open':''}" data-id="${esc(r.id)}" tabindex="0" role="button"
              aria-expanded="${open}" aria-controls="d-${esc(r.id)}">
    <td class="c-date"><span class="mono">${esc(r.week)}</span></td>
    <td><span class="kind" data-t="${esc(r.type)}">${esc(r.type)}</span></td>
    <td><div class="ttl">${esc(r.title)}</div><div class="lede">${esc(r.lede || '')}</div></td>
    <td class="issuer">${esc(r.issuer)}</td>
    <td class="spk">${spkShort(r)}</td>
    <td><span class="mono">${esc(r.published)}</span></td>
    <td><a class="open-link" href="${esc(r.url)}" target="_blank" rel="noopener"
           onclick="event.stopPropagation()">원문 열기 ↗</a></td>
    <td><span class="x" aria-hidden="true">${open?'−':'+'}</span></td>
  </tr>
  <tr class="det${open?' on':''}" id="d-${esc(r.id)}"><td colspan="8"><div class="detin">
    <div>
      <p class="dh">핵심 포인트</p>
      <ul class="kp">${(r.keypoints||[]).map(k => `<li><span>${esc(k)}</span></li>`).join('')}</ul>
    </div>
    <div>${r.why ? `<p class="dh">업무 활용 포인트</p><p class="why">${esc(r.why)}</p>` : ''}</div>
    <div class="dfull">
      <p class="dh">내용 요약</p>
      <div class="dsum">${String(r.summary).split(/\n{2,}/)
        .map(p => `<p>${esc(p.trim())}</p>`).join('')}</div>
    </div>
    ${(r.speakers||[]).length > 1 ? `<div class="dfull">
      <p class="dh">발표자 · 저자 ${r.speakers.length}인</p>
      <ul class="spk-list">${r.speakers.map(s => `<li>
        <div class="spk-name">${esc(s.name)}<span>${esc(s.role)}</span></div>
        <div class="spk-topic">${esc(s.topic)}</div></li>`).join('')}</ul></div>` : ''}
    <div class="filerow">
      <button class="copy" type="button" data-copy="${esc(r.file)}">내 PC 파일 경로 복사</button>
      <span class="path mono">${esc(r.file)}</span>
      <span class="mono" style="color:var(--ink-3)">${r.pages}p · ${esc(r.size)}</span>
      <span class="tags">${(r.tags||[]).map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</span>
    </div>
  </div></td></tr>`;
}

const HEAD = `<colgroup><col class="c-date"><col class="c-kind"><col><col class="c-issuer">
  <col class="c-spk"><col class="c-pub"><col class="c-link"><col class="c-x"></colgroup>
  <thead><tr><th>수집일</th><th>구분</th><th>제목 · 요지</th><th>발간주체</th>
  <th>발표자 · 저자</th><th>발간일</th><th>원문</th><th></th></tr></thead>`;

function table(label, note, list){
  return `<table><caption><span class="ct serif">${esc(label)}</span>
    <span class="cn mono">${esc(note)}</span></caption>
    ${HEAD}<tbody>${list.map(rows).join('')}</tbody></table>`;
}

function render(){
  const vis = D.reports.filter(match);
  document.getElementById('cnt').textContent =
    (state.q || state.genre) ? `${vis.length} / ${D.reports.length}건` : `${D.reports.length}건`;

  const recent = vis.filter(r => r._recent), old = vis.filter(r => !r._recent);
  let html = '';

  for (const w of [...new Set(recent.map(r => r.week))].sort().reverse()){
    const rs = recent.filter(r => r.week === w);
    const dd = new Date(w + 'T00:00:00');
    html += table(`${dd.getFullYear()}년 ${dd.getMonth()+1}월 ${dd.getDate()}일 수집분`,
                  `${rs.length}건`, rs);
  }

  const gi = g => { const i = D.genreOrder.indexOf(g); return i < 0 ? 99 : i; };
  const gs = [...new Set(old.flatMap(r => r.genres))].sort((a,b) => gi(a)-gi(b) || a.localeCompare(b,'ko'));
  for (const g of gs) html += table(g, `수집 4주 경과 · ${old.filter(r => r.genres.includes(g)).length}건`,
                                    old.filter(r => r.genres.includes(g)));

  if (!vis.length){
    html = `<p class="empty">검색 결과가 없습니다. 다른 키워드를 쓰거나 장르 필터를 해제해 보세요.</p>`;
  } else if (!old.length){
    html += `<p class="empty">수집한 지 4주가 지난 리포트는 위 주차 표에서 빠져
      장르별 표로 따로 모입니다. (${D.cutoff} 이전 수집분부터 · 현재 해당 없음)</p>`;
  }
  document.getElementById('main').innerHTML = html;
}

/* ---- 행 펼치기 ---- */
function toggle(row){
  const det = document.getElementById('d-' + row.dataset.id);
  const on = det.classList.toggle('on');
  row.classList.toggle('open', on);
  row.setAttribute('aria-expanded', String(on));
  row.querySelector('.x').textContent = on ? '−' : '+';
}
document.addEventListener('click', e => {
  if (e.target.closest('a,[data-copy]')) return;
  const row = e.target.closest('tr.row'); if (row) toggle(row);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const row = e.target.closest && e.target.closest('tr.row');
  if (row){ e.preventDefault(); toggle(row); }
});

/* ---- 경로 복사 ---- */
const toast = document.getElementById('toast');
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  e.stopPropagation();
  navigator.clipboard.writeText(FOLDER + b.dataset.copy.replace(/\//g, '\\')).then(() => {
    toast.classList.add('on'); setTimeout(() => toast.classList.remove('on'), 1600);
  }).catch(() => {});
});

document.getElementById('foot').innerHTML =
  `<b>이 페이지는 리포트 원문을 싣지 않습니다.</b> 각 리포트의 저작권은 발행기관에 있으며,
   여기에는 출처를 밝힌 요약과 원문 페이지 링크만 둡니다. PDF는 각 기관 사이트에서 받으세요
   — 행의 <b>원문 열기</b>가 해당 발행기관 페이지로 연결됩니다.<br>
   수집처 — 한국콘텐츠진흥원(KOCCA 포커스 · 세미나자료 · 해외산업동향), 영화진흥위원회,
   한국국제문화교류진흥원, 한국문화관광연구원, 한국방송광고진흥공사, 민간 리서치 등.
   매주 수요일 오전 10시 갱신.`;

render();
</script>
