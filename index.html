:root{
  --paper:#F4F6F3; --surface:#FFFFFF; --sunken:#EBEEE9; --zebra:#FAFBF9;
  --ink:#151A18; --ink-2:#3D4744; --ink-3:#6B7671; --rule:#D6DCD6; --rule-2:#E6EAE5;
  --accent:#1C6B57; --on-accent:#F4F6F3;
  --t-forum:#8A6520; --t-issue:#2B5C93; --t-report:#7A3A5E; --t-global:#9A5330; --t-stat:#4A4E8C; --t-gov:#1F6B6B;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0E1312; --surface:#151B19; --sunken:#1B2321; --zebra:#121917;
    --ink:#E3E9E5; --ink-2:#AEB9B4; --ink-3:#7E8A85; --rule:#2A3431; --rule-2:#212927;
    --accent:#59BE9F; --on-accent:#0E1312;
    --t-forum:#D2A65A; --t-issue:#7FAEDC; --t-report:#C88FAE; --t-global:#E0A184; --t-stat:#A3A8E8; --t-gov:#6FC4C4;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1312; --surface:#151B19; --sunken:#1B2321; --zebra:#121917;
  --ink:#E3E9E5; --ink-2:#AEB9B4; --ink-3:#7E8A85; --rule:#2A3431; --rule-2:#212927;
  --accent:#59BE9F; --on-accent:#0E1312;
  --t-forum:#D2A65A; --t-issue:#7FAEDC; --t-report:#C88FAE; --t-global:#E0A184; --t-stat:#A3A8E8; --t-gov:#6FC4C4;
}
:root[data-theme="light"]{
  --paper:#F4F6F3; --surface:#FFFFFF; --sunken:#EBEEE9; --zebra:#FAFBF9;
  --ink:#151A18; --ink-2:#3D4744; --ink-3:#6B7671; --rule:#D6DCD6; --rule-2:#E6EAE5;
  --accent:#1C6B57; --on-accent:#F4F6F3;
  --t-forum:#8A6520; --t-issue:#2B5C93; --t-report:#7A3A5E; --t-global:#9A5330; --t-stat:#4A4E8C; --t-gov:#1F6B6B;
}

*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:ReportSans,'Noto Sans KR',Pretendard,'Malgun Gothic',
    'Apple SD Gothic Neo',system-ui,sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
  word-break:keep-all}
.serif{font-family:ReportSerif,'Noto Serif KR','Nanum Myeongjo',Batang,serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,ReportSans,'Noto Sans KR',monospace;
  font-variant-numeric:tabular-nums; font-size:.84em; letter-spacing:.01em}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.pad{padding:0 clamp(16px,2.2vw,34px)}

/* ---------- masthead ---------- */
.rule-accent{height:2px; background:var(--accent)}
.mast{background:var(--surface); border-bottom:1px solid var(--rule)}
.mast-in{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 22px; padding-top:22px; padding-bottom:17px}
.mast h1{font-size:28px; margin:0; font-weight:600; letter-spacing:-.01em}
.mast .sub{color:var(--ink-3); font-size:12.5px; line-height:1.55; margin:0}
.mast .sub b{color:var(--ink-2); font-weight:600}

/* ---------- controls ---------- */
.controls{position:sticky; top:0; z-index:30; background:var(--paper); border-bottom:1px solid var(--rule)}
.controls-in{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding-top:10px; padding-bottom:10px}
.search{flex:0 1 320px; display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--rule); padding:6px 11px}
.search input{flex:1; border:0; background:none; color:var(--ink); font:inherit; font-size:14px; min-width:0}
.search input::placeholder{color:var(--ink-3)}
.search svg{flex:none; stroke:var(--ink-3)}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{font-size:12px; padding:3px 10px; border:1px solid var(--rule); background:var(--surface);
  color:var(--ink-2); cursor:pointer; line-height:1.5; font-family:inherit;
  transition:background .12s,border-color .12s,color .12s}
.chip:hover{border-color:var(--accent); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.spacer{flex:1 1 auto}
.count{color:var(--ink-3); font-size:12px; white-space:nowrap}
.linkbtn{background:none; border:0; font:inherit; font-size:12px; color:var(--accent);
  cursor:pointer; padding:3px 2px; text-decoration:underline; text-underline-offset:3px}

/* ---------- table ---------- */
main{padding-top:26px; padding-bottom:70px}
table{width:100%; border-collapse:collapse; table-layout:fixed}
caption{text-align:left; padding:22px 0 7px; border-bottom:2px solid var(--ink)}
caption .ct{font-size:18px; font-weight:600; letter-spacing:-.01em}
caption .cn{color:var(--ink-3); font-size:12px; margin-left:12px}
thead th{position:sticky; top:60px; z-index:10; background:var(--paper);
  text-align:left; font-size:11px; font-weight:600; letter-spacing:.1em; color:var(--ink-3);
  padding:9px 12px 8px; border-bottom:1px solid var(--rule); white-space:nowrap}
thead th:first-child{padding-left:0}
thead th:last-child{padding-right:0}
col.c-date{width:96px} col.c-kind{width:112px} col.c-issuer{width:190px}
col.c-spk{width:184px} col.c-pub{width:96px} col.c-link{width:118px} col.c-x{width:40px}

tbody tr.row{border-bottom:1px solid var(--rule-2); cursor:pointer}
tbody tr.row:nth-child(4n+1){background:var(--zebra)}
tbody tr.row:hover{background:var(--sunken)}
tbody tr.row.open{background:var(--sunken)}
tbody td{padding:12px; vertical-align:top}
tbody td:first-child{padding-left:0}
tbody td:last-child{padding-right:0}
.c-date .mono{color:var(--ink-2)}
.kind{display:inline-block; font-size:10.5px; letter-spacing:.06em; font-weight:700;
  padding:2px 7px; border:1px solid currentColor; color:var(--t-issue); white-space:nowrap}
.kind[data-t="포럼 발표자료"]{color:var(--t-forum)}
.kind[data-t="연구보고서"]{color:var(--t-report)}
.kind[data-t="해외 산업동향"]{color:var(--t-global)}
.kind[data-t="산업통계"]{color:var(--t-stat)}
.kind[data-t="정부 업무보고"]{color:var(--t-gov)}
.ttl{font-size:16.5px; font-weight:600; line-height:1.45; letter-spacing:-.012em; margin-bottom:3px}
.lede{color:var(--ink-3); font-size:13px; line-height:1.55}
.issuer,.spk{color:var(--ink-2); font-size:13px; line-height:1.5}
.spk em{font-style:normal; color:var(--ink-3)}
.open-link{display:inline-block; font-size:12.5px; padding:4px 10px; border:1px solid var(--rule);
  color:var(--ink-2); text-decoration:none; white-space:nowrap; transition:background .12s,color .12s}
.open-link:hover{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.x{width:26px; height:26px; border:1px solid var(--rule); background:var(--surface); color:var(--ink-2);
  cursor:pointer; font:inherit; font-size:14px; line-height:1; display:grid; place-items:center}
tr.row.open .x{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}

/* ---------- detail row ---------- */
tr.det{display:none} tr.det.on{display:table-row}
tr.det>td{padding:0 0 30px; border-bottom:1px solid var(--rule)}
.detin{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0 44px;
  align-items:start; background:var(--sunken); padding:22px 26px; border-left:2px solid var(--accent)}
.dh{font-size:10.5px; letter-spacing:.11em; font-weight:700; color:var(--accent);
  text-transform:uppercase; margin:0 0 7px}
/* 한글은 글자 폭이 넓어 em 기준으로 읽기 좋은 줄길이를 잡는다(≈45자) */
.dsum{color:var(--ink-2); font-size:14.5px; line-height:1.78; max-width:46em}
.dsum p{margin:0 0 13px} .dsum p:last-child{margin-bottom:0}
/* 【세션】 머리표가 붙은 문단은 눈에 띄게 */
.dsum p:not(:first-child){padding-top:11px; border-top:1px solid var(--rule)}
.kp{margin:0; padding:0; list-style:none; max-width:46em}
.kp li{display:flex; gap:10px; padding:6px 0; font-size:13.5px; line-height:1.6;
  border-bottom:1px solid var(--rule)}
.kp li::before{content:""; flex:none; width:5px; height:5px; margin-top:8px;
  background:var(--accent); transform:rotate(45deg)}

26년 7월 한국 영화산업 결산 보고서.pdf","_recent":true},{"id":"2026-08-25-kcti-content-trade-2026h1","week":"2026-08-26","title":"[콘텐츠산업 동향 인덱스] 콘텐츠 분야 상품 무역 (2026년 2호)","issuer":"한국문화관광연구원 콘텐츠연구본부","type":"산업통계","published":"2026-08-25","pages":11,"size":"0.7MB","genres":["정책·산업","글로벌·수출"],"tags":["무역수지","K팝굿즈","응원봉","포토카드","음반수출","게임용품적자","관세청통관","유럽수출"],"lede":"K팝 실물 굿즈가 무역흑자를 만든다 — 음반·응원봉은 폭증, 포토카드는 반토막","speakers":[],"summary":"관세청 통관 신고 기준 한국무역협회 「K-stat 무역통계」를 재가공해, 콘텐츠가 내재된 실물 품목의 국경 간 거래만 따로 떼어 본 통계 인덱스다. 음반물·영상물·서적·잡지·게임용품에 더해 포토카드(인쇄카드 코드)와 콘서트 응원도구(축제도구 기타 코드)까지 콘텐츠 상품으로 범주화한 것이 특징으로, 라이선스·서비스 수출 위주인 기존 콘텐츠산업 수출통계에서는 잡히지 않던 '팬덤 실물 소비'를 볼 수 있다.\n\n2026년 상반기 콘텐츠 분야 상품 무역수지는 2억2,330만 달러 흑자로, 전년 동기(8,570만 달러)보다 1억3,760만 달러 늘었다. 수출이 5억3,160만 달러로 39.8% 급증한 반면 수입은 3억830만 달러로 4.7% 증가에 그치면서 흑자폭이 벌어졌다. 흑자를 만든 것은 사실상 K팝 관련 두 품목이다. 음반물 수출이 2억5,750만 달러로 122.5% 늘어 단일 품목 최대 흑자(2억5,490만 달러)를 냈고, 콘서트 응원도구(응원봉 등)는 수출 5,020만 달러로 183.6% 폭증하며 흑자가 120만 달러에서 3,450만 달러로 한 해 만에 29배가 됐다.\n\n반대 방향의 숫자도 분명하다. 한때 팬덤 굿즈의 대표 품목이던 포토카드는 수출이 2,150만 달러로 52.1% 급감해 흑자가 3,470만 달러에서 1,410만 달러로 반토막 났다. 서적은 수출 1억750만 달러(-18.8%)로 흑자가 6,280만→4,440만 달러로 줄었는데, 대중국 수출이 21.1% 빠진 영향이 크다. 게임용품은 유일한 대규모 적자 품목으로 1억2,690만 달러 적자를 기록했다(수출 9,010만 달러 vs 수입 2억1,700만 달러). 콘솔·게임기기를 사 오는 구조가 그대로다.\n\n권역별로는 對아시아 수지가 -1,810만 달러에서 +1,460만 달러로 흑자 전환한 것이 최대 변화다. 대중 적자가 -1억2,220만→-8,370만 달러로 개선됐는데, 중국 음반물 수출이 204.4% 늘어난 것이 주된 이유다. 유럽은 수출이 8,030만 달러로 142.9% 늘며 흑자가 1,450만→6,090만 달러로 커졌고, 특히 유럽향 콘서트 응원도구 수출이 939.1%(영국은 1,508.7%) 폭증했다. 북미도 수출 1억5,230만 달러(+78.5%), 미국 음반물 수출은 281.0% 늘었다. 반면 중동은 수출이 51.2% 줄었다.","keypoints":["2026년 상반기 콘텐츠 상품 무역수지 2억2,330만달러 흑자 — 전년 동기 대비 1억3,760만달러 증가","수출 5억3,160만달러(+39.8%)가 수입 4.7% 증가를 크게 앞지르며 흑자폭 확대","음반물 수출 +122.5%(2억5,750만달러), 콘서트 응원도구 수출 +183.6% — 흑자 120만→3,450만달러(29배)","포토카드는 수출 -52.1%로 급감, 흑자 3,470만→1,410만달러 반토막 — 팬덤 굿즈 안에서도 품목 교체 진행","게임용품은 유일한 대규모 적자(-1억2,690만달러) — 수입 2억1,700만달러 vs 수출 9,010만달러","對아시아 수지 흑자 전환(-1,810만→+1,460만달러), 대중 적자도 개선 — 중국 음반물 수출 +204.4%","유럽 수출 +142.9%, 유럽향 응원도구 수출 +939.1%(영국 +1,508.7%) — 서구권 팬덤 실물소비 본격화","서적 수출 -18.8%(대중국 -21.1%)로 출판 수출은 역행"],"why":"콘텐츠 수출을 이야기할 때 흔히 쓰는 KOCCA 수출액은 라이선스·서비스 중심이라 굿즈·MD 실물 거래가 빠진다. 이 인덱스는 관세청 통관 기준이라 그 공백을 메우며, '응원봉 수출 +183.6%' 같은 수치는 경기도 굿즈·MD 제조기업 지원사업이나 K팝 연계 수출상담회의 필요성을 설명할 때 바로 쓸 수 있는 근거다. 포토카드 급감·게임용품 적자처럼 방향이 엇갈리는 품목이 함께 있어, 지원 품목을 고를 때의 판단 자료로도 유용하다.","url":"https://www.kcti.re.kr/web/board/boardContentsView.do?board_id=34&contents_id=5795c0f6edcd49dca22647a67bce3449","file":"2026-08-26/콘텐츠 분야 상품무역_2026.2호.pdf","_recent":true},{"id":"2026-08-21-kocca-saudi-kpop","week":"2026-08-26","title":"사우디 음악 시장에서 K-Pop 활동 및 팬덤의 특징과 현지 진출 시사점 (사우디 26-3호)","issuer":"한국콘텐츠진흥원 사우디아라비아비즈니스센터 (집필: ㈜스트라베이스)","type":"해외 산업동향","published":"2026-08-21","pages":19,"size":"0.7MB","genres":["음악·공연","글로벌·수출"],"tags":["사우디아라비아","K팝","중동진출","MDLBEAST","국부펀드","니타카트","현지법인화","G2G협력"],"lede":"K팝 중동 진출의 다음 단계는 완제품 수출이 아니라 '제작 시스템 이식'","speakers":[{"name":"김정미","role":"㈜스트라베이스 (집필)","topic":"사우디 음악시장·K팝 팬덤 분석"},{"name":"구재상","role":"한국콘텐츠진흥원 사우디아라비아비즈니스센터장 (감수)","topic":"감수"}],"summary":"UAE와 함께 중동 엔터테인먼트 매출의 60% 이상을 차지하는 사우디아라비아 시장에서 K팝이 자리 잡는 과정과 그 산업적 함의를 다룬 심층 리포트다. PwC 전망에 따르면 사우디 음악산업은 2023년 이후 연평균 6.7% 성장해 2028년 3억1,000만 달러 규모에 이를 전망이고, 대형 페스티벌을 포함한 라이브 공연 시장은 2026년 기준 27억7,000만 달러에 달한다. 이 성장 축에 K팝이 올라타는 방식이 이 보고서의 핵심이다. 사우디 최대 뮤직페스티벌 MDLBEAST 사운드스톰 등에 K팝 아티스트가 참여하는 '플러그인 전략'으로 오프라인 트래픽을 만들고, 엠넷플러스·빅크 같은 디지털 플랫폼이 여성의 장거리 단독 이동 제약 등 현지 특수성을 보완하며 팬덤을 상시적으로 결집시킨다. 팬들은 공동구매·생일카페 등 오프라인 이벤트를 실물 경제 활동으로 정착시키고 있고, 'Habibi Dance Remix'처럼 중동 전통 타악기와 K팝 사운드를 결합한 현지화 시도도 나타난다. 다만 보고서가 강조하는 진짜 변곡점은 소비가 아니라 생산 구조의 이전이다. CJ ENM은 사우디 국부펀드(PIF) 산하 이벤트 기업 SELA와 파트너십을 맺어 현지 법인화를 진행 중인데, 이는 사우디 정부의 '지역본부(RHQ) 프로그램' — 중동·북아프리카 총괄 거점을 사우디에 두는 다국적기업에 정부 조달 우선권과 세제 혜택을 주는 정책 — 에 대한 선제 대응이기도 하다. 2025년 리야드 'K-콘텐츠 엑스포'에서 국내 기업 30개사가 현지 바이어 83개사와 447건의 비즈니스 미팅을 갖고 약 500억 원 규모 상담 성과를 낸 사례를 근거로, 보고서는 K팝의 오디션·육성 시스템(A&R)과 360도 무대·LED 등 공연 프로덕션 기술 자체를 현지에 수출하는 '시스템 이식' 모델로의 전환을 전망한다. 동시에 자국민 의무고용제 '니타카트', 이슬람 율법에 따른 콘텐츠 검열, 송금 시 원천징수세 등 실무 리스크를 짚으며, 개별 기업 역량만으로는 돌파가 어려운 만큼 사우디 엔터테인먼트청(GEA)·투자부(MISA)와의 상시 G2G 채널이 필요하다고 제언한다.","keypoints":["사우디 음악산업 연평균 6.7% 성장, 2028년 3억1천만달러 전망 — 라이브공연 시장은 이미 27억7천만달러(2026년)","K팝은 MDLBEAST 사운드스톰 등 메가 페스티벌 '플러그인' 참여로 오프라인 트래픽 확보, 엠넷플러스·빅크로 팬덤 상시 결집","'Habibi Dance Remix' 등 중동 전통음악과 K팝 사운드를 섞는 현지화 리믹스가 페스티벌 핵심 장르로 부상","CJ ENM, 사우디 국부펀드(PIF) 산하 SELA와 파트너십 체결 — 현지법인화로 'RHQ 프로그램' 세제혜택·정부조달 우선권 선점","2025년 리야드 K-콘텐츠 엑스포: 국내 30개사·현지 바이어 83개사, 447건 미팅·약 500억원 상담 성과","다음 단계는 완제품 수출이 아니라 오디션·A&R 시스템, 360도 무대·LED 등 공연 프로덕션 기술의 '턴키 수출'","리스크: 자국민 의무고용제 니타카트, 콘텐츠 검열, 송금 원천징수세 — G2G 채널을 통한 정책적 방어막 필요성 제언"],"why":"중동은 K팝의 다음 신흥시장으로 꼽히지만 국내에 축적된 실무 정보가 적다. 국부펀드 연계 페스티벌·RHQ 세제혜택 등 사우디 특유의 진출 조건과 니타카트·검열 같은 리스크 요인이 정리돼 있어, GCA가 경기도 콘텐츠기업의 중동 진출 지원사업(박람회 참가·현지 파트너 매칭)을 설계할 때 국가별 리스크 체크리스트로 바로 활용할 수 있다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158950/2012407.do?menuNo=204160","file":"2026-08-26/[사우디26-03호]사우디 음악 시장에서 K-Pop 활동 및 팬덤의 특징과 현지 진출 시사점.pdf","_recent":true},{"id":"2026-08-19-kocca-domestic-q1-2026","week":"2026-08-19","title":"2026년 1분기 콘텐츠산업 동향분석 보고서","issuer":"한국콘텐츠진흥원 (수행: 한국갤럽조사연구소)","type":"분기보고서","published":"2026-07-15","pages":230,"size":"16.5MB","genres":["정책·산업","투자·금융"],"tags":["콘텐츠산업통계","1분기결산","경영체감도CBI","상장사분석","웹툰","K팝실적","붉은사막","왕과사는남자"],"lede":"매출 40.9조·수출 38억달러는 늘고 종사자는 준 국내 콘텐츠산업 1분기 성적표","speakers":[{"name":"전종섭","role":"한국콘텐츠진흥원 데이터정책팀 책임연구원","topic":"연구책임"},{"name":"김태경","role":"한국갤럽조사연구소 부장","topic":"조사수행 PM"}],"summary":"표본 2,500개 사업체 실태조사와 상장사 재무제표 정량분석, 산업별 정성 이슈분석을 결합한 KOCCA의 분기 정례 보고서다. 2026년 1분기 국내 콘텐츠산업 매출은 40조9,495억 원으로 전년 동기 대비 7.9% 증가했고 수출은 38억1,604만 달러로 21.4% 늘었지만, 종사자 수는 68만1,756명으로 0.8% 줄어 '매출·수출은 늘어도 고용은 준다'는 구조가 재확인됐다. 산업별로는 영화가 전년 동기 대비 42.6% 늘어 가장 크게 성장했는데, 장항준 감독의 <왕과 사는 남자>가 1,573만 관객·1,518억 원의 단일작품 매출로 역대 한국영화 박스오피스 매출 1위에 오르며 극장가 전체를 팬데믹 이후 최대 실적으로 끌어올린 결과다. 음악산업은 17.7% 성장했는데, 하이브(매출 6,983억 원)·SM(2,791억 원)·JYP(1,860억 원)·YG(1,471억 원) 4대 기획사가 일제히 호실적을 내며 비음악(MD·라이선싱·팬클럽) 매출 비중을 하이브 34%·SM 25%·YG 18%·JYP 12%까지 끌어올렸고, 동남아 매출이 전년 대비 32% 성장하며 '미-일-동남아-중' 4각 편대로 시장이 다변화됐다. 게임산업은 23.9% 성장했지만 속을 들여다보면 양극화가 뚜렷하다 — 넥슨과 크래프톤(펄어비스 '붉은사막' 26일 만에 500만 장 판매 등) 두 회사의 영업이익 합계가 상장 14개사 전체 영업이익의 약 73%를 차지했다. 반대로 방송산업은 지상파 3사가 3년 연속 영업손실(2025년 1,174억 원)을 낸 반면, 티빙 가입자를 37.3% 늘린 CJ ENM과 중예산 드라마로 해외 매출 비중 61%를 달성한 스튜디오드래곤 등 OTT 공급 스튜디오는 뚜렷이 갈렸다. 출판은 3.7% 감소했지만 '문학의 부활'(베스트셀러 100위 내 소설 22권, 2년 전의 4배)과 생성형 AI 저작권 이슈가 새로운 화두로 떠올랐고, 캐릭터산업은 2025년 한 해 3,000개를 넘어선 팝업스토어 붐(전년비 +13.7%)에 힘입어 9.4% 성장했다.","keypoints":["1분기 매출 40조9,495억원(+7.9%)·수출 38억1,604만달러(+21.4%) 증가, 종사자는 68만1,756명(-0.8%)으로 감소","영화산업 +42.6% 최대 성장 — <왕과 사는 남자> 1,573만명·1,518억원으로 역대 한국영화 박스오피스 매출 1위","음악산업 +17.7%, 4대 기획사 비음악매출 비중 하이브34%·SM25%·YG18%·JYP12%로 확대, 동남아 매출 +32%","게임산업 +23.9% 성장이나 양극화 심화 — 넥슨·크래프톤 2개사가 상장 14개사 영업이익의 73% 독식","방송광고 매출 3년연속 감소(2조134억원,-12.3%)·지상파 3년연속 영업손실(1,174억원) vs CJ ENM·스튜디오드래곤 등 OTT공급 스튜디오는 호실적","출판 -3.7% 침체 속 '소설의 부활'(베스트셀러100위 내 소설 22권, 2년전 4배)과 생성형AI 저작권 딜레마 부상","캐릭터산업 +9.4% — 2025년 팝업스토어 3,000개 상회(+13.7%)가 성장 견인, AI 초개인화 체험이 신규 트렌드"],"why":"국가승인 수준의 표본조사에 기반한 분기 매출·수출·고용 정량치와 업종별 이슈분석이 결합돼 있어 GCA의 사업계획서·의정보고·보도자료에 근거자료로 바로 인용할 수 있다. 특히 게임·방송에서 확인된 '상위 소수 쏠림' 구조는 경기도 중소 콘텐츠기업 대상 지원사업을 설계할 때 우선순위 판단 근거로 쓸 만하다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158949/2012173.do?menuNo=204157","file":"2026-08-19/2026년 1분기 콘텐츠산업 동향분석 보고서.pdf","_recent":true},{"id":"2026-08-19-kocca-tokyo-character","week":"2026-08-19","title":"일본 캐릭터산업 동향: 생활 인프라가 된 캐릭터 (도쿄 26-07호)","issuer":"한국콘텐츠진흥원 도쿄비즈니스센터","type":"해외 산업동향","published":"2026-08-19","pages":21,"size":"4.2MB","genres":["글로벌·수출","IP·공간"],"tags":["일본","캐릭터산업","오시카츠","굿즈·MD상품","인바운드소비","산리오","포켓몬","생활인프라화"],"lede":"17.4조원 역대 최대 일본 캐릭터시장 — '오시카츠'가 굿즈를 생필품으로 바꿨다","speakers":[{"name":"김승미","role":"한국콘텐츠진흥원 경영기획부 리서치팀 팀장","topic":"집필"},{"name":"이혜은","role":"한국콘텐츠진흥원 도쿄비즈니스센터장","topic":"감수"},{"name":"하기 쿠루미","role":"한국콘텐츠진흥원 도쿄비즈니스센터 주임","topic":"감수"}],"summary":"일본 캐릭터데이터뱅크의 <CharaBiz DATA 2026>을 바탕으로 KOCCA 도쿄센터가 정리·분석한 보고서다. 2025년 일본 캐릭터 상품 소매시장은 전년 대비 3.2% 성장한 1조7,400억 엔으로 코로나 이후 5년 연속 확대되며 역대 최대치를 기록했다. 성장의 핵심 키워드는 '오시카츠(推し活, 최애 응원소비)'의 생활화다 — 좋아하는 대상을 응원하며 시간·돈을 쓰는 이 팬덤 행동이 일본은행 공식 경제보고서에 언급될 만큼 사회 전반으로 확산되면서, 캐릭터 상품이 '특별한 것'에서 '일상의 전제'로 바뀌었다. 수납·향기·위생·수면·요리 등 생활 전 영역에서 캐릭터가 역할을 부여받아 쓰이는 사례가 늘었고, 액세서리·의류·가정용품 등에서는 '세계관 단위' 시리즈 구매가 확산됐다. 채널 측면에서는 통신판매(온라인쇼핑몰)가 점유율 18.45%(전년대비 +1.47%p)로 1위에 올랐고, 반대로 완구·잡화 매대를 줄인 종합슈퍼(GMS)는 점유율이 11.21%나 급감해 저출산·업태 축소의 직격탄을 맞았다. 캐릭터 순위는 포켓몬스터가 5년 연속 1위, 호빵맨이 5년 연속 2위를 지켰고, 2017년 SNS 낙서에서 출발한 '치이카와(먼작귀)'가 4위에서 3위로 뛰어올라 매달 4~5개 신상 굿즈를 내는 등 신흥 IP의 저력을 보였다. 성별로는 여성 소비가 60.76%로 압도적이며, 영유아층(0~4세)과 30대 오시카츠층이 시장 확대를 이끈 반면 16~29세 청년층·50대 이상은 오히려 점유율이 줄었다. 흥미로운 점은 광고 지표와의 괴리다 — 캐릭터 기용 TV광고(2,356건)와 판촉 기용(944건)은 오히려 2년 연속 감소했는데, 이는 시장 전체를 견인할 '메가 히트' 캐릭터의 부재 때문으로 분석된다. 즉 소수 대형 IP 의존형 성장이 아니라 SNS발 오리지널 캐릭터(전년비 17.6%↑)까지 포함한 다층적 IP 생태계가 시장을 떠받치는 구조 전환이 일어난 것이다. 2026년에는 역직구·해외 팝업스토어 확대로 일본발 캐릭터의 '국내외 이중성장(Dual Growth)'이 본격화할 것으로 전망됐다.","keypoints":["2025년 일본 캐릭터 상품 소매시장 1조7,400억엔(전년비 3.2%↑), 코로나 이후 5년 연속 성장·역대 최대","성장 동력은 '오시카츠(推し活)' 생활화 + 인바운드 회복 + 체험소비 회복의 삼위일체","판매채널 1위 온라인쇼핑몰 18.45%(+1.47%p) — 반면 종합슈퍼(GMS)는 11.21%로 급감(비식품 매대 축소)","포켓몬스터 5년 연속 1위·호빵맨 5년 연속 2위, 2017년 SNS 낙서 출신 '치이카와'가 3위로 상승","여성 소비 60.76% vs 남성 39.24%, 0~4세·30대 오시카츠층이 성장 견인 vs 16~29세·50대+ 는 축소","캐릭터 기용 TV광고·판촉은 2년 연속 감소 — 대형 IP 대신 SNS발 캐릭터 다층화(오리지널 부문 +17.6%)로 성장구조 전환","2026년 전망: 브랜드 횡단 MD전략 심화 + 역직구·해외 팝업 확대로 '국내외 이중성장' 예상"],"why":"캐릭터·굿즈 산업이 팬덤 소비(오시카츠)를 매개로 생활용품 전 카테고리로 침투한 사례라, 경기 소재 IP·캐릭터 기업의 MD 다각화 지원사업이나 굿즈 스타트업 육성 방향을 설계할 때 참고자료로 쓸 수 있다. 특히 GMS(종합슈퍼) 쇠퇴와 온라인·전문점 강세라는 채널 재편 흐름은 국내 캐릭터 유통 지원정책에도 시사점을 준다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158950/2012398.do?menuNo=204160","file":"2026-08-19/[도쿄26-7호]일본 캐릭터산업 동향_생활 인프라가 된 캐릭터.pdf","_recent":true},{"id":"2026-08-19-kocca-india-policy","week":"2026-08-19","title":"인도 콘텐츠산업 지원정책 및 현황 (인도 26-11호)","issuer":"한국콘텐츠진흥원 인도비즈니스센터","type":"해외 산업동향","published":"2026-08-18","pages":15,"size":"0.7MB","genres":["정책·산업","글로벌·수출"],"tags":["인도","AVGC-XR","WAVES","공동제작협정","영화인센티브","콘텐츠정책","투자유치","K-콘텐츠진출"],"lede":"284억달러 인도 콘텐츠시장, 중앙·주정부가 경쟁하듯 쏟아내는 AVGC-XR 인센티브 지도","speakers":[{"name":"이경아","role":"더플랜지 대표","topic":"집필"},{"name":"김영수","role":"한국콘텐츠진흥원 인도비즈니스센터장","topic":"감수"}],"summary":"EY의 <2025 M&E Report>를 토대로 KOCCA 인도센터가 중앙정부·주정부의 콘텐츠산업 지원정책을 총정리한 보고서다. 2025년 인도 콘텐츠산업 규모는 284억 달러(약 2.7조 루피, 인도 GDP의 0.8%)로 전년 대비 7.2% 성장했고, 2028년에는 348억 달러까지 커질 전망이다. 디지털미디어가 44% 성장하며 처음으로 TV를 제친 반면, 게임 분야는 2025년 8월 인도가 RMG(실시간 현금게임) 금지법을 통과시키면서 17% 감소하는 등 분야별 명암이 뚜렷했다. 정책의 중심축은 2022-23 예산안에서 출범한 'AVGC-XR(애니메이션·VFX·게임·코믹스·XR)' 국가전략이다. 정보방송부·전자정보기술부가 공동 주도해 뭄바이 필름시티 내 국가우수센터(NCoE, 운영명 IICT)를 39.1억 루피(약 580억원) 예산으로 설립했고, Google·Apple·Microsoft·Meta·Adobe·NVIDIA와 산학협력을 맺어 1만5,000명 규모의 AI 인재양성 프로그램까지 연계했다. 외국 제작사 유치책도 구체적이다 — 2005년 이탈리아를 시작으로 한국(2015년, 11번째)·콜롬비아(2024년, 17번째)까지 국제 공동제작 협정을 체결해 자국 영화와 동일한 혜택을 부여하며, 인도 현지 촬영·후반작업 비용의 최대 40%(최대 3억 루피, 약 45억원)를 환급해준다. 2025년 5월 뭄바이에서 열린 WAVES 서밋은 90개국 1만 명 이상 대표단이 참가해 1,000억 루피(약 1.5조원) 규모의 거래·투자를 성사시켰고, 이후 상설화된 B2B 플랫폼 'WAVES Bazaar'는 3,000건 이상의 미팅과 133억 루피(약 2,100억원)의 라이선싱·공동제작 계약을 이끌어냈다 — Amazon Prime Video와 CJ ENM의 전략적 파트너십도 이 자리에서 발표됐다. 주정부 간 경쟁도 치열하다: 우타르프라데시는 지역어 촬영 영화에 제작비 최대 50%를 지원하며 노이다에 대형 필름시티를 조성 중이고, 마하라슈트라는 AVGC-XR에 '산업·인프라' 지위를 부여해 327억 루피(약 5,120억원) 예산을 승인, 마디야프라데시는 IP 등록비의 50%까지 보조한다. 다만 산업계(CII)는 2025년 12월 백서에서 생산연계인센티브(PLI) 10~20% 신설과 500억 루피(약 750억원) 규모 수출지원기금 조성을 정부에 요구하는 등 아직 지원이 충분치 않다는 목소리도 크다.","keypoints":["2025년 인도 콘텐츠산업 284억달러(GDP 0.8%), 2028년 348억달러 전망(연평균 6%) — 디지털미디어 44%성장이 견인","게임분야는 2025.8 RMG(실시간 현금게임) 금지법으로 17% 감소, 성장세 속 정책리스크 공존","AVGC-XR 국가전략: 뭄바이 국가우수센터(IICT)에 예산 580억원, Google·Meta 등과 산학협력·AI인재 1.5만명 양성","한국은 2015년 인도와 영상물 공동제작협정 체결(11번째) — 현지 지출 최대 40%(45억원 한도) 환급","2025 WAVES 서밋 1.5조원 거래·투자 유치, 상설 B2B 플랫폼 WAVES Bazaar에서 2,100억원 계약 체결(Amazon·CJ ENM 포함)","주정부별 인센티브 경쟁: 우타르프라데시(제작비 최대50%)·마하라슈트라(5,120억원 예산)·마디야프라데시(IP등록비 50%)","산업계(CII)는 PLI 10~20%·수출지원기금 750억원 신설을 정부에 추가 요구 중 — 지원은 확대일로이나 미충족 수요 여전"],"why":"국가·지방정부가 세제·현금·인프라 인센티브를 입체적으로 설계해 해외 제작사를 유치하는 인도 사례는, GCA가 경기도 콘텐츠기업의 해외 공동제작·투자유치 지원사업을 설계하거나 지자체 단위 인센티브 체계를 벤치마킹할 때 참고할 수 있다. 특히 한-인도 공동제작협정이 이미 발효 중이라는 점은 도내 기업의 인도 진출 지원 프로그램 기획에 바로 활용 가능하다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158950/2012385.do?menuNo=204160","file":"2026-08-19/[KOCCA_인도-11호] 인도 콘텐츠산업 지원정책 및 현황.pdf","_recent":true},{"id":"2026-08-19-kocca-content-industry-survey-2024","week":"2026-08-19","title":"2024년 기준 콘텐츠산업조사","issuer":"문화체육관광부·한국콘텐츠진흥원","type":"산업통계","published":"2026-07-03","pages":345,"size":"19.4MB","genres":["정책·산업"],"tags":["콘텐츠산업조사","국가승인통계","경기도","만화웹툰","지역편중","수출입","사업체수","부가가치"],"lede":"만화산업에서 경기도가 서울을 제치고 전국 1위로 — 콘텐츠산업 지도가 바뀌었다","speakers":[],"summary":"18,678개 사업체를 대상으로 2025년 10~11월 실사한, 콘텐츠산업 분야 유일의 국가승인통계다. 2024년 기준 국내 콘텐츠산업은 사업체 수 12만875개(전년비 +2.4%), 종사자 68만8,121명(+3.4%), 매출액 157조4,021억원(+2.1%)을 기록했고, 부가가치액은 56조9,577억원(부가가치율 36.2%)이었다. 수출은 전년비 5.5% 늘어난 140억7,543만 달러, 수입은 9억1,556만 달러로 131억5,987만 달러의 흑자를 냈으며 11개 세부산업 전부에서 수출이 수입을 웃돌았다 — 그중 게임산업 수출액(85억347만 달러)이 전체 수출의 60.4%를 차지해 절대적 비중을 이뤘다. 매출액 기준으로는 방송및영상(24조9,943억원, 15.9%)·지식정보(24조6,991억원)·출판(24조2,238억원)·게임(23조8,515억원)이 4강 구도를 형성했다. 이번 조사에서 GCA(경기콘텐츠진흥원)가 특히 주목할 대목은 지역별 통계다. 만화(웹툰)산업 매출을 지역별로 뜯어보면, 경기도가 2024년 전년 대비 177.9% 폭증한 1조5,554억원(비중 45.4%)을 기록하며 처음으로 서울(1조4,807억원, 43.2%, 오히려 전년비 △15.2% 감소)을 추월해 전국 최대 웹툰산업 거점으로 부상했다. 보고서는 이를 '대형 플랫폼 운영기반과 제작 인프라가 경기도로 집중된 영향'으로 해석했다. 다만 서울·경기 두 지역의 합산 비중이 전체 만화산업 매출의 88.6%(2023년 84.1%)에 달해, 웹툰산업의 수도권 집중이 오히려 더 심화됐다는 이면도 함께 나타났다. 조사는 콘텐츠산업 특수분류(출판·만화·음악·게임·영화·애니메이션·방송및영상·광고·캐릭터·지식정보·콘텐츠솔루션 11개)를 기준으로 사업체 수·매출액·제작비·부가가치·수출입·종사자 등을 산업별·지역별·조직형태별로 전수 추정한 결과를 담고 있어, 시·군 단위까지 내려가는 세부 표가 함께 제공된다.","keypoints":["2024년 콘텐츠산업 매출 157조4,021억원(+2.1%), 사업체 12만875개(+2.4%), 종사자 68만8,121명(+3.4%)","수출 140억7,543만달러(+5.5%)·무역흑자 131억5,987만달러, 11개 세부산업 전부 수출>수입 — 게임이 전체 수출의 60.4% 차지","매출 4강: 방송및영상(15.9%)·지식정보(15.7%)·출판(15.4%)·게임(15.2%)이 근소한 차이로 상위권 형성","★ 만화(웹툰)산업 매출, 경기도가 전년비 177.9% 급증한 1조5,554억원(45.4%)으로 서울(43.2%, △15.2%)을 처음 추월","다만 서울+경기 합산 비중이 만화산업 매출의 88.6%(2023년 84.1%)로 수도권 집중은 오히려 더 심화","국가승인통계(국가통계포털·문화셈터 게재)로, 정책 근거자료·경영계획·국제비교 등 공식 인용에 활용 가능"],"why":"경기도가 전국 웹툰산업 매출 1위로 올라섰다는 수치는 GCA 성과 홍보·의정보고·사업 타당성 논거로 즉시 활용 가능한 핵심 근거다. 다만 서울·경기 합산 집중도가 더 심화됐다는 이면은 비수도권 균형발전 관점의 지원사업 설계 논리로도 함께 쓸 수 있다. 국가승인통계라 예산·투자유치 자료에 인용해도 신뢰도 문제가 없다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158948/2011597.do?menuNo=204156","file":"2026-08-19/2024년 기준 콘텐츠산업조사_일반배포용_260703.pdf","_recent":true},{"id":"2026-08-05-kocca-spain-audiovisual","week":"2026-08-12","title":"한-스페인 시청각 콘텐츠 협력 전략: 공동제작, 제도·규제 체계 분석 및 KOCCA 협력 로드맵 연구 (스페인 26-03호)","issuer":"한국콘텐츠진흥원 스페인비즈니스센터","type":"해외 산업동향","published":"2026-08-05","pages":44,"size":"0.9MB","genres":["글로벌·수출","정책·산업","영상·방송"],"tags":["스페인","공동제작","EU문화협력의정서","SpainAudiovisualHub","웹툰트랜스미디어","FAST·CTV","IP권리확보"],"lede":"KOCCA 스페인 거점이 자체 협력 로드맵을 낸 드문 사례 — 양자 공동제작을 유럽 다자구조로","speakers":[{"name":"이사벨 세라노 마요","role":"마드리드 콤플루텐세 대학 교수","topic":"집필"},{"name":"알베르토 루이스 가르시아 가르시아","role":"마드리드 콤플루텐세 대학 교수","topic":"집필"},{"name":"변미영","role":"KOCCA 스페인비즈니스센터장","topic":"감수"}],"summary":"KOCCA 스페인비즈니스센터가 2025년 스페인 거점 개소를 계기로 마드리드 콤플루텐세 대학 교수 2인(이사벨 세라노 마요, 알베르토 루이스 가르시아 가르시아)에게 의뢰한 전략 컨설팅 보고서다. 통상의 시장동향 리포트와 달리 'KOCCA 협력 로드맵'을 스스로 제시한다는 점이 특이하다 — 문헌 72건(한국 40건·유럽·스페인 32건)을 비교분석해 양측 연구 관심사의 차이부터 짚는다. 한국 문헌은 경제·수출(25%)에, 유럽·스페인 문헌은 거버넌스·규제·통계(합계 43.8%)에 쏠려 있어, 협력전략이 서로 다른 정책 언어를 조율하는 데서 출발해야 함을 보여준다.\n\n산업 비교에서는 스페인이 2025년 423편(자국 통계 기준 376편, 국제공동제작 87편 포함)의 장편영화를 제작해 이탈리아·영국·프랑스를 제치고 유럽 최대 제작국(세계 6위)에 올랐다는 점, 100Mbps 이상 인터넷 보급률 94%·5G 96%로 원격제작 인프라가 우수하다는 점을 짚는다. 반면 한국은 웹툰 원천IP의 트랜스미디어 확장(2022년 웹툰 매출 1.8조원, 이 중 플랫폼 매출이 처음 1조원 돌파)과 콘텐츠 수출의 경제 파급효과(수출 1억 달러 증가시 GDP 7,824억원·간접고용 3,389명 창출)를 강점으로 든다.\n\n핵심은 결론부의 5대 협력전략이다. ①한·스페인 양자 공동제작을 EU-한국 문화협력 의정서 5조 요건(실사 2개국 이상·애니메이션 3개국 이상 참여)에 맞춰 프랑스·독일·이탈리아까지 포함한 다자 공동제작으로 전환해야 '유럽 작품' 지위(방송 편성의무·투자재원 혜택)를 얻을 수 있다는 것, ②글로벌 OTT가 제작비 전액을 부담하는 대신 IP를 통째로 가져가는 현재 계약구조 대신 공공-민간 공동투자로 IP를 지켜야 한다는 것, ③한국 웹툰 IP와 스페인의 VFX·가상제작 인프라를 결합한 트랜스미디어 공동개발, ④스페인에서 급성장하는 FAST·CTV 시장을 활용해 기존 한국 영화·드라마를 장르별 채널로 재유통하는 전략, ⑤Yamdu·MovieChainer 같은 SaaS로 공동제작의 계약·정산·권리관리를 표준화하는 것이다.","keypoints":["KOCCA 스페인센터가 학계에 의뢰한 '자체 협력 로드맵' 연구 — 통상적 시장동향과 달리 KOCCA가 무엇을 해야 하는지 제시","문헌비교: 한국 연구는 경제·수출(25%) 중심, 유럽은 거버넌스·규제·통계(43.8%) 중심 — 정책언어 자체가 다름","스페인 2025년 장편영화 423편 제작, 유럽 최대 제작국(세계6위)·인터넷보급 94%/5G 96%","한국 웹툰산업 2022년 매출 1.8조원, 플랫폼매출 최초 1조원 돌파 — 트랜스미디어 원천IP 경쟁력","콘텐츠수출 1억달러 증가시 GDP 7,824억원+간접고용 3,389명 파급효과(KOCCA 계량분석)","제언①: 양자 공동제작을 EU-한국 협정 5조 요건 맞춰 다자 공동제작으로 전환해야 '유럽작품' 혜택","제언②~⑤: 공동투자로 IP사수, 웹툰+VFX 트랜스미디어, FAST·CTV 유통, SaaS기반 공동제작 관리체계"],"why":"해외 비즈니스센터가 시장 소개에 그치지 않고 스스로 '협력 로드맵'을 제시한 드문 사례라, GCA가 해외 협력사업 제안서를 쓸 때 로드맵 구성 방식 자체를 참고할 수 있다. 특히 'IP를 지키는 공동투자 구조'와 'SaaS 기반 공동제작 관리'는 경기도 소재 제작사의 해외 공동제작 지원사업 설계에 바로 인용 가능하다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158950/2012346.do?menuNo=204160","file":"2026-08-12/[해외산업동향] 한-스페인 시청각 콘텐츠 협력 전략[스페인 26-03호].pdf","_recent":true},{"id":"2026-07-15-kocca-focus-215","week":"2026-08-12","title":"[KOCCA포커스 통권 215호] 2026년 2분기·3분기 콘텐츠산업 동향 및 경영체감도(CBI) 분석","issuer":"한국콘텐츠진흥원 정책연구본부 데이터정책팀","type":"이슈리포트","published":"2026-07-15","pages":22,"size":"2.7MB","genres":["정책·산업","게임","음악·공연","영상·방송","웹툰·만화"],"tags":["CBI","경영체감도","웹툰상장사","JTBC회생절차","엔터4사실적","게임양극화","불법유통차단"],"lede":"체감경기는 부정적인데 게임·엔터 실적은 최고치 — 산업별 CBI와 현장 수치가 어긋난다","speakers":[{"name":"한국콘텐츠진흥원","role":"정책연구본부 데이터정책팀","topic":"집필"}],"summary":"한국콘텐츠진흥원이 반기·분기 콘텐츠산업 실태조사와 동일 표본(11개 산업, 2,537개 사)을 대상으로 2026년 5월19일~6월18일 실시한 경영체감도(CBI) 조사 결과다. CBI는 매출·수출·투자·고용·자금사정 5개 항목을 7점 척도로 물어 200점 만점으로 환산한 지수로, 100점이 기준선(보통)이다.\n\n전체 콘텐츠산업의 2분기 체감 CBI는 99.9점으로, 앞서 낙관했던 전망치(100.3점)보다 부정적으로 나타났다 — 특히 매출·자금사정 부문이 전망을 밑돌았다. 반면 3분기 전망 CBI는 101.5점으로 전분기 대비 상승, '24년 4분기 이후 지속되는 낙관 흐름을 이어간다.\n\n산업별로 온도차가 뚜렷하다. 캐릭터산업은 전망(104.5)과 체감(98.8)의 격차가 -5.7점으로 전 산업 중 가장 컸다 — 기대가 컸던 만큼 실망도 컸다는 뜻이다. 실제로 캐릭터 산업 동향에서는 초저마진 유통구조(대원미디어 영업이익률 1.9%)와 살인적인 팝업스토어 대관료(백화점 매출의 20% 이상)가 짚였다. 음악산업은 반대로 체감(105.8)이 전망(103.3)을 웃돌았다 — 하이브 음반·음원 매출 +99%, JYP 영업이익 +70% 등 대형 엔터 4사 1분기 실적이 뒷받침한다. 게임산업은 체감 99.6점으로 중립적이지만 이면에는 극심한 쏠림이 있다 — 국내 상장 게임사 14곳 합산 영업이익의 73%를 넥슨·크래프톤 두 곳이 가져갔다(PUBG 분기 매출 최초 1조 원 돌파, 해외 비중 94~96%). 만화(웹툰) 산업은 글로벌 플랫폼 실적 부진(웹툰엔터 매출 -1.5%, 카카오픽코마 매출 -9%)의 영향으로 부정적으로 체감했다. 방송·영상산업은 JTBC 등 중앙그룹 5개사가 6월 회생절차를 신청하며 체감(98.5)이 전망(99.5)보다 낮았고, 국내 방송사업자 371곳 매출이 3년 연속 감소(방송광고 매출 -12.3%)한 배경이 있다.","keypoints":["26년 2분기 체감CBI 99.9점, 전망(100.3점) 밑돎 — 매출·자금사정 부문이 특히 부진","3분기 전망 CBI 101.5점으로 상승, '24년4분기부터 이어진 낙관세 지속","캐릭터산업 전망-체감 격차 -5.7점 최대 — 대원미디어 영업이익률 1.9%, 팝업스토어 대관료 매출20%+","음악산업 체감(105.8)>전망(103.3) — 하이브 음반매출+99%, JYP 영업이익+70%","게임산업 체감 중립(99.6)이나 넥슨·크래프톤 2곳이 14개 상장사 영업이익 73% 독식","만화(웹툰) 부정적 체감 — 웹툰엔터 매출-1.5%, 카카오픽코마 매출-9%(일본시장 성숙·대작부재)","방송영상 JTBC 등 중앙그룹 5개사 6월 회생절차 신청, 방송광고매출 3년연속감소(-12.3%)"],"why":"분기별 CBI 수치를 시계열로 인용할 수 있는 유일한 공식 지표라 정책보고서 통계 파트에 바로 쓸 수 있다. 특히 게임(대기업 쏠림)·캐릭터(초저마진 유통)·방송(중앙그룹 회생절차)의 구조적 어려움은 도내 중소 콘텐츠기업 지원사업의 필요성 근거로 활용 가능하다.","url":"https://www.kocca.kr/kocca/bbs/view/B0000141/2012172.do?menuNo=204145","file":"2026-08-12/[KOCCA포커스 통권 215호] [2026년 2분기·2026년 3분기] 콘텐츠산업 동향 및 경영체감도(CBI) 분석.pdf","_recent":true},{"id":"2026-07-08-kcti-ai-brief-26-4","week":"2026-08-12","title":"콘텐츠산업 동향 브리프 26-4호: AI 생성형 콘텐츠, 소비 경험에 따라 달라지는 인식","issuer":"한국문화관광연구원 콘텐츠연구본부 한류경제연구센터","type":"이슈리포트","published":"2026-07-08","pages":15,"size":"1.3MB","genres":["AI·기술","정책·산업"],"tags":["생성형AI","AI콘텐츠","소비자조사","저작권","허위조작정보","AI생성물표시의무화","콘텐츠소비행태"],"lede":"생성형 AI 콘텐츠, 능동적으로 찾아 쓰는 사람일수록 만족도·재소비 의향이 높다","speakers":[{"name":"김민채","role":"한국문화관광연구원 콘텐츠연구본부 한류경제연구센터 사업전문원","topic":"집필"}],"summary":"한국문화관광연구원이 <2025 콘텐츠 소비 현황과 전망 조사>의 부가조사로 실시한 AI 생성형 콘텐츠 소비 인식 연구다. 2025년 12월 전국 20~64세 2,000명을 대상으로 한 웹조사이며, 응답자를 소비 경험자(78.0%, 1,560명)와 비경험자(22.0%)로 나누고 경험자는 다시 직접 탐색해 찾아 쓰는 '능동 소비자'(47.4%)와 알고리즘·추천으로 접하는 '수동 소비자'(30.7%)로 구분해 비교했다는 점이 이 브리프의 핵심 설계다. 단순 이용률 집계에 그치지 않고 소비 방식에 따른 인식 차이를 계량화했다.\n\n소비 유형별로는 텍스트(73.1%)·이미지(55.8%) 경험률이 압도적으로 높고 영상(32.3%)·음악(24.6%)·오디오(13.1%)는 아직 낮지만, 향후 소비 의향은 이 세 유형 모두 현재 경험률보다 30%p 이상 높게 나타나 확산 여지가 크다. 만족도는 6점 척도에서 전 유형 4점을 넘겼고(텍스트 4.54점 최고), 모든 유형에서 능동 소비자가 수동 소비자보다 0.15~0.23점 더 만족했다. 종합 만족도는 능동 87.7% vs 수동 81.2%.\n\n우려 지점은 소비 방식에 따라 갈린다. 전체적으로는 허위·조작 정보(51.6%)가 압도적 1위지만, 능동 소비자는 저작권 문제(11.9%)에, 수동 소비자는 개인정보·초상권 침해(11.7%)와 책임 소재 불분명(10.1%)에 상대적으로 더 민감하다. 책임 주체 인식도 문제 유형별로 다르다 — 허위·조작 정보는 콘텐츠 제작자 책임(68.5%)이 압도적인 반면, 개인정보·저작권 문제는 제작자와 AI 기업 책임이 비슷한 비중으로 함께 높다(각각 47.4%/45.3%, 50.5%/44.6%). 정부 역할 필요성은 문제 유형과 무관하게 90% 안팎으로 높지만, 소비자가 원하는 조치는 이용 제한이 아니라 AI 생성물 표시 의무화(66.0%)와 허위·조작 탐지 기술 지원(62.6%)에 쏠려 있다 — 상업적 이용 제한(31.8%)·원저작자 보상 시스템(27.1%)은 오히려 낮다.\n\n보고서는 이를 바탕으로 정책 설계 시 소비 방식별 차등 접근과, 콘텐츠 제한보다 식별·투명성 중심 정책이 필요하다고 제언한다.","keypoints":["응답자 78.0%가 AI 생성형 콘텐츠 소비 경험, 능동 소비자 47.4% vs 수동 소비자 30.7%","텍스트·이미지 경험률 최고지만 영상·음악·오디오는 향후 소비의향이 경험률보다 30%p 이상 높음","능동 소비자 만족도가 전 유형에서 수동보다 0.15~0.23점 높음(종합 87.7% vs 81.2%)","최대 우려는 허위·조작정보(51.6%) — 능동은 저작권, 수동은 개인정보·책임소재에 민감","책임인식: 허위조작정보는 제작자 책임(68.5%) 집중, 개인정보·저작권은 제작자+AI기업 공동 책임","정책수요는 이용제한보다 AI생성물 표시의무화(66.0%)·탐지기술지원(62.6%)에 쏠림","정부역할 필요성은 문제유형 불문 90% 안팎으로 광범위"],"why":"GCA가 AI·콘텐츠 정책사업을 설계할 때 '이용 제한'보다 '표시·식별' 중심 정책이 더 높은 수용성을 갖는다는 실증 근거로 쓸 수 있다. 능동/수동 소비자 구분은 도민 대상 AI 리터러시 교육이나 창작지원사업의 타겟팅 논리에도 활용 가능하다.","url":"https://kcti.re.kr/web/board/boardContentsView.do?board_id=34&contents_id=8af1c8461b5d4fe880f71aa09280e3c6","file":"2026-08-12/콘텐츠산업 동향 브리프 26-4호 AI 생성형 콘텐츠 소비경험.pdf","_recent":true},{"id":"2026-08-05-mcst-h2-plan","week":"2026-08-10","title":"2026년 문화체육관광부 하반기 업무보고 — 지역을 살리고 세계로 넘실대는 K-문화","issuer":"문화체육관광부","type":"정부 업무보고","published":"2026-08-05","pages":14,"size":"0.7MB","genres":["정책·산업","글로벌·수출","영화","게임","음악·공연"],"tags":["업무보고","K컬처400조","정책금융","세액공제","문화AX","인디콘텐츠","패노메논","지역정주"],"lede":"K컬처 목표를 300조→400조로 상향, 수출 350억불→1,100억불. 정책금융도 소액 분산에서 대작 집중으로 전환","speakers":[{"name":"문화체육관광부","role":"2026.8.5 청와대 영빈관 업무보고","topic":"서면자료 14p · 발표자료 별첨"}],"summary":"8월 5일 청와대 영빈관에서 진행된 문체부 하반기 업무보고의 서면자료. 보도자료가 아니라 부처가 대통령에게 올린 문서라 목표 수치와 신규 사업이 연도까지 붙어 나온다. 내년 예산·사업 방향을 미리 읽는 용도로는 어떤 기관 리포트보다 앞선다.\n\n가장 큰 변화는 목표 상향과 'K컬처' 개념 자체의 재정의다. 시장규모 목표를 당초 300조 원에서 400조 원(’30년)으로, 수출 목표를 350억 불(50조)에서 1,100억 불(160조)로 올렸다. 동시에 K컬처를 기존 문화창조산업(콘텐츠+예술)에서 문화창조산업 + 라이프스타일산업(K푸드·뷰티·패션 수출) + 외래관광 수입으로 재정의했다. 목표가 세 배 가까이 뛴 데는 정의 확장이 상당 부분 작용한 셈이라 인용할 때 주의가 필요하다. 현재 규모는 205조(’23년)→274조(’25년), K컬처 수출액은 718억 불(’25년 잠정)로 반도체(1,734억 불)·자동차(720억 불)에 이어 수출 3위 품목으로 제시된다.\n\n산업 실무자에게 가장 직접적인 대목은 정책금융의 방향 전환이다. 건당 10억 원 수준의 소규모 투자에서 대작 IP·해외진출 전략투자(건당 30억 원 이상)로 전환한다고 명시했다. 세제는 현재 영상·웹툰에 적용되는 제작비 세액공제를 출판·게임·음악까지 확대 추진한다. 문화 AX 항목에서는 AI 활용 창·제작 지원과 콘텐츠 기업 맞춤형 AX 지원을 내걸고, 저작권 쪽으로 권리정보 유통플랫폼 구축과 AI 학습데이터 표준계약서(’26년 하반기)를 예고했다. 인력은 ’27~’30년 1.8만 명 양성.\n\n지원 대상이 양극으로 벌어지는 점도 눈여겨볼 만하다. 대작 투자로 무게를 옮기면서 반대편에 '인디콘텐츠 육성'을 따로 세웠다. 독립영화는 제작 확대와 온라인스트리밍 플랫폼 구축, 지역 영화생태계 조성(’27년 신규). 인디음악은 인디음악허브·지역인디축제 패키지지원(’27년 신규). 인디게임은 1인 개발자·소규모 게임사 제작지원 확대와 입주공간 지원. 만화·웹툰은 초기 창작지원 확대와 지역 작가 육성 시나리오 창작연습소 구축(’27년 신규). '지역'이 붙은 신규 사업이 셋이라 지자체 기관 입장에서는 내년 공모 대응 지점이다.\n\n장르별로는 영화·애니에서 중예산·국제공동제작 확대와 '제2의 케데헌' 애니 IP, 방송영상에서 K-OTT·FAST 글로벌 유통과 뉴미디어콘텐츠(유튜브 등) 지원(’27년 신규), 게임에서 글로벌 대작(’27년 신규)과 수출바우처·현지 베타테스트, 음악에서 중소기획사 글로벌 진출 지원과 지역공연 활성화를 통한 수도권 집중 완화, 출판에서 '한국형 해리포터' IP거래·2차저작화 지원(’27년 신규)을 제시한다. 별도로 「패노메논」이라는 대규모 K컬처 축제를 ’27년 12월부터 매년 국내·해외 각 1회 개최하고, ’28년 5월부터 해외 거점도시 페스티벌과 (가칭)K컬처센터를 조성한다는 계획이 붙었다.\n\n상반기 성과로는 5월 시행한 콘텐츠 불법유통 '긴급차단제'로 5.11~7.31 사이 921건을 차단하고 국내 최대 불법 웹툰사이트가 자진 폐쇄했다는 점, 중예산영화 제작지원을 ’25년 6편에서 ’26년 36편으로 늘린 점, 방한객 상반기 1,070만 명(+21.3%), '문화가 있는 날'을 월 1회에서 매주 수요일 '문화요일'로 확대해 문화향유 프로그램이 834건(3월)→4,756건(4월)으로 5.7배 늘어난 점을 든다. 고용효과 추산치도 실려 있다 — 콘텐츠 매출 100조 증가 시 일자리 7.3만 개, 외래객 1천만 증가 시 20만 개.","keypoints":["K컬처 시장규모 목표 300조→400조(’30년), 수출 목표 350억불→1,100억불(160조)로 상향","단 'K컬처' 정의를 라이프스타일산업(K푸드·뷰티·패션)+외래관광 수입까지 확장한 결과 — 인용 시 주의","K컬처 수출 718억불(’25 잠정)로 반도체·자동차 다음 수출 3위 품목","정책금융을 건당 10억 소액에서 대작IP·해외진출 건당 30억 이상 전략투자로 전환","제작비 세액공제를 현행 영상·웹툰에서 출판·게임·음악까지 확대 추진","AI 학습데이터 표준계약서 ’26년 하반기 마련, 권리정보 유통플랫폼 구축","'지역' 신규사업 3건(’27년): 지역 영화생태계 / 인디음악허브·지역인디축제 / 시나리오 창작연습소","「패노메논」 대규모 K컬처축제 ’27.12월~ 매년 국내·해외 각 1회, ’28.5월~ 해외거점 페스티벌","청년 지역 이탈 사유 1위는 문화·여가·소비 인프라 부족(49.3%)으로 일자리(45.8%)보다 높다","상반기: 불법유통 긴급차단 921건, 중예산영화 지원 6편→36편, 방한객 1,070만(+21.3%)"],"why":"내년 사업계획·예산 논리를 짤 때 가장 상위에 두어야 할 문서다. '지역' 딱지가 붙은 ’27년 신규사업 3건(지역 영화생태계·지역인디축제·시나리오 창작연습소)은 GCA가 대응할 공모 후보이고, 정책금융의 대형화 전환은 도내 중소 제작사 지원 논리를 다시 짜야 한다는 신호다. 청년 이탈 사유 1위가 일자리가 아니라 문화 인프라(49.3%)라는 인용은 지역 문화시설·정주여건 제안서의 도입부 근거로 강력하다. K컬처 400조·수출 3위 수치는 제안서에 자주 쓰이겠지만 정의가 바뀐 수치라는 점을 각주로 달아두는 편이 안전하다.","url":"https://www.mcst.go.kr/kor/s_notice/press/pressView.jsp?pSeq=22632","file":"2026-08-10/(260805) 문체부 하반기 업무보고 업무보고 서면자료.pdf","_recent":true},{"id":"2026-07-29-kofic-h1","week":"2026-08-06","title":"2026년 상반기 한국 영화산업 결산","issuer":"영화진흥위원회 정책본부 정책개발팀","type":"산업통계","published":"2026-07-29","pages":32,"size":"1.9MB","genres":["영화","정책·산업"],"tags":["박스오피스","극장매출","특수상영","IMAX","쇼박스","독립예술영화","관람요금"],"lede":"\"팬데믹 전 94% 회복\"은 한국영화 매출 한정 — 전체 매출은 69.0%, 관객은 56.5%에 머문다","speakers":[{"name":"김성희","role":"영화진흥위원회 정책본부 정책개발팀 객원연구원","topic":"집필"}],"summary":"영진위가 반기마다 내는 극장 결산 통계. 숫자 나열로 보이지만 올해 상반기는 해석이 갈리는 지점이 많아 원문을 볼 값어치가 있다.\n\n표면 숫자는 좋다. 상반기 전체 매출액 5,790억 원(+41.9%), 관객 수 5,705만 명(+34.2%)으로 크게 늘었고, 한국영화만 보면 매출 3,702억 원(+81.7%)·관객 3,737만 명(+74.9%)에 점유율도 매출 63.9%(+14.0%p)·관객 65.5%(+15.2%p)로 뛰었다. 언론이 인용한 '팬데믹 이전의 94.2% 회복'이 이 대목인데, 정확히는 한국영화 매출액에 한정된 수치다. 같은 기준으로 한국영화 관객 수는 78.1%이고, 시장 전체로 넓히면 매출은 2017~19년 상반기 평균(8,390억 원)의 69.0%, 관객은 평균(1억 99만 명)의 56.5%에 그친다. 관객 기준으로는 아직 팬데믹 전의 절반 남짓이라는 뜻이다.\n\n매출이 관객보다 빨리 회복되는 이유가 이 보고서의 핵심 정보다. 하나는 평균 관람요금 상승이고, 다른 하나는 특수상영 의존이다. 특수상영 매출 비중은 7.9%(+0.7%p)로 올랐고 그중 IMAX가 195억 원(+48.7%)으로 특수상영 매출의 42.5%를 차지했다. 외국영화에서 이 구조가 뚜렷하다. 미국영화는 관객이 0.8% 줄었는데도 매출은 9.1%(148억 원) 늘었는데, 흥행작들의 특수상영 매출 비중이 〈프로젝트 헤일메리〉 30.2%, 〈아바타: 불과 재〉 49.9%, 〈마이클〉 18.2%로, 전년 상위 3편(13.4%·10.7%·13.5%)의 두세 배 수준이다. 관객을 더 모으는 게 아니라 1인당 단가를 올려 매출을 지킨 셈이다.\n\n흥행 쏠림도 함께 봐야 한다. 〈왕과 사는 남자〉는 매출 1,631억 원·관객 1,691만 명으로 역대 매출액 1위(관객 수로는 〈명량〉 1,762만 명에 이어 2위)에 올랐고, 2024년 〈범죄도시4〉 이후 2년 만의 천만 영화다. 다만 보고서는 이 기록의 배경으로 전 연령대의 고른 지지와 함께 '개봉작 감소에 따른 경쟁작 부족'을 명시한다. 일일 박스오피스 1위를 59일간 지켰는데, 역대 관객 1위인 〈명량〉조차 23일이었다는 각주가 붙는다. 시장이 활발해서가 아니라 비어 있어서 생긴 장기 흥행이라는 뉘앙스다. 배급 편중도 심하다. 쇼박스가 〈왕과 사는 남자〉·〈군체〉(605억·574만)·〈살목지〉(333억·324만)·〈만약에 우리〉 4편으로 매출 2,814억 원, 점유율 48.6%를 차지하며 2~6월 5개월 연속 배급사 1위였다. 상반기 전체 흥행 1~3위가 모두 한 배급사 작품이다. 2위 월트디즈니컴퍼니코리아는 801억 원(13.8%)에 그쳤다.\n\n그 밖에 일본영화는 매출 199억 원(-25.7%)·관객 188만 명(-33.8%)으로 크게 빠졌고, 독립·예술영화 1위는 A24가 제작한 저예산 공포 〈백룸〉(124억 원·116만 명)이 차지했다. 인터넷 괴담을 소재로 한 페이크 다큐로 출발해 21세 유튜브 크리에이터 케인 파슨스가 연출한 작품이다. 국내작으로는 이명세 감독의 다큐 〈란 12.3〉(25억 원), 제주 4·3을 다룬 정지영 감독의 〈내 이름은〉(19.7억 원)이 뒤를 이었다. 2025년 〈노이즈〉에 이어 〈살목지〉·〈백룸〉까지 공포 장르가 연달아 흥행하면서, 보고서는 몰입감과 체험 요소를 갖춘 장르의 강세를 흐름으로 짚는다.","keypoints":["전체 매출 5,790억(+41.9%)·관객 5,705만(+34.2%). 다만 팬데믹 전 대비 매출 69.0%·관객 56.5%","'94.2% 회복'은 한국영화 매출 한정 수치 — 한국영화 관객은 78.1%, 시장 전체는 훨씬 낮다","매출이 관객보다 빨리 느는 이유는 관람요금 인상 + 특수상영 — IMAX 195억(+48.7%)","미국영화는 관객 -0.8%인데 매출 +9.1% — 흥행작 특수상영 비중이 전년의 2~3배","〈왕과 사는 남자〉 역대 매출 1위. 일일 1위 59일은 '개봉작 감소로 경쟁작 부족'이 배경(명량은 23일)","쇼박스 단독 점유율 48.6% — 상반기 흥행 1~3위가 모두 한 배급사","일본영화 매출 -25.7%·관객 -33.8%로 급락","독립·예술 1위는 A24 저예산 공포 〈백룸〉(21세 유튜버 연출) — 공포·체험형 장르 강세"],"why":"GCA 문서에서 '영화산업이 팬데믹 이전 수준을 회복했다'고 쓰면 틀린 인용이 되기 쉽다. 회복은 한국영화 매출에 한정되고 관객 기준은 절반 남짓이라는 구분을 이 보고서로 짚어둘 수 있다. 관람요금·특수상영에 기댄 매출 회복 구조와 배급 편중(1개사 48.6%)은 지역 영화·독립예술영화 지원의 필요성을 설명할 근거가 된다. 부천 등 영상 거점 사업 제안서의 시장 진단 파트에 바로 인용 가능.","url":"https://www.kofic.or.kr/kofic/business/board/selectBoardDetail.do?boardNumber=2&boardSeqNumber=74481","file":"2026-08-06/2026년 상반기 한국 영화산업 결산 보고서.pdf","_recent":true},{"id":"2026-08-03-kocca-france-ono","week":"2026-08-06","title":"프랑스 최대 로컬 웹툰 플랫폼 ONO의 비즈니스 모델, K-웹툰의 미래 (프랑스 26-05호)","issuer":"한국콘텐츠진흥원 프랑스비즈니스센터","type":"해외 산업동향","published":"2026-08-03","pages":23,"size":"1.3MB","genres":["웹툰·만화","글로벌·수출","정책·산업"],"tags":["ONO","프랑스웹툰","메디아파티시파시옹","현지공동창작","번역지원","불법유통","웹툰아카데미"],"lede":"현지 플랫폼 실무자가 직접 쓴 K-웹툰 진단 — \"일방향 공장식 수출로는 부족하다\"","speakers":[{"name":"이송현","role":"ONO Chief of Staff","topic":"집필"},{"name":"김문주","role":"KOCCA 프랑스비즈니스센터장","topic":"감수"},{"name":"이재현","role":"KOCCA 프랑스비즈니스센터 매니저","topic":"감수"}],"summary":"KOCCA 해외산업동향 시리즈지만 통상적인 시장 통계 보고서와 성격이 다르다. 집필자가 프랑스 웹툰 플랫폼 ONO의 Chief of Staff, 즉 K-웹툰을 수입해 파는 현지 사업자 본인이라 '해외 플랫폼 입장에서 본 K-웹툰'이라는 드문 시각이 담겼다.\n\nONO의 모회사 메디아-파티시파시옹은 1986년 설립된 프랑스-벨기에 미디어·출판 그룹으로 연매출 약 1조 3천억 원, 유럽 만화·망가·그래픽노블 부문 1위다. Dargaud·Dupuis·Le Lombard·Kana 등 40여 개 출판 라벨을 거느리고 「스머프」 「럭키 루크」 「나루토」 「데스노트」를 유통하며, 그룹 매출의 30% 이상이 만화에서 나온다. 여기에 애니메이션 제작사(Ellipse·Belvision), 게임 퍼블리셔 Microids, 보드게임 Iello, 라이선스 상품 Plastoy, 스트리밍 ADN·ONO, 테마파크 Parc Spirou까지 붙여 IP 360° 전략을 구성한다. ONO는 코로나 전후 한국 웹툰 플랫폼이 프랑스에서 빠르게 성장하는 것을 보고 만든 로컬 웹툰 플랫폼이다.\n\n보고서의 핵심은 마지막 시사점 장이다. 첫째, 현재 프랑스에 유통되는 한국 웹툰이 로맨스 판타지·이세계물 등 특정 장르와 반복 서사에 몰려 있다고 지적한다. 초기 진입에는 유효했지만 독자 피로도가 쌓이고 있으며, 이탈한 독자는 다른 웹툰 플랫폼이 아니라 쇼츠·릴스 같은 숏폼 영상으로 빠져나가 재유입이 구조적으로 어렵다는 것이다. 일상물·사회 비평·문학적 서사로 장르 스펙트럼을 넓혀야 한다고 본다. 둘째, 프랑스 독자에게 웹툰은 BD·망가와 달리 여전히 낯선 포맷이고 일부 취향층의 틈새 시장에 머물러 있다. 세분화 마케팅은 포맷 인지도가 확보된 다음 단계의 이야기이고, 지금 필요한 건 현지 작가와의 공동 창작이라는 진단이다. ONO는 웹툰 아카데미로 현지 창작 인력을 기르고 한불 공동 IP를 개발하는 것으로 이를 실행하고 있다.\n\n정책 제언도 구체적이다. 번역 지원을 일방향이 아니라 쌍방향(한국 작품의 해외 번역 + 현지 작품의 번역)으로 설계한 모델을 참고점으로 제시하고, 비용 보조에 그치지 말고 현지화 품질 관리 체계·전문 번역 인력 양성·현지 편집자 연계까지 구조를 강화해야 한다고 본다. 또 한국 콘텐츠를 일정 규모 이상 유통하는 현지 플랫폼·출판사에 공동 마케팅, 프로모션 비용 분담, 합작 프로젝트 보조금을 연계해 '계속 선택할 유인'을 만들자고 제안한다. 불법 유통 문제도 짚는데, 프랑스 내 망가·웹툰 불법 복제 트래픽이 이미 합법 플랫폼을 추월한 수준이며 한쪽이 단독으로 감당할 수 없으니 모니터링·신고·법적 대응의 비용과 정보를 양측이 나누는 체계가 필요하다고 본다.\n\n마지막으로 '현지 작가를 키우면 웹툰의 정체성이 희석되지 않느냐'는 우려에 대해, 망가에서 영감을 받은 서구 작가가 많아도 망가가 여전히 일본 고유의 시각 언어로 정의되는 것처럼 웹툰의 한국적 기원은 대체되지 않으며, 포맷 확산은 오히려 종주국의 문화적 영향력을 넓힌다고 반박한다.","keypoints":["집필자가 현지 플랫폼(ONO) 임원 — 수입하는 쪽에서 본 K-웹툰 진단이라 시각이 다르다","프랑스 유통 한국 웹툰이 로맨스판타지·이세계물에 편중 → 독자 피로 누적","이탈 독자는 다른 웹툰이 아니라 숏폼 영상으로 빠져나가 재유입이 구조적으로 어렵다","웹툰은 프랑스에서 아직 낯선 포맷 — 세분화 마케팅보다 현지 작가 공동창작이 먼저","번역 지원을 쌍방향 구조로 설계한 모델을 한국 지원체계의 참고점으로 제시","프랑스 내 망가·웹툰 불법복제 트래픽이 합법 플랫폼을 이미 추월 — 공동 대응 필요","모회사 메디아-파티시파시옹: 연매출 1.3조, 유럽 만화 1위, 출판→애니→게임→테마파크 IP 360°"],"why":"웹툰은 경기도 주력 장르이고 GCA도 관련 지원사업을 운영한다. '번역 비용 보조'에서 '현지화 품질관리·현지 편집자 연계'로 지원 범위를 넓히라는 제언, 그리고 현지 기업에 공동 마케팅·보조금을 붙여 지속 선택 유인을 만들라는 설계는 해외진출 지원사업 개편안에 바로 인용할 수 있다. 213호(수출 전환/지속 이원화)와 함께 읽으면 '지속' 단계 지원 논리가 구체화된다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158950/2012303.do?menuNo=204160","file":"2026-08-06/[프랑스 26-05호] 프랑스 최대 로컬 웹툰 플랫폼 ONO의 비즈니스 모델, K-웹툰의 미래.pdf","_recent":true},{"id":"2026-08-04-kocca-thai-blgl","week":"2026-08-06","title":"태국 BL/GL 콘텐츠 산업의 팬덤 경제와 글로벌 확장 전략 (태국 26-04호)","issuer":"한국콘텐츠진흥원 태국비즈니스센터","type":"해외 산업동향","published":"2026-08-04","pages":29,"size":"1.2MB","genres":["영상·방송","글로벌·수출","음악·공연"],"tags":["Y시리즈","BL","GL","팬덤경제","페어매니지먼트","공동제작","권리구조","팬투어리즘"],"lede":"3년 만에 매출 2.9배·아시아 BL 53%/GL 63% 점유 — 틈새 장르가 수출 산업이 된 구조 해부","speakers":[{"name":"이하얀","role":"한국외국어대학교 · 한국태국학회","topic":"집필"},{"name":"김철민","role":"KOCCA 태국비즈니스센터장","topic":"감수"}],"summary":"태국 Y-시리즈(BL·GL 통칭)가 대학 청춘물 틈새 장르에서 수출형 산업으로 올라선 과정을, 제작 시스템·팬덤 수익화·글로벌 유통·권리 구조까지 나눠 분석한 29쪽 보고서. 영상물에 한정하지 않고 원작 소설·출판, 배우 매니지먼트, 팬 커뮤니티, 공연·상품, 브랜드, 관광까지 산업 구조 전체를 다룬다.\n\n규모부터 확실하다. 제작사 매출이 2021년 약 14억 바트에서 2024년 약 42억 바트로 3년간 2.9배(연평균 42.4%) 늘었고, 시암상업은행 연구소는 태국 엔터 산업 내 Y-시리즈 비중이 2019년 0.7%에서 2025년 3.9%로 확대되며 시장 규모를 약 49억 바트로 추산했다. 2024년 기준 아시아 BL 시리즈의 53%, GL의 63%를 태국이 공급한다. 성장 궤적은 2014~16년 형성기(『Love Sick』 『SOTUS』, 배우 '페어' 문화 정착) → 2020년 『2gether』의 유튜브 확산으로 국제화 → 2020~22년 지역 정체성·사회문제·범죄액션 결합으로 외연 확대(『KinnPorsche』) → 2022~24년 GL의 독자 성장(『GAP』 『23.5』)으로 정리된다.\n\n수익화의 축은 팬덤이다. 배우 두 명을 작품 이후에도 공동 활동으로 장기 운영하는 '페어 매니지먼트'가 핵심이고, 팬미팅·콘서트·브랜드 협업·팬 관광이 뒤따른다. Vogue Business가 Launchmetrics로 측정한 수치로 Lingling Kwong의 Dior 활동 4,720만 달러, Rebecca Armstrong의 Chanel 활동 8,470만 달러 MIV를 소개하되, 이는 실제 매출이 아니라 미디어 노출 추정가치이므로 검색량·방문·쿠폰·예약과 함께 봐야 한다고 분명히 선을 긋는다. 팬 유통에 대한 관점도 실무적이다. 팬 번역·클립 편집이 초기 해외 진입 비용을 낮췄지만 저작권 침해와 오역도 함께 낳았으므로, 팬 활동을 전부 막기보다 공식 클립·자막 자료·2차 창작 지침으로 합법적 참여의 경계를 명시하고 방영 직후 공식 소재를 빠르게 뿌려 불법 재업로드 수요를 줄이라고 권한다. 플랫폼별 역할도 나눈다 — X는 방영 중 실시간 화제성, 틱톡은 신규 유입, 유튜브는 장기 아카이브, LINE·팬 커뮤니티는 공지와 티켓·상품 전달.\n\n권리 구조 장이 특히 실무적이다. 캐릭터와 배우 초상은 계약상 서로 다른 자산이라 제작사와 매니지먼트가 다르면 캐릭터 상품화권이 있어도 배우 이미지 사용권이 없을 수 있고, 영상화권 하나로 후속 사업 전체를 처리하면 안 되며 배급·기간·지역·속편·번역출판·웹툰·OST·공연·상품·게임·초상권을 나누고 미사용 권리의 회수 조건을 두라고 한다.\n\n한국 기업에 주는 결론은 '태국을 완성작 판매 시장이 아니라 협력 거점으로 보라'는 것. 한국이 원천 IP·기획·투자·후반제작·글로벌 판매를, 태국이 현지 각색·캐스팅·촬영·방송·배우와 팬덤 운영을 맡는 분업을 제시하며, 한국 웹툰·웹소설의 학원물·범죄·스릴러·판타지가 태국 BL/GL이 넓히는 장르와 접점이 크다고 본다. 현지화는 번역이 아니라 기획 단계에서 시작해야 하고, 파트너 실사는 흥행작 수가 아니라 권리·계약·회계·운영 능력을 확인하는 과정이어야 하며, 3~6개월짜리 짧은 파일럿(웹툰 티저·숏폼·리딩 영상)으로 반응을 본 뒤 장편과 공연·상품으로 넓히라고 권한다. 현지 창작자·배우 기여를 일회성 용역으로 처리하면 후속 시즌에서 관계가 끊긴다는 경고도 붙는다.","keypoints":["Y-시리즈 제작사 매출 2021년 14억 → 2024년 42억 바트(연 42.4% 성장), 아시아 BL 53%·GL 63% 점유","핵심 장치는 '페어 매니지먼트' — 배우 2인을 작품 종료 후에도 공동 활동으로 장기 운영","MIV·EMV는 미디어 노출 추정치일 뿐 — 검색·방문·쿠폰·예약과 함께 봐야 예산 근거가 된다","팬 2차창작을 전면 금지하지 말고 허용 범위를 예시로 명시 + 공식 소재를 빠르게 배포","캐릭터 상품화권과 배우 초상권은 별개 계약 — 상품·광고·공연에서 양쪽을 따로 확인해야","영상화권 하나로 후속사업을 묶지 말고 권리를 쪼개 미사용분 회수 조건을 둘 것","한국은 원천IP·기획·후반·글로벌판매 / 태국은 각색·캐스팅·촬영·팬덤운영 분업이 현실적","현지화는 번역이 아니라 기획 단계부터 — 3~6개월 파일럿으로 검증 후 확장"],"why":"장르 자체보다 '팬덤을 산업 구조로 만드는 법'이 참고 대상이다. 페어 매니지먼트·팬 이벤트·브랜드·관광을 하나의 일정과 권리표로 묶는 방식은 K-팝 외 장르에도 적용 가능하고, 권리 세분화(캐릭터권과 초상권 분리, 미사용 권리 회수 조건)는 213호가 지적한 'IP 패키징을 작품이 아니라 권리구조 관점으로'와 정확히 맞물린다. 공동제작 분업 모델은 해외 공동제작 지원사업 설계 시 역할 정의의 참고가 된다.","url":"https://www.kocca.kr/kocca/bbs/view/B0158950/2012321.do?menuNo=204160","file":"2026-08-06/2026년 태국콘텐츠산업동향 4호.pdf","_recent":true},{"id":"2026-07-23-kocca-forum","week":"2026-08-05","title":"2026 콘텐츠산업포럼 결과자료집","issuer":"문화체육관광부 · 한국콘텐츠진흥원","type":"포럼 발표자료","published":"2026-07-23","pages":57,"size":"5.9MB","genres":["정책·산업","AI·기술","게임","투자·금융","IP·공간"],"tags":["콘텐츠산업포럼","AX","UGC","인디게임","아레나","피지컬AI","K-콘텐츠"],"lede":"글로벌·IP·금융·AX 4개 세션 17개 발제 — 인디게임, K-뮤직, 전통IP, 공간비즈니스, 투자혹한기, AX까지","speakers":[{"name":"이상봉","role":"한국패션디자이너연합회 회장","topic":"패션 크리에이티브 산업과 'K' — 초청강연 (자료집에 표지만 수록)"},{"name":"송화준","role":"(재)아모레퍼시픽재단 사무국장","topic":"우리만의 아름다움으로 글로벌 문화를 만드는 K-뷰티 — 초청강연 (자료집에 표지만 수록)"},{"name":"신혜련","role":"명지대학교 디지털콘텐츠디자인학과 교수","topic":"글로벌 유저 패러다임 변화와 플랫폼 다각화를 통한 글로벌 도약"},{"name":"이유겸","role":"마운드미디어㈜ 유통부문대표","topic":"K-Music 스케일업: 로컬 디스트리뷰터 관점의 글로벌 진출"},{"name":"김남경","role":"메종 단하 대표","topic":"한국 전통 IP의 다각화: 글로벌 패션마켓의 신성장 동력"},{"name":"정현섭","role":"KRAFTON PUBG IP Franchise DIV. 팀장","topic":"PUBG SEONGSU — 게임 IP가 도시를 바꾼다"},{"name":"김인하","role":"CJ ENM PD","topic":"포맷을 만드는 공간, 공간을 만드는 포맷"},{"name":"이현명","role":"인스파이어 엔터테인먼트 리조트 이사","topic":"음악공연 그 이상, IP 체험과 공간 비즈니스"},{"name":"김창록","role":"㈜신세계 패션플랫폼팀 팀장","topic":"입는 IP에서 머무는 IP로 성장하는 패션"},{"name":"최연진","role":"The VC 애널리스트","topic":"콘텐츠 투자 트렌드 분석과 전망"},{"name":"박형태","role":"와프인베스트먼트 상무","topic":"K-콘텐츠 글로벌 도약 엔진: 정책 금융의 역할과 필요성"},{"name":"신동원","role":"DSC인베스트먼트 상무","topic":"플레이브·QWER 사례로 본 음악·엔터 투자 방정식 (자료집에 표지만 수록)"},{"name":"최연우","role":"디즈니+ 로컬 콘텐츠 총괄","topic":"K-콘텐츠, 성공을 넘어 확장으로 (자료집에 표지만 수록)"},{"name":"류정혜","role":"AI 미래포럼 공동의장","topic":"AI를 통한 콘텐츠 미래전략"},{"name":"장한용","role":"NC AI 실장","topic":"AI NPC 진화와 디지털 트윈: 엔터테인먼트를 넘어 산업 혁신으로"},{"name":"김유열","role":"EBS 사장","topic":"AI를 통한 방송의 가치혁신"},{"name":"김근재","role":"바이스벌사 대표","topic":"AI 시대의 패션, 옷이 아니라 콘텐츠를 파는 시대"}],"summary":"문체부·콘진원이 '세계를 감동시키고 경제를 움직이는 K-콘텐츠'를 주제로 3일간 연 포럼의 발표 녹취 자료집. 초청강연 2건과 글로벌·IP·금융·AX 4개 세션 15개 발제로 구성된다. 다만 17건 중 13건만 발표 전문이 실렸고, 초청강연 2건(이상봉·송화준)과 금융 세션 2건(DSC인베스트먼트 신동원, 디즈니+ 최연우)은 표지만 있으니 유의할 것.\n\n【글로벌 세션】 명지대 신혜련 교수는 인디·소규모 개발사의 부상을 데이터로 짚는다. Unity 프로젝트 개발기간 중앙값이 2022년 대비 2025년 약 77% 감소했고, 1~9인 팀의 65% 이상이 멀티플랫폼을 개발하며, 30달러 미만 PC 신작 매출은 2022년 대비 156% 늘었다. 로드컴플릿 〈레전드 오브 슬라임〉(누적 2,000억 원, 매출 98%가 해외)은 여러 MVP를 동시 출시해 지표가 좋은 것만 골라 키운 사례로 제시된다. 제언은 두 갈래 — 크로스플랫폼형 UGC 플랫폼 생태계를 국가가 인큐베이팅할 것, 그리고 지원사업을 제작비 보조에서 '노하우 중심 고도화'(프로젝트 아키텍처 설계, 글로벌 테스트, 라이브운영 전수)로 옮길 것. AI가 코드·아트를 뽑아줘도 프로젝트 전체의 컨텍스트를 유지하는 건 여전히 시니어의 설계 역량이라는 이유에서다. 마운드미디어 이유겸 대표는 K-POP이 아닌 'K-뮤직'(인디·비주류 장르)의 확산을 다룬다. 웨이브 투 어스는 월간 리스너가 2022년 40만 명에서 1,500만 명 이상으로 늘고 'seasons' 누적 5억 스트리밍, 북미 29개 도시 투어 전석 매진에 이르렀는데, 대규모 자본이나 미디어 노출 없이 틱톡 오가닉 바이럴이 스포티파이 알고리즘과 맞물린 결과였다. 유통사의 역할은 메타데이터 정비·태그 최적화로 '발견될 준비'를 갖춰주는 것이라고 정리한다. 메종 단하 김남경 대표는 2020년 블랙핑크 'How You Like That' 뮤직비디오 의상 이후 달라진 전통 IP 시장을 이야기한다. 전통 문양을 애슬레저에 얹은 라인이 해외에서 사실상 전량 완판됐고 파리 프랭탕 백화점 진출로 이어졌다. 요지는 전통을 박물관에 박제하지 말고 'OSMU형 전통 IP'로 현대의 언어와 연결하라는 것.\n\n【IP 세션 — 콘텐츠의 공간화】 크래프톤 정현섭 팀장은 PUBG SEONGSU를 소개한다. 9개 공간 중 3개를 상설 운영하고, 배틀그라운드 세계관을 살린 72석 PC방('플레이 아레나')을 두었으며, 게임처럼 알파→오픈베타→얼리액세스→런칭 단계를 오프라인 개관에 그대로 적용했다. 6개월간 방문객 12만 명, 지역·문화 행사 13회를 치렀고 성수동 젠트리피케이션을 의식해 공간을 무상 제공하는 사회공헌도 병행한다. 내부적으로는 'IP를 어디까지 확장할 수 있는지 실험하는 공간'으로 규정한다. CJ ENM 김인하 PD는 〈환승연애 4〉의 공간 설계를 공개한다. 4층 집을 골라 'X끼리 몰래 만날 공간'을 확보하되 시청자 혼선을 막으려 방마다 색을 부여해 캐릭터를 인지시켰고, 메인 거실 외에 '미니 거실'을 만들어 솔직한 대화를 유도했다. 섭외는 DM 1만 건 → 대면 인터뷰 1,000명 이상. 러닝타임을 1시간 줄이는 빠른 호흡으로 바꿔 유료 가입 기여도를 이전 대비 2배 이상 끌어올렸다. 인스파이어 이현명 이사는 국내 최초 라이브 전문 아레나(1.5만 석) 운영 관점을 전한다. 인천공항 2터미널 10분 거리로 아시아 주요 도시에서 4시간 내 도달 가능한 입지를 무기로 삼고, 슬로건은 '티켓이 아니라 추억을 판다'. 현재 약 1.7조 원인 한국 라이브 시장이 10년 내 3조 원 이상으로 커질 것으로 보면서, 암표 근절 기술·제도, 공연 인력 양성, 그리고 무엇보다 대중교통 인프라가 민간만으로는 안 되는 영역이라고 짚는다. 신세계 김창록 팀장은 공간 IP 브랜드 '하이퍼 그라운드'를 소개한다. 센텀시티 지하 2층 2,700평에서 물판 공간을 줄이고 체험·휴식으로 채운 뒤, 도쿄 시부야 109에서 거리를 통제한 런웨이에 한국 신진 브랜드 7개를 세우고, 파리 프랭탕에서 K-뷰티 14개 브랜드 팝업을 두 달간 열었다. 매스 고객을 백화점 VIP로 끌어올리고 신진 브랜드를 하이엔드로 키우는 가교가 사업 모델이다.\n\n【금융 세션】 The VC 최연진 애널리스트는 투자 혹한기의 구조를 짚는다. 100억 원 이상 빅딜 비중이 급증한 반면 초기 라운드 건수 점유율은 2024년 80%에서 올해 70% 이하로 떨어져, 자금이 소수 대형 딜과 AI로 쏠리고 있다. 콘텐츠 분야에서 살아남은 논리는 두 가지 — 흥행 예측 불가라는 약점을 IP 비즈니스로 상쇄하는 전략(투자 축이 웹툰·웹소설 원천 IP와 제작 스튜디오에서 K-팝 IP 기반 엔터테크로 이동), 그리고 제작 효율을 높이는 버티컬 크리에이티브 AI 툴이다. 와프인베스트먼트 박형태 상무는 정책금융을 정면으로 비판적으로 다룬다. 문체부가 2030년까지 콘텐츠 정책금융 공급을 5조에서 10조 원으로 상향 발표했고 2026년 모태펀드 1차 출자도 약 7,300억 원(문화부 몫 6,500억 원)으로 역대 최대다. 민간 출자 비율 53.4%로 마중물 역할은 확인되지만, 문제는 양적 확대가 아니라 그 돈이 산업의 필요한 곳으로 흐르느냐다. 운용사 선정을 수익률이 아니라 '산업 기여도' 지표로 재설정하고 정성평가 비중을 만들 것, 스케일업 펀드와 별개로 초기·기획개발 단계 IP에 재원이 가는 구조를 둘 것을 제안한다.\n\n【AX 세션】 AI 미래포럼 류정혜 의장은 '변방 콤플렉스'를 지적하며 기획 단계부터 Born to be Global로 가야 한다고 말한다. AI 시대의 기회를 IP 가치 증폭, 새 비즈니스 모델·플랫폼 출현, 제작 혁신(효율 40%+), 초개인화 경험 넷으로 정리하고, 해외 메가 이벤트를 유치만 할 게 아니라 우리 손으로 메가 K-팝 페스티벌 브랜드를 만들자고 제안한다. NC AI 장한용 실장은 피지컬 AI 시대일수록 콘텐츠가 더 중요해진다는 역설을 제시한다. 드론·라이다로 도시 규모 디지털 트윈을 복원하고 프롬프트로 3D 오브젝트를 생성하는 기술을 소개한 뒤, 육체노동이 대체되면 여가시간이 폭증하고 로봇·자율주행·서비스 로봇에 감정 교류용 디지털 휴먼 기술이 그대로 이식되어야 한다는 논리다. EBS 김유열 사장의 발제가 가장 구체적이다. 지상파 광고 총액이 20년 전 2.4조 원에서 5,500억 원 수준으로 무너지고 드라마 편당 제작비는 5~6천만 원에서 20~30억 원으로 뛴 구조를 짚은 뒤, 《블루오션 전략》을 인용해 '비용혁신과 가치혁신 동시 달성'을 목표로 삼아 AI 도입으로 장기 적자를 벗고 2년 연속 흑자를 냈다고 밝힌다. AI 조직을 자회사로 외주화하지 말고 본사에 내재화하라, 전 부서가 직접 AI 콘텐츠를 만들어 마인드부터 리셋하라는 것이 실행 처방이다. 바이스벌사 김근재 대표는 패션 AX를 브랜드 DNA 학습 → AI 에이전트 → 멀티 에이전트 → 온톨로지 4단계로 정리한다. 프롬프트만으로 만든 결과물은 브랜드가 쓸 수 없더라는 현장 경험이 출발점이며, 자라가 6천여 매장 판매 데이터로 재고 낭비율을 연 50% 낮춘 사례를 들어 '지금 쌓는 데이터의 질과 구조가 1년 뒤 격차를 만든다'고 맺는다.","keypoints":["[게임] 개발기간 77% 단축·1~9인 팀의 65%가 멀티플랫폼 — 지원을 제작비 보조에서 '노하우 전수형'으로 전환하라는 제언","[음악] 웨이브 투 어스 월간 리스너 40만→1,500만 명. 자본·미디어 없이 틱톡 바이럴×스포티파이 알고리즘","[전통IP] 블랙핑크 한복 이후 전통은 보존 대상이 아니라 OSMU형 IP — 파리 프랭탕까지 진출","[공간] PUBG SEONGSU 6개월 12만 명. 게임처럼 알파→베타→런칭 단계를 오프라인 개관에 적용","[방송] 〈환승연애 4〉 방마다 색을 부여해 캐릭터 인지, 러닝타임 1시간 단축 → 유료가입 기여도 2배","[공연] 한국 라이브 시장 1.7조 → 10년 내 3조. 병목은 베뉴가 아니라 대중교통·인력·암표","[투자] 초기 라운드 건수 비중 80%(2024)→70% 이하. 자금은 빅딜과 AI로 쏠리고 콘텐츠는 IP·엔터테크로 이동","[정책금융] 2030년까지 10조 원으로 상향. 양적 확대보다 운용사 선정을 '산업 기여도' 지표로 재설계해야","[AX] EBS, AI로 비용·가치 혁신 동시 추구해 2년 연속 흑자. AI 조직은 외주화 말고 본사 내재화","[AX] 피지컬 AI 시대엔 여가시간 폭증·로봇 인터랙션 수요로 콘텐츠 시장이 오히려 커진다"],"why":"GCA 사업기획 관점에서 바로 쓸 재료가 많다. 신혜련 교수의 '제작비 보조에서 노하우 전수형으로'와 박형태 상무의 '운용사 선정을 산업 기여도 지표로'는 지원사업 개편 논의에 그대로 인용할 수 있는 제언이다. IP 세션 4건(PUBG SEONGSU·환승연애4·인스파이어·하이퍼그라운드)은 지역 거점·복합공간 제안서의 벤치마크가 되고, 특히 이현명 이사가 짚은 '병목은 베뉴가 아니라 대중교통·인력·암표'는 공연장 유치 논의에서 지자체 몫을 설명할 때 유용하다. 발제자 17인의 소속·주제가 그대로 정리돼 있어 향후 포럼·간담회 연사 풀로도 쓸 수 있다.","url":"https://www.kocca.kr/kocca/bbs/view/B0000180/2012236.do?menuNo=204164","file":"2026-08-05/2026 콘텐츠 산업포럼_결과자료집.pdf","_recent":true},{"id":"2026-07-09-kocca-focus-214","week":"2026-08-05","title":"한류산업 수출의 경제 효과 (KOCCA 포커스 통권 214호)","issuer":"한국콘텐츠진흥원 정책연구본부","type":"이슈리포트","published":"2026-07-09","pages":27,"size":"1.6MB","genres":["정책·산업","글로벌·수출"],"tags":["한류산업진흥기본법","생산유발효과","취업유발","중력모형","K-뷰티","관광"],"lede":"한류 수출 1억 달러가 생산 7,824억 원·고용 3,389명을 만든다 — 4차 추정 결과와 계수 반등의 이유","speakers":[{"name":"김윤지","role":"한국콘텐츠진흥원 원장","topic":"공동 저자"},{"name":"염정완","role":"한국콘텐츠진흥원 정책연구본부 미래정책팀","topic":"공동 저자"}],"summary":"2012년·2019년·2022년에 이은 네 번째 한류 수출 경제효과 추정 연구다. 2006~2024년 6개 지역(중화권·일본·동남아·북미·유럽·기타)의 한류산업 수출액과 연관산업 수출액으로 패널 데이터를 구성해 중력모형 기반 고정효과 회귀분석을 수행했다. 핵심 결과는 한류산업 수출 1억 달러 증가가 한류 연관산업 수출 2.02억 달러를 견인하고, 국내 생산유발액 총 5.7억 달러(7,824억 원)와 취업유발인원 3,389명을 발생시킨다는 것. 이 5.7억 달러는 한류산업 자체 생산유발 1.7억 달러와 연관산업 생산유발 4.0억 달러의 합이며, 취업유발 3,389명도 콘텐츠 1,251명 + 연관산업 2,138명으로 분해된다. 주목할 점은 견인계수의 추세다. 1차 연구 4.12배 → 2차 2.48배 → 3차 1.80배로 계속 낮아지다가 이번에 2.02배로 반등했는데, 하락의 원인은 국내 전자기업이 스마트폰 해외생산 비중을 80% 이상으로 늘리면서 IT기기 수출이 연평균 6.3% 감소한 데 있고, 반등은 「한류산업진흥 기본법」 취지를 반영해 관광 수출을 연관산업에 새로 포함한 결과다. 품목별로는 한류산업 수출 1억 달러당 IT기기 1.05억, 화장품 0.73억, 의류 0.17억, 식품 0.15억 달러가 증가한다. 관광은 코로나로 데이터가 분절돼 단일 품목으로는 유의하지 않았다. 배경 통계도 충실하다. 2025년 콘텐츠 수출은 149.1억 달러(전년 대비 +5.9%)로 음악 +32.4%, 영화 +19.9%, 캐릭터 +12.8%가 성장을 견인한 반면 콘텐츠솔루션 -10.3%, 애니메이션 -7.6%, 출판 -3.1%은 감소했다. 게임이 여전히 57.7%로 절대 비중이고 게임·음악·방송영상 3개가 82.8%를 차지한다. 콘텐츠 수출액은 우리나라 총수출의 2.1%로 이차전지·가전·섬유·컴퓨터보다 크고 바이오헬스보다 작은 12번째 규모 품목이다. 2026년 세계 콘텐츠 시장은 2조 4,281억 달러(+5.6%) 전망이며 미·중이 60%를 점유하고, 한국은 세계 8위지만 연평균 성장률이 3.46%로 낮아 수출 확대가 성장 과제로 지목된다.","keypoints":["한류산업 수출 1억 달러 → 연관산업 수출 2.02억 달러 견인, 생산유발 5.7억 달러(7,824억 원), 취업유발 3,389명","견인계수 4.12 → 2.48 → 1.80 → 2.02배. 하락은 IT기기 해외생산 탓, 반등은 관광 포함 효과","2025년 콘텐츠 수출 149.1억 달러(+5.9%). 음악 +32.4%, 영화 +19.9%","콘텐츠 수출은 총수출의 2.1%, 바이오헬스 다음가는 12번째 주요 수출 품목","한국 콘텐츠 시장은 세계 8위지만 CAGR 3.46%로 저성장 — 내수로는 한계","「한류산업진흥 기본법」(2025.4 시행)이 관광·화장품·식품·전통문화상품을 연관산업으로 법제화"],"why":"지자체·기관 제안서에서 콘텐츠 지원사업의 경제효과를 주장할 때 인용할 공식 계수가 갱신됐다. 특히 '1억 달러 수출 → 7,824억 원 생산유발·3,389명 고용'은 예산 논리로 그대로 쓸 수 있는 숫자다. 부천시 협력사업처럼 지역 단위 제안서에서도 콘텐츠→관광·소비재로 이어지는 파급 논리의 근거가 된다.","url":"https://www.kocca.kr/kocca/bbs/view/B0000141/2012133.do?menuNo=204145","file":"2026-08-05/[KOCCA포커스 통권 214호] 한류산업 수출의 경제 효과.pdf","_recent":true},{"id":"2026-06-29-kocca-focus-213","week":"2026-08-05","title":"콘텐츠 기업의 수출은 어떻게 시작되고 지속되는가 (KOCCA 포커스 통권 213호)","issuer":"한국콘텐츠진흥원 정책연구본부","type":"이슈리포트","published":"2026-06-29","pages":26,"size":"1.0MB","genres":["정책·산업","글로벌·수출"],"tags":["수출전환","수출지속","지원사업설계","IP패키징","현지화인력","이질적기업무역이론"],"lede":"수출을 시작하게 하는 역량과 이어가게 하는 역량은 다르다 — 지원사업 이원화의 실증 근거","speakers":[{"name":"염정완","role":"한국콘텐츠진흥원 정책연구본부 미래정책팀 책임연구원","topic":"공동 저자"},{"name":"유정호","role":"국립부경대학교 국제통상학부 부교수","topic":"공동 저자"}],"summary":"통계청 기업활동조사 2006~2024년 패널로 콘텐츠 기업(출판·영상오디오·방송 등)의 수출 참여·전환·지속 결정 요인을 분리 분석한 연구. 문제의식이 날카롭다. 내수기업이 수출기업으로 전환하는 비율은 8.4%에 불과하고, 수출을 시작한 기업의 31.6%는 이듬해 수출을 중단한다. 지원사업 체계가 이미 수출 역량 강화를 지향하고 있는데도 왜 이 간극이 생기는가에 대한 답이 이 연구의 핵심이다. 결론은 '수출을 시작하게 만드는 역량과 이어가게 만드는 역량이 구조적으로 다르다'는 비대칭성이다. 수출 전환 단계에서 유의한 변수는 기업 규모·무형자산(IP)·R&D 인력 보유·해외 자본 보유였고, 생산성과 광고비는 유의하지 않았다. 반대로 수출 지속 단계에서는 기업 규모·기업 생산성·광고비가 유의해지고, 전환 단계의 핵심이던 무형자산·R&D 인력·해외 자본의 효과는 사라진다. 특히 R&D 인력을 보유한 기업은 미보유 기업보다 수출 전환 확률이 5.8%p 높은데, 이는 평균 전환율 8.4%의 약 70%에 해당하는 큰 폭이다. 이론적 배경으로는 Melitz(2003)의 이질적 기업 무역이론을 가져온다. 수출은 학습의 결과가 아니라 원래 우수한 기업이 고정비용을 감당할 수 있어 선택하는 '자기선택'의 성격이 강하다는 것. 콘텐츠 산업의 고정비용은 번역·자막·더빙·판권 정리·국제계약·플랫폼 등록·현지 규제 대응·해외 마케팅으로 구체화된다. 정책 제언이 매우 실무적이다. 전환 단계에는 ①IP 패키징 지원 강화(장르·작품 단위를 넘어 2차 저작물 권리 정비, IP 포트폴리오 구조화, 국제 표준계약서 연계) ②현지화 전문인력 양성(번역·현지 문화 전문가·플랫폼 알고리즘 대응) ③비즈매칭의 일회성 탈피(다년도 파트너십, U-KNOCK 확대) ④콘텐츠 단위 지원을 기업 성장과 연계(동일 기업 다년도 지원 누적 관리). 지속 단계에는 ①마케팅 지원을 단계별로 재설정(수출 중 기업에는 해외 집행 증빙 연계 조건부 지원) ②생산성은 직접 개입 대신 수출보증·세액공제 등 간접 지원 ③수출 이탈 조기 모니터링 체계 도입을 제안한다. 한계도 명시한다. 기업활동조사가 50인 이상 또는 자본금 3억 원 이상만 포함해 콘텐츠산업 다수를 차지하는 영세·중소기업이 빠지고, 직접 수출만 잡혀 라이선스·로열티·플랫폼 수익이 제외된다.","keypoints":["내수→수출 전환율 8.4%, 수출 시작 기업의 31.6%가 이듬해 중단","전환 요인: 기업규모·무형자산(IP)·R&D 인력·해외자본 / 지속 요인: 기업규모·생산성·광고비","R&D 인력 보유 시 수출 전환 확률 +5.8%p (평균 전환율의 70% 수준)","현행 지원사업 대부분이 수출 단계를 구분하지 않아 효과가 희석됨 → 이원적 설계 필요","IP 패키징은 작품 단위가 아니라 권리구조 정비·포트폴리오 구조화 관점으로 전환해야","비즈매칭 일회성 한계 → 다년도 파트너십·공동제작으로 지속 관계 설계"],"why":"이번 주 3건 중 기획조정팀 실무에 가장 직접적이다. '전환 지원과 지속 지원을 나눠 설계하라'는 결론은 GCA 지원사업 개편·성과지표 설계 논의에 그대로 인용 가능하고, 비즈매칭 일회성 지적과 다년도 파트너십 제안은 마켓 참가 지원사업의 개선 근거가 된다. 다년도 지원 누적 관리·이탈 모니터링은 사업 관리체계 제안으로도 쓸 수 있다.","url":"https://www.kocca.kr/kocca/bbs/view/B0000141/2012072.do?menuNo=204145","file":"2026-08-05/[KOCCA포커스 통권 213호] 콘텐츠 기업의 수출은 어떻게 시작되고 지속되는가_콘텐츠 기업 수출 결정 요인 분석.pdf","_recent":true},{"id":"2026-05-27-kocca-focus-212","week":"2026-08-05","title":"콘텐츠산업 종사자가 생성형 AI 이용 시 주의할 법률 쟁점 (KOCCA 포커스 통권 212호)","issuer":"한국콘텐츠진흥원 콘텐츠산업정책연구센터","type":"이슈리포트","published":"2026-05-27","pages":19,"size":"0.8MB","genres":["AI·기술","정책·산업"],"tags":["인공지능기본법","EU AI Act","투명성의무","워터마크","딥페이크","표시의무"],"lede":"AI 표시의무, 한국은 아직 '이용자' 예외지만 EU는 아니다 — 서비스·결과물 유형별 표시 방법 정리","speakers":[{"name":"권구민","role":"한국콘텐츠진흥원 산업정책팀 책임연구원","topic":"공동 저자"},{"name":"박만수","role":"한국콘텐츠진흥원 산업정책팀 책임연구원","topic":"공동 저자"},{"name":"유재규","role":"법무법인(유한) 태평양 변호사","topic":"공동 저자"}],"summary":"2026년 1월 22일 시행된 「인공지능 발전과 신뢰 기반 조성 등에 관한 기본법」(인공지능기본법)과 EU AI Act를 콘텐츠 실무자 관점에서 해설한 보고서. 가장 실무적으로 중요한 지점은 적용 대상의 차이다. 한국 인공지능기본법은 '인공지능사업자'가 적용 대상이라, AI를 활용해 만든 결과물을 제품·서비스로 제공하는 콘텐츠 기업은 '이용자'에 해당해 현재는 법상 의무를 지지 않는다. 반면 EU AI Act는 개인적·비직업적 사용을 제외하고 업무상 AI 시스템을 사용하는 자를 'deployer(배포자)'로 규정해 투명성 의무를 부과하므로, 유럽 대상 서비스라면 국내 기준만 보고 안심하면 안 된다. 다만 국내에서도 온라인 플랫폼에 AI 생성물을 게시할 때 게시자가 AI 생성물임을 표시하도록 의무화하는 'AI 생성물 표시제' 도입이 발표됐고 정보통신망법 개정안이 발의돼 있어, 규제 공백은 곧 닫힐 전망이다. 보고서의 실용적 가치는 서비스 유형별·결과물 유형별 표시 방법을 표로 정리한 부분에 있다. 서비스별로는 대화 기반 서비스(초기 안내 또는 지속 로고, 반복 표시 불필요), 음성 어시스턴트(이용 전 음성·화면 안내, 실물 제품은 겉면 표시), 게임·메타버스(AI가 구성요소로 포함된 경우가 대상이며 AI 캐릭터·NPC임을 이름이나 초기 대화에서 안내), 생산성 향상 서비스(이용화면 로고 표출)로 나뉜다. 결과물별로는 텍스트(머리말·메타데이터, 코드는 주석이나 .md 명시), 이미지(로고 삽입 등 가시적 방법 또는 디지털 워터마킹), 동영상(화면 일부 로고 또는 시작부 안내), 음성(시작부 멘트, 재생 전체 표시 불필요)으로 구분되며, 비가시적 방법만 쓴 경우 다운로드 시 1회 이상 별도 안내가 필요하다는 조건이 붙는다. 광고·표시 규제도 함께 다룬다. 가상 인물이 등장하는 추천·보증 광고는 가상 인물 근처에 '가상 인물' 문구를 표시해야 하고, AI로 생성한 가상 음향·이미지·영상을 활용해 전문가가 의료기기를 보증·추천하는 것처럼 오인하게 하는 광고를 금지하는 의료기기법 개정안이 2026년 5월 7일 국회 본회의를 통과해 공포 6개월 후 시행된다. 결론은 향후 플랫폼·서비스 특성에 맞춘 맞춤형 표시 체계와 UI/UX 설계 역량이 경쟁력이 되며, 업계 공통 가이드라인과 산업 표준화 논의가 확대돼야 한다는 것이다.","keypoints":["한국 인공지능기본법(2026.1.22 시행)은 'AI사업자'만 대상 — AI 결과물을 서비스로 제공하는 콘텐츠 기업은 '이용자'로 현재 의무 없음","단, EU AI Act는 업무상 사용자를 'deployer'로 보아 투명성 의무 부과 — 유럽 대상 서비스는 별도 대응 필요","국내도 'AI 생성물 표시제' 도입 발표 + 정보통신망법 개정안 발의 — 규제 공백은 임시적","서비스별(대화/음성/게임·메타버스/생산성)·결과물별(텍스트/이미지/동영상/음성) 표시 방법이 표로 정리됨","비가시적 표시(워터마크·메타데이터)만 쓰면 다운로드 시 1회 이상 별도 고지 필요","가상 인물 광고는 '가상 인물' 문구 표시 의무, 의료기기법 개정안 2026.5.7 국회 통과"],"why":"AI 활용 콘텐츠 제작 지원사업이나 기관 자체 홍보물에 생성형 AI를 쓸 때 바로 참조할 체크리스트다. 특히 서비스·결과물 유형별 표시 방법 표는 사업 공고문의 준수사항이나 참여기업 가이드로 옮겨 쓰기 좋다. 3개월 경계선(5/27)에 걸쳐 있어 이번 주가 지나면 최신 목록에서 빠지므로 지금 챙겨둘 것.","url":"https://www.kocca.kr/kocca/bbs/view/B0000141/2011828.do?menuNo=204145","file":"2026-08-05/[KOCCA포커스 통권 212호] 콘텐츠산업 종사자가 생성형 AI 이용 시 주의할 법률 쟁점.pdf","_recent":true}],"genres":["정책·산업","글로벌·수출","AI·기술","게임","IP·공간","투자·금융","음악·공연","영상·방송","영화","웹툰·만화"],"genreOrder":["정책·산업","글로벌·수출","AI·기술","게임","IP·공간","투자·금융","음악·공연","영상·방송","영화","웹툰·만화","패션·뷰티"]}</script>
<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const FOLDER = 'E:\\클로드백업\\contents report\\';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = { q:'', genre:null, allOpen:false };

document.getElementById('m-upd').textContent = D.updated;
document.getElementById('m-cnt').textContent = D.reports.length;

const gc = document.getElementById('gchips');
gc.innerHTML = D.genres.map(g =>
  `<button class="chip" type="button" data-g="${esc(g)}" aria-pressed="false">${esc(g)}</button>`).join('');
gc.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  state.genre = (state.genre === b.dataset.g) ? null : b.dataset.g;
  [...gc.children].forEach(c => c.setAttribute('aria-pressed', String(c.dataset.g === state.genre)));
  render();
});

const qi = document.getElementById('q');
qi.addEventListener('input', () => { state.q = qi.value.trim().toLowerCase(); render(); });

const ta = document.getElementById('toggleAll');
ta.addEventListener('click', () => {
  state.allOpen = !state.allOpen;
  ta.textContent = state.allOpen ? '내용 모두 접기' : '내용 모두 펼치기';
  render();
});

function hay(r){
  return [r.title, r.lede, r.issuer, r.type, r.summary, r.why, r.published, r.week,
          ...(r.tags||[]), ...(r.genres||[]), ...(r.keypoints||[]),
          ...(r.speakers||[]).flatMap(s => [s.name, s.role, s.topic])].join(' ').toLowerCase();
}
function match(r){
  if (state.genre && !r.genres.includes(state.genre)) return false;
  if (!state.q) return true;
  const h = hay(r);
  return state.q.split(/\s+/).every(t => h.includes(t));
}
function spkShort(r){
  const s = r.speakers || []; if (!s.length) return '<em>—</em>';
  return s.length === 1 ? esc(s[0].name)
       : `${esc(s[0].name)} <em>외 ${s.length - 1}인</em>`;
}

function rows(r){
  const open = state.allOpen;
  return `<tr class="row${open?' open':''}" data-id="${esc(r.id)}" tabindex="0" role="button"
              aria-expanded="${open}" aria-controls="d-${esc(r.id)}">
    <td class="c-date"><span class="mono">${esc(r.week)}</span></td>
    <td><span class="kind" data-t="${esc(r.type)}">${esc(r.type)}</span></td>
    <td><div class="ttl">${esc(r.title)}</div><div class="lede">${esc(r.lede || '')}</div></td>
    <td class="issuer">${esc(r.issuer)}</td>
    <td class="spk">${spkShort(r)}</td>
    <td><span class="mono">${esc(r.published)}</span></td>
    <td><a class="open-link" href="${esc(r.url)}" target="_blank" rel="noopener"
           onclick="event.stopPropagation()">원문 열기 ↗</a></td>
    <td><span class="x" aria-hidden="true">${open?'−':'+'}</span></td>
  </tr>
  <tr class="det${open?' on':''}" id="d-${esc(r.id)}"><td colspan="8"><div class="detin">
    <div>
      <p class="dh">핵심 포인트</p>
      <ul class="kp">${(r.keypoints||[]).map(k => `<li><span>${esc(k)}</span></li>`).join('')}</ul>
    </div>
    <div>${r.why ? `<p class="dh">업무 활용 포인트</p><p class="why">${esc(r.why)}</p>` : ''}</div>
    <div class="dfull">
      <p class="dh">내용 요약</p>
      <div class="dsum">${String(r.summary).split(/\n{2,}/)
        .map(p => `<p>${esc(p.trim())}</p>`).join('')}</div>
    </div>
    ${(r.speakers||[]).length > 1 ? `<div class="dfull">
      <p class="dh">발표자 · 저자 ${r.speakers.length}인</p>
      <ul class="spk-list">${r.speakers.map(s => `<li>
        <div class="spk-name">${esc(s.name)}<span>${esc(s.role)}</span></div>
        <div class="spk-topic">${esc(s.topic)}</div></li>`).join('')}</ul></div>` : ''}
    <div class="filerow">
      <button class="copy" type="button" data-copy="${esc(r.file)}">내 PC 파일 경로 복사</button>
      <span class="path mono">${esc(r.file)}</span>
      <span class="mono" style="color:var(--ink-3)">${r.pages}p · ${esc(r.size)}</span>
      <span class="tags">${(r.tags||[]).map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</span>
    </div>
  </div></td></tr>`;
}

const HEAD = `<colgroup><col class="c-date"><col class="c-kind"><col><col class="c-issuer">
  <col class="c-spk"><col class="c-pub"><col class="c-link"><col class="c-x"></colgroup>
  <thead><tr><th>수집일</th><th>구분</th><th>제목 · 요지</th><th>발간주체</th>
  <th>발표자 · 저자</th><th>발간일</th><th>원문</th><th></th></tr></thead>`;

function table(label, note, list){
  return `<table><caption><span class="ct serif">${esc(label)}</span>
    <span class="cn mono">${esc(note)}</span></caption>
    ${HEAD}<tbody>${list.map(rows).join('')}</tbody></table>`;
}

function render(){
  const vis = D.reports.filter(match);
  document.getElementById('cnt').textContent =
    (state.q || state.genre) ? `${vis.length} / ${D.reports.length}건` : `${D.reports.length}건`;

  const recent = vis.filter(r => r._recent), old = vis.filter(r => !r._recent);
  let html = '';

  for (const w of [...new Set(recent.map(r => r.week))].sort().reverse()){
    const rs = recent.filter(r => r.week === w);
    const dd = new Date(w + 'T00:00:00');
    html += table(`${dd.getFullYear()}년 ${dd.getMonth()+1}월 ${dd.getDate()}일 수집분`,
                  `${rs.length}건`, rs);
  }

  const gi = g => { const i = D.genreOrder.indexOf(g); return i < 0 ? 99 : i; };
  const gs = [...new Set(old.flatMap(r => r.genres))].sort((a,b) => gi(a)-gi(b) || a.localeCompare(b,'ko'));
  for (const g of gs) html += table(g, `수집 4주 경과 · ${old.filter(r => r.genres.includes(g)).length}건`,
                                    old.filter(r => r.genres.includes(g)));

  if (!vis.length){
    html = `<p class="empty">검색 결과가 없습니다. 다른 키워드를 쓰거나 장르 필터를 해제해 보세요.</p>`;
  } else if (!old.length){
    html += `<p class="empty">수집한 지 4주가 지난 리포트는 위 주차 표에서 빠져
      장르별 표로 따로 모입니다. (${D.cutoff} 이전 수집분부터 · 현재 해당 없음)</p>`;
  }
  document.getElementById('main').innerHTML = html;
}

/* ---- 행 펼치기 ---- */
function toggle(row){
  const det = document.getElementById('d-' + row.dataset.id);
  const on = det.classList.toggle('on');
  row.classList.toggle('open', on);
  row.setAttribute('aria-expanded', String(on));
  row.querySelector('.x').textContent = on ? '−' : '+';
}
document.addEventListener('click', e => {
  if (e.target.closest('a,[data-copy]')) return;
  const row = e.target.closest('tr.row'); if (row) toggle(row);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const row = e.target.closest && e.target.closest('tr.row');
  if (row){ e.preventDefault(); toggle(row); }
});

/* ---- 경로 복사 ---- */
const toast = document.getElementById('toast');
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  e.stopPropagation();
  navigator.clipboard.writeText(FOLDER + b.dataset.copy.replace(/\//g, '\\')).then(() => {
    toast.classList.add('on'); setTimeout(() => toast.classList.remove('on'), 1600);
  }).catch(() => {});
});

document.getElementById('foot').innerHTML =
  `<b>이 페이지는 리포트 원문을 싣지 않습니다.</b> 각 리포트의 저작권은 발행기관에 있으며,
   여기에는 출처를 밝힌 요약과 원문 페이지 링크만 둡니다. PDF는 각 기관 사이트에서 받으세요
   — 행의 <b>원문 열기</b>가 해당 발행기관 페이지로 연결됩니다.<br>
   수집처 — 한국콘텐츠진흥원(KOCCA 포커스 · 세미나자료 · 해외산업동향), 영화진흥위원회,
   한국국제문화교류진흥원, 한국문화관광연구원, 한국방송광고진흥공사, 민간 리서치 등.
   매주 수요일 오전 10시 갱신.`;

render();
</script>
